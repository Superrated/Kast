/* ==== fronts.css ====
   BRUIS Fronts. Colours and fonts come from Fitted (its :root tokens are put in front of this file by build.py).
   Computer: picture left, panel right, price bar at the bottom.
   Phone: picture on top, panel below, steps and price bar at the bottom. */
/* BRUIS look: a maker's sample board. Cool plaster instead of cream, graphite ink, one cobalt for actions,
   raw-MDF tan for small structure; one family (Bricolage Grotesque), condensed and heavy for headings. */
/* BRUIS: a studio look. Stone white, soft black ink, hairline rules; colour comes only from the fronts.
   One light theme on every device, like a brand site (dark-mode tokens from Fitted are overridden). */
:root {
  --bg: #f3f3f1;
  --surface: #f3f3f1;
  --raised: #fbfbfa;
  --ink: #1a1a1a;
  --ink2: #6b6b67;
  --ink3: #8f8f8a;
  --line: #dcdbd6;
  --accent: #1a1a1a;
  --accent-ink: #fbfbfa;
  --accent-soft: rgba(26, 26, 26, 0.05);
  --warn: #8a5a2b;
  --warn-soft: rgba(138, 90, 43, 0.1);
  --mdf: #b49c7c;
  --wall: #e9e8e4;
  --stage: #e9e8e4;
  --floor: #d6d0c6;
  --hatch: #d3d5d1;
  --paper: #fbfbfa;
  --shade: rgba(20, 20, 20, 0.18);
  --f-d: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  --f-b: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  --f-m: 'Bricolage Grotesque', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #f3f3f1;
    --surface: #f3f3f1;
    --raised: #fbfbfa;
    --ink: #1a1a1a;
    --ink2: #6b6b67;
    --ink3: #8f8f8a;
    --line: #dcdbd6;
    --accent: #1a1a1a;
    --accent-ink: #fbfbfa;
    --accent-soft: rgba(26, 26, 26, 0.05);
    --warn: #8a5a2b;
    --warn-soft: rgba(138, 90, 43, 0.1);
    --mdf: #b49c7c;
    --wall: #e9e8e4;
    --stage: #e9e8e4;
    --floor: #d6d0c6;
    --hatch: #d3d5d1;
    --paper: #fbfbfa;
    --shade: rgba(20, 20, 20, 0.18);
    --f-d: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    --f-b: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    --f-m: 'Bricolage Grotesque', ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-b);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
h2 {
  font-family: var(--f-d);
  font-weight: 400;
  font-size: 30px;
  margin: 4px 0 6px;
}
h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink2);
  margin: 22px 0 8px;
}
.lede {
  color: var(--ink2);
  margin: 0 0 14px;
  line-height: 1.45;
}
.hint {
  color: var(--ink2);
  font-size: 13.5px;
  line-height: 1.45;
}
small {
  color: var(--ink2);
}
.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  height: 100dvh;
}
header.top {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand {
  font-family: var(--f-d);
  font-size: 24px;
  white-space: nowrap;
}
.brand b {
  font-family: var(--f-b);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  margin-right: 4px;
}
.brand small {
  display: block;
  font-family: var(--f-b);
  font-size: 11.5px;
  margin-top: -2px;
}
.steps,
.bsteps {
  display: flex;
  gap: 4px;
}
.steps {
  margin-left: auto;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
}
.steps button,
.bsteps button {
  border: 0;
  background: none;
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 600;
  color: var(--ink2);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.steps button i,
.bsteps button i {
  font-style: normal;
  font-size: 11px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: inline-grid;
  place-items: center;
}
.steps button.done i,
.bsteps button.done i {
  background: var(--ink2);
  border-color: var(--ink2);
  color: var(--bg);
}
.steps button.on,
.bsteps button.on {
  background: var(--ink);
  color: var(--bg);
}
.bsteps {
  display: none;
}
.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
  min-height: 0;
}
.stage {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--stage);
  padding: 14px 18px;
}
.stagebar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 13px;
}
.sw {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, 0.15);
  flex: none;
}
.pic {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px 0;
}
.pic svg {
  width: 100%;
  height: 100%;
  max-height: 100%;
}
.pic .dim {
  font: 500 44px var(--f-m);
  fill: var(--ink2);
}
.pic .front.hd {
  cursor: pointer;
}
.pic .front.hd:hover > rect:first-child {
  stroke: var(--accent);
  stroke-opacity: 1;
  stroke-width: 8;
}
.pichint {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: var(--ink2);
  min-height: 18px;
}
.panel {
  overflow: auto;
  padding: 18px 20px 30px;
  background: var(--surface);
  border-left: 1px solid var(--line);
}
.syss,
.stcs,
.mats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mats {
  grid-template-columns: repeat(2, 1fr);
}
.sys,
.stc,
.mat {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--raised);
  border-radius: 14px;
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sys span {
  font-size: 13px;
}
.sys small,
.stc small,
.mat small {
  font-size: 11.5px;
  line-height: 1.3;
}
.sys.on,
.stc.on,
.mat.on {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.stc svg {
  width: 100%;
  height: 92px;
  margin-bottom: 4px;
}
.mat {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  column-gap: 7px;
}
.mat small {
  flex-basis: 100%;
}
.cabs {
  display: grid;
  gap: 10px;
  margin: 14px 0 10px;
}
.cab {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.cabh {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.cabh b {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  display: inline-grid;
  place-items: center;
  font-size: 12px;
}
.sp {
  flex: 1;
}
.ib {
  border: 1px solid var(--line);
  background: none;
  border-radius: 8px;
  width: 30px;
  height: 28px;
  font-size: 12px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0;
}
.row > label {
  width: 58px;
  font-size: 13px;
  color: var(--ink2);
  flex: none;
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
}
.seg button {
  border: 0;
  background: none;
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 13.5px;
  font-weight: 500;
}
.seg button.on {
  background: var(--ink);
  color: var(--bg);
}
.seg button.on small {
  color: inherit;
  opacity: 0.75;
}
.adds {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}
.btn {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: 999px;
  padding: 9px 16px;
  font-weight: 600;
}
.btn.pri {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.ghost {
  background: none;
}
.btn.big {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 14px;
}
.linkb {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
}
.imp {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.imp summary {
  font-weight: 600;
  cursor: pointer;
}
textarea,
input,
select {
  width: 100%;
  font: inherit;
  font-size: 14px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--raised);
  color: var(--ink);
}
textarea {
  font-family: var(--f-m);
  font-size: 12.5px;
}
.field {
  display: block;
  margin: 10px 0;
}
.field > span {
  display: block;
  font-size: 13px;
  color: var(--ink2);
  margin-bottom: 4px;
}
.sws {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.swb {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--raised);
  box-shadow: 0 0 0 1px var(--line);
}
.swb.on {
  box-shadow: 0 0 0 2.5px var(--accent);
}
.ord {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.ord th,
.ord td {
  padding: 7px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
.ord th {
  font-size: 12px;
  color: var(--ink2);
  font-weight: 600;
}
.ord .num {
  text-align: right;
  font-family: var(--f-m);
  font-size: 13px;
  white-space: nowrap;
}
.ord td small {
  display: block;
  font-family: var(--f-b);
  font-size: 11.5px;
}
.ord tfoot td {
  border-bottom: 0;
}
.ord .tot td {
  font-weight: 700;
  font-size: 15px;
  border-top: 2px solid var(--ink);
}
.pbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.ptot {
  margin-right: auto;
  display: flex;
  flex-direction: column;
}
.ptot span {
  font-size: 12px;
  color: var(--ink2);
}
.ptot b {
  font-size: 22px;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 14, 0.45);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
}
.modal[hidden] {
  display: none;
}
.mbox {
  background: var(--surface);
  border-radius: 18px;
  padding: 20px 22px;
  width: min(460px, 100%);
  max-height: 90vh;
  overflow: auto;
}
.otext {
  white-space: pre-wrap;
  font: 12.5px/1.5 var(--f-m);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
}
.legal {
  font-size: 11px;
  color: var(--ink2);
  text-align: center;
  margin: 0;
  padding: 6px 16px 10px;
}

/* ---------- phone ---------- */
@media (max-width: 860px) {
  .app {
    height: auto;
    display: block;
    padding-bottom: 136px;
  }
  header.top {
    padding: 10px 14px;
  }
  .steps {
    display: none;
  }
  .main {
    display: block;
  }
  .stage {
    position: sticky;
    top: 0;
    z-index: 5;
    height: 38vh;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .stagebar {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chip {
    white-space: nowrap;
  }
  .panel {
    border-left: 0;
    padding: 14px 14px 30px;
  }
  .syss,
  .stcs {
    grid-template-columns: repeat(3, 1fr);
  }
  .stc svg {
    height: 70px;
  }
  .mats {
    grid-template-columns: 1fr 1fr;
  }
  .pbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(62px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    padding: 8px 14px;
  }
  .pbar .ghost {
    display: none;
  }
  .bsteps {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around;
  }
  .bsteps button {
    flex-direction: column;
    gap: 3px;
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 12px;
  }
  .legal {
    padding-bottom: 150px;
  }
}

/* ---------- round 2: 3D, a look per front, surprise, quick setup ---------- */
.pic[hidden] {
  display: none;
}
.pic3d {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  padding: 0;
  margin: 10px 0 6px;
}
.pic3d canvas {
  display: block;
  cursor: grab;
}
.pic3d .c3 {
  margin: auto;
  text-align: center;
}
.stagebar {
  align-items: center;
}
.stagebar .seg button {
  padding: 4px 12px;
}
.btn.sm {
  padding: 6px 12px;
  font-size: 13px;
}
.btn.surp {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}
.chip.rec {
  border-color: var(--accent);
  color: var(--accent);
}
.pic .front {
  cursor: pointer;
}
.pic .front:hover > rect:first-child {
  stroke: var(--accent);
  stroke-opacity: 1;
  stroke-width: 8;
}
.stcs.two {
  grid-template-columns: repeat(2, 1fr);
}
.stcs.two .stc svg {
  height: 110px;
}
.mat .tag {
  font-style: normal;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--warn-soft);
  color: var(--warn);
  border-radius: 5px;
  padding: 1px 5px;
}
.sw.gl {
  background-image: repeating-linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.6) 0 2px,
    rgba(0, 0, 0, 0.12) 2px 4px
  ) !important;
}
.sws {
  gap: 10px;
}
.swb {
  width: 54px;
  height: 54px;
  border-radius: 12px;
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.swb span {
  position: absolute;
  top: calc(100% + 3px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 10.5px;
  color: var(--ink2);
  white-space: nowrap;
}
.sws {
  padding-bottom: 18px;
}
.selcard {
  border: 2px solid var(--accent);
  border-radius: 14px;
  padding: 10px 12px;
  margin: 12px 0;
  background: var(--accent-soft);
}
.selcard .seg {
  margin: 6px 0;
}
h3.big {
  font-size: 13px;
  color: var(--ink);
  margin-top: 26px;
}
.qks {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.qk {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--raised);
  border-radius: 12px;
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.qk:hover {
  border-color: var(--accent);
}
.qk small {
  font-size: 11.5px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.syss .sys {
  align-items: flex-start;
}
.ord .lkh td {
  padding-top: 14px;
  font-weight: 600;
  border-bottom: 0;
}
.ord .lkh .sw {
  vertical-align: -2px;
  margin-right: 6px;
}
@media (max-width: 860px) {
  .stagebar .chip.rec {
    display: none;
  }
  .stagebar {
    gap: 5px;
  }
  .stcs.two .stc svg {
    height: 80px;
  }
  .swb {
    width: 46px;
    height: 46px;
  }
}

.stagebar .seg {
  flex-wrap: nowrap;
  flex: none;
}
.btn.surp {
  white-space: nowrap;
}

/* ---------- the IKEA list: paste, see what was found, use it ---------- */
.impcard {
  background: var(--raised);
  border: 1.5px solid var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
  border-radius: 14px;
  padding: 12px;
  margin: 6px 0 4px;
}
.imphead {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.imphead .sp {
  flex: 1;
}
.file {
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.file input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.impcard textarea {
  font-family: var(--f-m);
  font-size: 12.5px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  resize: vertical;
  min-height: 92px;
}
.impprev {
  margin-top: 6px;
}
.igrp {
  border-top: 1px solid var(--line);
  padding: 10px 0 4px;
}
.igrp:first-child {
  border-top: 0;
}
.igh {
  font-size: 14px;
  margin-bottom: 6px;
}
.ichips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 9px;
}
.ichip {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 13px;
}
.ichip small {
  margin-left: 2px;
}
.hint.warn {
  background: var(--warn-soft);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 9px;
}
.impbad {
  font-size: 13.5px;
  color: var(--ink2);
}
.impok {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 14px;
  line-height: 1.5;
  margin: 8px 0 2px;
}
.lnk {
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
  font-weight: 600;
}
.how {
  margin-top: 8px;
  font-size: 13.5px;
}
.how summary {
  cursor: pointer;
  color: var(--ink2);
  font-weight: 600;
}
.how ol {
  margin: 8px 0 4px;
  padding-left: 20px;
  line-height: 1.5;
}
.how li {
  margin-bottom: 4px;
}
.or {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0 12px;
  color: var(--ink2);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.or::before,
.or::after {
  content: '';
  flex: 1;
  border-top: 1px solid var(--line);
}
.addrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
}
.addrow > span {
  font-size: 13px;
  color: var(--ink2);
  margin-right: 4px;
}

.impsub {
  display: flex;
  gap: 14px;
  justify-content: flex-end;
  font-size: 13px;
  margin-top: 4px;
}
@media (max-width: 480px) {
  .stagebar .surp span {
    display: none;
  }
}

/* cabinet cards fold to one line */
details.cab > summary {
  list-style: none;
  cursor: pointer;
  margin-bottom: 0;
}
details.cab > summary::-webkit-details-marker {
  display: none;
}
details.cab[open] > summary {
  margin-bottom: 6px;
}
.cabh span small {
  display: block;
  font-size: 12px;
}

/* demo designs */
.demos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.demo {
  text-align: left;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 9px 11px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.demo.on {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.demo small {
  font-size: 12px;
  line-height: 1.35;
}
.dstrip {
  display: flex;
  height: 22px;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 5px;
  border: 1px solid rgba(0, 0, 0, 0.1);
}
.dstrip i {
  flex: 1;
}
.dstrip i:first-child {
  flex: 3;
}

/* ==== the BRUIS look (applies over the rules above) ==== */
body {
  font-size: 15px;
  font-variation-settings: 'opsz' 14;
}
h2 {
  font-family: var(--f-d);
  font-weight: 750;
  font-stretch: 78%;
  font-variation-settings:
    'wdth' 78,
    'opsz' 48;
  font-size: 32px;
  line-height: 1.02;
  letter-spacing: -0.015em;
  margin: 2px 0 8px;
}
h3,
h3.big {
  font-size: 15.5px;
  font-weight: 650;
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink);
  margin: 26px 0 10px;
}
.lede {
  font-size: 15px;
  max-width: 62ch;
}

/* header: the wordmark and the four steps as one numbered track */
header.top {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 12px 20px;
}
.brand {
  font-family: var(--f-b);
  font-size: 15px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.brand b {
  font-weight: 800;
  font-size: 26px;
  letter-spacing: 0.02em;
  font-variation-settings:
    'wdth' 75,
    'opsz' 96;
  margin: 0;
}
.brand small {
  display: inline;
  font-size: 13px;
  margin: 0;
}
.steps {
  background: none;
  border: 0;
  padding: 0;
  gap: 0;
}
.steps button {
  border-radius: 0;
  padding: 6px 4px 6px 14px;
  position: relative;
  color: var(--ink3);
  font-weight: 600;
}
.steps button + button::before {
  content: '';
  width: 26px;
  border-top: 1.5px solid var(--line);
  margin-right: 10px;
}
.steps button.on {
  background: none;
  color: var(--ink);
}
.steps button.on i {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.steps button.done {
  color: var(--ink2);
}
.steps button.done i,
.bsteps button.done i {
  background: var(--mdf);
  border-color: var(--mdf);
  color: #fff;
}
.steps button i,
.bsteps button i {
  width: 22px;
  height: 22px;
  font-size: 12px;
  font-weight: 700;
}

/* the stage: a wall and a floor */
.stage {
  background: var(--stage);
}
.chip {
  border-radius: 8px;
}
.panel {
  background: var(--surface);
}

/* buttons: squarer, one cobalt for the main action */
.btn {
  border-radius: 10px;
  font-weight: 650;
}
.btn.sm {
  border-radius: 8px;
}
.btn.pri {
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
}
.btn.surp {
  border-radius: 8px;
}
.btn:focus-visible,
.tile:focus-visible,
.sys:focus-visible,
.stc:focus-visible,
.mat:focus-visible,
.seg button:focus-visible,
.swb:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}

/* choice cards: a firm cobalt edge when chosen, no glow */
.sys,
.stc,
.mat,
.cab {
  border-radius: 12px;
  border: 1px solid var(--line);
}
.sys.on,
.stc.on,
.mat.on,
.tile.on {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.sys b {
  font-size: 17px;
  font-weight: 750;
  font-variation-settings: 'wdth' 80;
}
.mat .tag {
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
}
.or {
  text-transform: none;
  letter-spacing: 0;
  font-size: 13px;
}
.seg {
  border-radius: 9px;
}
.seg button {
  border-radius: 6px;
}

/* presets and demos: each one shows its own drawing */
.tiles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.tile {
  text-align: left;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 7px 7px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.tile:hover {
  border-color: var(--ink3);
}
.tile b {
  font-size: 15px;
  font-weight: 700;
  padding: 0 4px;
  margin-top: 6px;
}
.tile small {
  font-size: 12.5px;
  line-height: 1.35;
  padding: 0 4px;
}
.tpic {
  display: block;
  height: 104px;
  background: var(--stage);
  border-radius: 8px;
  overflow: hidden;
  padding: 10px 8px 0;
}
.tpic svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* the IKEA list card */
.impcard {
  border: 1.5px solid var(--ink);
  box-shadow: 4px 4px 0 var(--mdf);
  border-radius: 12px;
}
.impcard textarea {
  font-family: ui-monospace, Menlo, monospace;
}

/* the price bar: a paint chip of your main look, then the price */
.pbar {
  background: var(--bg);
  gap: 14px;
}
.pchip {
  display: flex;
  align-items: stretch;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  min-width: 0;
  max-width: 260px;
}
.pchip i {
  width: 46px;
  flex: none;
}
.pchip span {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 5px 12px 6px 10px;
  min-width: 0;
}
.pchip b {
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pchip small {
  font-size: 11.5px;
  white-space: nowrap;
}
.ptot b {
  font-size: 24px;
  font-weight: 750;
  font-variation-settings:
    'wdth' 80,
    'opsz' 36;
  font-variant-numeric: tabular-nums;
}
.ord .num,
.pic .dim {
  font-variant-numeric: tabular-nums;
}
.pic .dim {
  font-weight: 600;
}
@media (max-width: 860px) {
  .pchip {
    max-width: 44%;
  }
  .pchip i {
    width: 30px;
  }
  .ptot b {
    font-size: 20px;
  }
  .brand b {
    font-size: 22px;
  }
  h2 {
    font-size: 28px;
  }
}
@media (max-width: 400px) {
  .pchip small {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
@media (max-width: 860px) {
  .brand small {
    display: none;
  }
  .bsteps {
    background: var(--bg);
  }
  .bsteps button.on {
    background: none;
    color: var(--ink);
  }
  .bsteps button.on i {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .bsteps button {
    color: var(--ink3);
    font-weight: 600;
  }
}
@media (max-width: 480px) {
  .pchip span {
    display: none;
  }
  .pchip i {
    width: 38px;
    height: 38px;
  }
  .ptot span {
    white-space: nowrap;
  }
}

/* the render: one still picture, with the selection and widths drawn on top */
.pic3d {
  position: relative;
  margin: 10px 0 6px;
  border-radius: 10px;
  background: var(--stage);
}
.pic3d canvas {
  cursor: pointer;
}
.rover {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.rover .osel {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linejoin: round;
}
.rover .odim {
  stroke: rgba(31, 36, 40, 0.55);
  stroke-width: 1.2;
}
.rover .otx {
  font: 600 11px var(--f-b);
  fill: rgba(31, 36, 40, 0.75);
  text-anchor: middle;
}
.rmsg {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 2;
  background: rgba(255, 255, 255, 0.82);
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  padding: 4px 9px;
  font-variant-numeric: tabular-nums;
}
.rmsg[hidden] {
  display: none;
}

/* the finished render is a picture; the canvas works underneath, out of sight */
.pic3d canvas {
  position: absolute;
  inset: 0;
  opacity: 0;
}
.rimg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
  transition: filter 0.6s ease;
}
.rimg:not([src]) {
  visibility: hidden;
}
.rimg.draft {
  filter: blur(10px) saturate(0.9);
}
.rimg.fresh {
  animation: rfade 0.7s ease;
}
@keyframes rfade {
  from {
    opacity: 0.35;
  }
}
.pic3d {
  overflow: hidden;
}
.rbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 26px;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
}
.rbar[hidden] {
  display: none;
}
.rbar i {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  background: rgba(255, 255, 255, 0.9);
  transition: width 0.3s linear;
}
.rbar span {
  position: relative;
  margin: 0 0 8px 12px;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: #fff;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
}
@media (prefers-reduced-motion: reduce) {
  .rimg.fresh {
    animation: none;
  }
}

/* ==== studio layer: image first, quiet type, hairlines instead of boxes ==== */
body {
  font-weight: 400;
  letter-spacing: 0.002em;
}
h2 {
  font-weight: 380;
  font-stretch: 100%;
  font-variation-settings:
    'wdth' 100,
    'opsz' 96;
  font-size: 38px;
  line-height: 1.02;
  letter-spacing: -0.025em;
  margin: 6px 0 12px;
}
h3,
h3.big {
  font-size: 13px;
  font-weight: 560;
  color: var(--ink);
  margin: 34px 0 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.lede {
  color: var(--ink2);
  font-size: 15px;
  line-height: 1.5;
}
.hint {
  font-size: 13px;
}

/* header: wordmark, then the steps as small numbered text */
header.top {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 14px 28px;
}
.brand span {
  font-size: 15px;
  font-weight: 450;
}
.brand small {
  color: var(--ink3);
}
.steps button {
  font-weight: 500;
  font-size: 14px;
  color: var(--ink3);
  padding: 6px 2px 6px 18px;
}
.steps button + button::before {
  width: 18px;
  border-top: 1px solid var(--line);
}
.steps button i,
.bsteps button i {
  border: 0;
  width: auto;
  height: auto;
  background: none !important;
  color: inherit !important;
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.steps button.on,
.bsteps button.on {
  color: var(--ink);
  background: none;
}
.steps button.on span,
.bsteps button.on span {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 6px;
}

/* the stage: the render runs edge to edge, the caption underneath */
.stage {
  padding: 0;
  background: var(--stage);
}
.pic3d {
  margin: 0;
  border-radius: 0;
}
.pic {
  padding: 0;
}
.stagebar {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 12px 28px 16px;
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.cap {
  margin: 0;
  font-size: 13.5px;
  color: var(--ink2);
  line-height: 1.45;
  flex: 1;
}
.cap b {
  color: var(--ink);
  font-weight: 560;
}
.cap span {
  display: block;
  color: var(--ink3);
  font-size: 12.5px;
}
.lnk.surp {
  font-weight: 500;
  font-size: 13.5px;
  color: var(--ink);
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
  white-space: nowrap;
}
.rover .osel {
  stroke: #fff;
  stroke-width: 2;
  filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.5));
}

/* the panel: a spec sheet */
.panel {
  background: var(--bg);
  border-left: 1px solid var(--line);
  padding: 26px 28px 40px;
}
.btn {
  border-radius: 2px;
  border: 1px solid var(--ink);
  background: transparent;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.btn.sm {
  border-radius: 2px;
}
.btn.pri {
  background: var(--ink);
  color: var(--accent-ink);
  box-shadow: none;
}
.btn.surp {
  border-radius: 2px;
  background: transparent;
  color: var(--ink);
}
.lnk {
  color: var(--ink);
  font-weight: 500;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
.seg {
  border-radius: 2px;
  background: transparent;
  border: 1px solid var(--line);
  padding: 2px;
}
.seg button {
  border-radius: 1px;
  font-weight: 450;
  color: var(--ink2);
}
.seg button.on {
  background: var(--ink);
  color: var(--accent-ink);
}

/* choices: borderless pictures with a caption; the chosen one gets a fine ink rule */
.tile,
.stc,
.sys {
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 0;
  box-shadow: none;
}
.tile.on,
.stc.on,
.sys.on {
  box-shadow: none;
}
.tpic,
.stc svg {
  border-radius: 2px;
  outline: 1px solid transparent;
  outline-offset: 3px;
}
.tile.on .tpic,
.stc.on svg {
  outline-color: var(--ink);
}
.tile:hover .tpic,
.stc:hover svg {
  outline-color: var(--line);
}
.tile b,
.stc b {
  font-size: 14px;
  font-weight: 560;
  padding: 0;
  margin-top: 9px;
}
.tile small,
.stc small {
  padding: 0;
  font-size: 12.5px;
}
.tiles {
  gap: 22px 16px;
}
.syss {
  gap: 0;
  border: 1px solid var(--line);
}
.sys {
  padding: 12px 14px;
  border-right: 1px solid var(--line);
}
.sys:last-child {
  border-right: 0;
}
.sys.on {
  background: var(--ink);
  color: var(--accent-ink);
}
.sys.on span {
  color: inherit;
  opacity: 0.75;
}
.sys b {
  font-variation-settings: 'wdth' 100;
  font-weight: 600;
  font-size: 15px;
}

/* materials as a list of rows */
.mats {
  grid-template-columns: 1fr;
  gap: 0;
  border-top: 1px solid var(--line);
}
.mat {
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  padding: 12px 4px;
  box-shadow: none;
}
.mat.on {
  box-shadow: none;
  background: var(--accent-soft);
}
.mat b {
  font-weight: 560;
}
.mat .sw {
  width: 22px;
  height: 22px;
  border-radius: 1px;
}
.mat.on b::after {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-left: 8px;
  vertical-align: middle;
  background: var(--ink);
  border-radius: 50%;
}
.mat .tag {
  background: none;
  color: var(--warn);
  padding: 0;
  font-weight: 500;
}
.swb {
  border-radius: 1px;
  border: 0;
  box-shadow: none;
  outline: 1px solid transparent;
  outline-offset: 3px;
}
.swb.on {
  box-shadow: none;
  outline-color: var(--ink);
}

/* cards that stay boxes: the IKEA list, cabinets, the selected front */
.impcard {
  border: 1px solid var(--ink);
  box-shadow: none;
  border-radius: 2px;
  background: var(--raised);
}
.impcard textarea {
  border-radius: 2px;
  background: var(--bg);
}
.cab,
details.cab {
  border-radius: 2px;
  background: transparent;
}
.cabh b {
  background: none;
  color: var(--ink3);
  width: auto;
  font-weight: 500;
}
.ib {
  border-radius: 2px;
}
.selcard {
  border: 1px solid var(--ink);
  border-radius: 2px;
  background: var(--raised);
}
.impok {
  border-radius: 2px;
  background: var(--accent-soft);
}
.hint.warn {
  border-radius: 2px;
}
.or {
  font-size: 12.5px;
  color: var(--ink3);
}
.ord .tot td {
  border-top: 1px solid var(--ink);
}
.btn.big {
  border-radius: 2px;
  padding: 16px;
}

/* the price bar */
.pbar {
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 12px 28px;

        for (let i = 0; i < n; i++)

            c.w / n,
            c.h,
            W / n - g,
            H - g,
            x0 + (i * W) / n + g / 2,
            y0 + g / 2,
            n === 1 ? 'R' : i === 0 ? 'L' : 'R'

          c.h,
          W / n - g,
          H - g,
          x0 + (i * W) / n + g / 2,
          y0 + g / 2,
          n === 1 ? 'R' : i === 0 ? 'L' : 'R'

      else stack = c.h === 38 ? [38] : Array.from({ length: c.h / 64 }, () => 64);

      stack.forEach(sh => {
        y -= sh * 10;
        const isDrawer = c.layout === 'drawers';
        add(
          isDrawer ? 'drawer' : 'door',
          60,
          sh,
          596,
          realH[sh],

          y + (sh * 10 - realH[sh]) / 2,

}

/* ---------- the whole layout: cabinets placed side by side, kitchen wall cabinets above ---------- */
function layout() {
  const cabs = [],
    fronts = [];
  const plinth = S.sys === 'metod' ? 100 : S.sys === 'besta' ? 120 : 0;
  let xb = 0,
    xw = 0;
  // the floor row first (base and tall cabinets), so the wall row can skip the tall ones
  const tall = [],
    pos = new Map();
  S.cabs.forEach(c => {
    const kd = SYS[c.sys].kinds[c.kind] || {};
    if (c.sys === 'metod' && kd.row === 'wall') return;
    pos.set(c.id, [xb, plinth]);
    if (c.kind === 'high') tall.push([xb, xb + c.w * 10]);
    xb += c.w * 10;
  });
  S.cabs.forEach(c => {
    const kd = SYS[c.sys].kinds[c.kind] || {};
    if (!(c.sys === 'metod' && kd.row === 'wall')) return;
    // a wall cabinet never hangs where a tall cabinet stands: move along past it
    let moved = true;
    while (moved) {
      moved = false;
      tall.forEach(([a, b]) => {
        if (xw < b && xw + c.w * 10 > a) {
          xw = b;
          moved = true;
        }
      });
    }
    pos.set(c.id, [xw, 2200 - c.h * 10]); // wall cabinets hang with their tops in one line
    xw += c.w * 10;
  });
  S.cabs.forEach(c => {
    const [x, y] = pos.get(c.id),
      pc = { c, x, y, w: c.w * 10, h: c.h * 10 };
    cabs.push(pc);
    frontsOf(c, x, y).forEach(f => fronts.push(f));
  });
  const W = Math.max(xb, xw, 600),
    Hmax = Math.max(...cabs.map(p => p.y + p.h), 900);
  return {
    cabs,
    fronts,
    sides: sidesOf(cabs),
    W,
    H: Hmax,
    plinth,
    worktop: S.sys === 'metod' && S.cabs.some(c => c.kind === 'base')
  };
}

/* a small picture of a whole design (a preset or a demo): cabinets, side panels and fronts in its own look.

/* ==== 25-3d.js ====
   The picture: one still, ray-traced render of your cabinets with the new fronts — matt paint, oak and walnut
   grain, birch and pine ply, raw MDF, flutes and grooves as real relief, fluted glass in its frame, the handles.
   three.js draws a quick first frame; three-gpu-pathtracer then traces light rays (soft shadows, light bouncing
   off the floor and between the doors) and refines the same still image over a second or two.
   The camera does not move. Tap a front to select it: a drawn outline shows which one.
   If 3D can't load (no internet, no WebGL), the flat drawing from 20-draw.js is shown instead.
   three r170 and the path tracer come from jsDelivr through the import map in app.html.
*/
const V3 = { ready: false, loading: false, failed: false, tex: {}, meshes: [], gen: 0, cache: new Map() };
const PT_MAX = () => V3.max || (innerWidth <= 860 ? 140 : 320); // samples per still: enough to clear the noise

/* the stage: the last finished render as a picture, the working canvas hidden under it, the selection on top */
const STAGE3D =
  '<img class="rimg" id="rimg" alt="Your cabinets with the new fronts, in a room"><svg class="rover" id="rover" aria-hidden="true"></svg><div class="rbar" id="rbar"><i id="rbarI"></i><span id="rmsg"></span></div>';
function showShot(src, instant) {
  const im = document.getElementById('rimg');
  if (!im) return;
  im.classList.toggle('draft', !!V3.drafting);
  if (instant) im.src = src;
  else {
    const n = new Image();
    n.onload = () => {
      im.src = src;
      im.classList.remove('fresh');
      void im.offsetWidth;
      im.classList.add('fresh');
    };
    n.src = src;
  }
}
function grabShot(draft) {
  try {
    V3.drafting = draft;
    const src = V3.r.domElement.toDataURL('image/jpeg', 0.92);
    if (!draft) V3.shot = src;
    if (!draft || !V3.shot) showShot(src, draft);
    else document.getElementById('rimg').classList.add('working');
  } catch (e) {
    /* keep what is shown */
  }
}
function open3D() {
  const el = document.getElementById('pic3d');
  if (V3.ready) return start3D(el);
  if (V3.loading) return;
  V3.loading = true;
  el.innerHTML = '<p class="hint c3">Setting up the render…</p>';
  Promise.all([
    import('three'),
    import('three-gpu-pathtracer').catch(() => null),
    import('three/examples/jsm/geometries/RoundedBoxGeometry.js').catch(() => null),
    import('three/examples/jsm/utils/BufferGeometryUtils.js').catch(() => null)
  ])
    .then(([T, PT, RB, BGU]) => {
      V3.merge = BGU && BGU.mergeGeometries;
      V3.T = T;
      V3.PT = PT;
      V3.RB = RB && RB.RoundedBoxGeometry;
      start3D(el);
    })
    .catch(() => {
      V3.failed = true;
      V3.loading = false;
      render();
    });
}
/* a soft studio sky: bright from the front-left like a big window, darker below; HDR so the window lights the scene */
function envTex(T) {
  const w = 128,
    h = 64,
    d = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const v = 1 - y / (h - 1), // 1 = up, 0 = down
        u = x / w,
        // the window: a soft patch up and to the front-left
        du = Math.min(Math.abs(u - 0.36), 1 - Math.abs(u - 0.36)),
        win = Math.exp(-((du / 0.08) ** 2) - ((v - 0.64) / 0.12) ** 2) * 4,
        base = v > 0.5 ? 0.85 + 0.35 * (v - 0.5) : 0.42 + 0.86 * v,
        k = (y * w + x) * 4;
      d[k] = base * 0.98 + win;
      d[k + 1] = base * 0.97 + win * 0.96;
      d[k + 2] = base * 0.94 + win * 0.9;
      d[k + 3] = 1;
    }
  const t = new T.DataTexture(d, w, h, T.RGBAFormat, T.FloatType);
  t.mapping = T.EquirectangularReflectionMapping;
  t.magFilter = t.minFilter = T.LinearFilter;
  t.needsUpdate = true;
  return t;
}
function start3D(el) {
  const T = V3.T;
  if (!T) return;
  if (!V3.ready) {
    let r;
    try {
      r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    } catch (e) {
      V3.failed = true;
      return render();
    }
    r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    r.outputColorSpace = T.SRGBColorSpace;
    r.toneMapping = T.NeutralToneMapping;
    r.toneMappingExposure = 0.82;
    r.shadowMap.enabled = true;
    r.shadowMap.type = T.PCFSoftShadowMap;
    const sc = new T.Scene();
    sc.background = new T.Color('#e6e7e2');
    sc.environment = envTex(T);
    const cam = new T.PerspectiveCamera(24, 1, 10, 80000);
    // a weak sun for the quick first frame's shadows; the path tracer gets most of its light from the sky
    const sun = new T.DirectionalLight(0xffeedb, 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0004;
    sc.add(sun, sun.target);
    let pt = null;
    if (V3.PT && V3.PT.WebGLPathTracer)
      try {
        pt = new V3.PT.WebGLPathTracer(r);
        pt.bounces = 4;
        pt.minSamples = 1;
        pt.fadeDuration = 0;
        pt.renderDelay = 0;
        pt.filterGlossyFactor = 0.5;
        pt.renderScale = innerWidth <= 860 ? 0.75 : 1;
        if (innerWidth <= 860) pt.tiles.set(2, 2);
        // a light edge-aware denoise as the traced image goes to the screen, stronger while samples are few
        if (V3.PT.DenoiseMaterial) {
          const dn = new V3.PT.DenoiseMaterial({
            map: null,
            blending: T.NoBlending,
            transparent: true,
            premultipliedAlpha: r.getContextAttributes().premultipliedAlpha
          });
          pt.renderToCanvasCallback = (target, renderer, quad) => {
            const m = quad.material,
              n = pt.samples;
            dn.map = m.map;
            dn.opacity = m.opacity;
            dn.sigma = n < 16 ? 4 : n < 64 ? 2.5 : 1.6;
            dn.threshold = n < 16 ? 0.08 : n < 64 ? 0.04 : 0.025;
            quad.material = dn;
            const ac = renderer.autoClear;
            renderer.autoClear = false;
            quad.render(renderer);
            renderer.autoClear = ac;
            quad.material = m;
          };
        }
      } catch (e) {
        pt = null;
      }
    Object.assign(V3, { r, sc, cam, sun, pt, ready: true, loading: false, root: null });
    el.innerHTML = STAGE3D;
    el.prepend(r.domElement);
    el.addEventListener('click', tap3D);
    new ResizeObserver(() => draw3D(true)).observe(el);
  } else if (!el.contains(V3.r.domElement)) {
    el.innerHTML = STAGE3D;
    el.prepend(V3.r.domElement);
    if (V3.shot) showShot(V3.shot, true);
  }
  build3D();
}

/* ---------- textures, made once ---------- */
function canvasTex(w, h, paint, normal) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new V3.T.CanvasTexture(c);
  t.wrapS = t.wrapT = V3.T.RepeatWrapping;
  if (!normal) t.colorSpace = V3.T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function woodTex(k, oil) {
  const tk = 'w' + k + (MATS[k].oil ? oil || 'pure' : '');
  if (V3.tex[tk]) return V3.tex[tk];
  const m = Object.assign({}, MATS[k], woodCol(k, oil));
  const t = canvasTex(256, 1024, (g, w, h) => {
    g.fillStyle = m.wood;
    g.fillRect(0, 0, w, h);
    const r = prng(k.length * 97 + 7);
    if (m.flame) {
      // pine plywood: nested flame arches with a few straight streaks between them
      for (let i = 0; i < 26; i++) {
        g.strokeStyle = m.grain;
        g.globalAlpha = 0.06 + r() * 0.06;
        g.lineWidth = 1 + r() * 2;
        const x = r() * w;
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x + (r() - 0.5) * 10, h);
        g.stroke();
      }
      [
        [w * 0.3, h * 0.05],
        [w * 0.78, h * 0.5]
      ].forEach(([cx, oy]) => {
        for (let j = 0; j < 9; j++) {
          const hw = 10 + j * 9 + r() * 4,
            top = oy + 30 + j * 30;
          g.globalAlpha = 0.22 + (j % 3) * 0.1;
          g.lineWidth = 2 + (j % 2) * 3;
          g.beginPath();
          g.moveTo(cx - hw, oy + h * 0.5);
          g.bezierCurveTo(cx - hw, top + 160, cx - hw * 0.62, top, cx, top);
          g.bezierCurveTo(cx + hw * 0.62, top, cx + hw, top + 160, cx + hw, oy + h * 0.5);
          g.stroke();
        }
      });
      g.globalAlpha = 1;
      return;
    }
    if (m.raw && !m.grain) {
      // raw MDF: fine, even speckle
      for (let i = 0; i < 5000; i++) {
        g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.06)';
        g.fillRect(r() * w, r() * h, 1.5, 1.5);
      }
      return;
    }
    for (let i = 0; i < 70; i++) {
      const x = r() * w,
        a = (m.ply ? 0.05 : 0.1) + r() * (m.ply ? 0.06 : 0.14);
      g.strokeStyle = m.grain;
      g.globalAlpha = a;
      g.lineWidth = 0.6 + r() * 2.2;
      g.beginPath();
      g.moveTo(x, 0);
      g.bezierCurveTo(x + (r() - 0.5) * 30, h * 0.33, x + (r() - 0.5) * 30, h * 0.66, x + (r() - 0.5) * 16, h);
      g.stroke();
    }
    g.globalAlpha = 1;
  });
  return (V3.tex[tk] = t);
}
/* flutes as a normal map: one rounded flute across the width of the canvas */
function fluteTex(dir) {
  const key = 'fl' + dir;
  if (V3.tex[key]) return V3.tex[key];
  const N = 64,
    t = canvasTex(
      dir === 'v' ? N : 4,
      dir === 'v' ? 4 : N,
      (g, w, h) => {
        for (let i = 0; i < N; i++) {
          const u = (i + 0.5) / N,
            s = Math.cos(u * Math.PI) * 0.85, // slope across the flute: left side faces left, right side faces right
            nx = -s,
            nz = Math.sqrt(Math.max(0, 1 - nx * nx));
          const col = `rgb(${Math.round((nx * 0.5 + 0.5) * 255)},128,${Math.round((nz * 0.5 + 0.5) * 255)})`;
          g.fillStyle =
            dir === 'v' ? col : `rgb(128,${Math.round((-nx * 0.5 + 0.5) * 255)},${Math.round((nz * 0.5 + 0.5) * 255)})`;
          if (dir === 'v') g.fillRect(i, 0, 1, h);
          else g.fillRect(0, i, w, 1);
        }
      },
      true
    );
  return (V3.tex[key] = t);
}
/* grooves as a normal map: flat, with one narrow V across the canvas */
function grooveTex(dir) {
  const key = 'gr' + dir;
  if (V3.tex[key]) return V3.tex[key];
  const N = 64,
    t = canvasTex(
      dir === 'v' ? N : 4,
      dir === 'v' ? 4 : N,
      (g, w, h) => {
        for (let i = 0; i < N; i++) {
          const u = i - N / 2,
            nx = Math.abs(u) <= 2 ? (u < 0 ? 0.7 : -0.7) : 0,
            nz = Math.sqrt(1 - nx * nx);
          g.fillStyle =
            dir === 'v'
              ? `rgb(${Math.round((nx * 0.5 + 0.5) * 255)},128,${Math.round((nz * 0.5 + 0.5) * 255)})`
              : `rgb(128,${Math.round((-nx * 0.5 + 0.5) * 255)},${Math.round((nz * 0.5 + 0.5) * 255)})`;
          if (dir === 'v') g.fillRect(i, 0, 1, h);
          else g.fillRect(0, i, w, 1);
        }
      },
      true
    );
  return (V3.tex[key] = t);
}
function matFor(lk, f, noRelief) {
  const T = V3.T,
    m = MATS[lk.mat],
    o = { roughness: 0.52, metalness: 0 };
  // matt spray paint; hardwax oil gives wood a soft satin sheen
  if (m.paint) o.color = new T.Color(colHex(lk.col));
  else if (m.glass) return null;
  else {
    const t = woodTex(lk.mat, lk.oil).clone();
    t.needsUpdate = true;
    t.repeat.set(f.w / 260, f.h / 1000);
    o.map = t;
    o.roughness = m.raw ? 0.85 : 0.5;
    if (m.oil) Object.assign(o, { clearcoat: 0.22, clearcoatRoughness: 0.45 });
  }
  if (!noRelief && (lk.style === 'fluted' || lk.style === 'grooves')) {
    const gr = lk.style === 'grooves',
      p = gr ? S.flute.gpitch : S.flute.pitch,
      n = (gr ? grooveTex : fluteTex)(S.flute.dir).clone();
    n.needsUpdate = true;
    if (S.flute.dir === 'v') n.repeat.set(f.w / p, 1);
    else n.repeat.set(1, f.h / p);
    o.normalMap = n;
    o.normalScale = new T.Vector2(gr ? 3 : 1.4, gr ? 3 : 1.4);
  }
  return new T.MeshPhysicalMaterial(o);
}

/* the ribs of a fluted front, as one mesh centred on the front: half-rounds side by side at the chosen pitch,
   7.5 mm proud of the slab, stopping 12 mm short of the edges like a routed panel */
const FLUTE_D = 7.5;
function fluteMesh(f, mat, FT) {
  const T = V3.T,
    v = S.flute.dir === 'v',
    span = v ? f.w : f.h,
    len = (v ? f.h : f.w) - 24,
    n = Math.max(2, Math.round((span - 8) / S.flute.pitch)),
    pw = (span - 8) / n,
    parts = [];
  for (let i = 0; i < n; i++) {
    const g = new T.CylinderGeometry(pw / 2, pw / 2, len, 12, 1, true, -Math.PI / 2, Math.PI);
    g.scale(1, 1, FLUTE_D / (pw / 2)); // as deep as a routed flute
    if (!v) g.rotateZ(Math.PI / 2);
    const o = -span / 2 + 4 + pw / 2 + i * pw;
    g.translate(v ? o : 0, v ? 0 : o, FT / 2 - FLUTE_D);
    parts.push(g);
  }
  const ms = new T.Mesh(V3.merge(parts), mat);
  ms.castShadow = ms.receiveShadow = true;
  return ms;
}

/* ---------- the scene ---------- */
const DEPTH = { pax: 580, metod: { base: 600, high: 600, wall: 370 }, besta: 420 };
/* what the picture shows; the scene is only rebuilt (and traced again) when this changes */
function sceneKey() {
  return JSON.stringify([
    S.sys,
    S.cabs,
    S.fx,
    S.flip,
    S.style,
    S.mat,
    S.col,
    S.oil,
    S.handle,
    S.hfin,
    S.gframe,
    S.flute,
    S.sides,
    S.edge
  ]);
}
function build3D() {
  if (!V3.ready) return;
  const key = sceneKey();
  if (key === V3.key && V3.L) return overlay3D();
  V3.key = key;
  if (!V3.ready) return;
  const T = V3.T,
    L = layout();
  if (V3.root) {
    V3.sc.remove(V3.root);
    V3.root.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material.dispose) o.material.dispose();
    });
  }

    const ms = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    ms.position.set(x, y, z);
    ms.castShadow = cast;
    ms.receiveShadow = true;
    root.add(ms);
    return ms;
  };
  // fronts and side panels with their real edge: a 2 mm round, or a small chamfer
  const rbox = (w, h, d, mat, x, y, z) => {
    if (!V3.RB) return box(w, h, d, mat, x, y, z);
    const ch = S.edge === 'chamfer',
      ms = new T.Mesh(new V3.RB(w, h, d, ch ? 1 : 3, ch ? 3.5 : 2.5), mat);

  room3D(T, root, L, box);

  L.cabs.forEach(p => {
    const d = S.sys === 'metod' ? DEPTH.metod[p.c.kind] : DEPTH[S.sys],
      t = 16,
      z0 = -d;
    box(t, p.h, d, white, p.x + t / 2, p.y + p.h / 2, z0 + d / 2);
    box(t, p.h, d, white, p.x + p.w - t / 2, p.y + p.h / 2, z0 + d / 2);
    box(p.w, t, d, white, p.x + p.w / 2, p.y + t / 2, z0 + d / 2);
    box(p.w, t, d, white, p.x + p.w / 2, p.y + p.h - t / 2, z0 + d / 2);
    box(p.w, p.h, 4, inner, p.x + p.w / 2, p.y + p.h / 2, z0 + 2, false);
    const n = Math.max(1, Math.round(p.h / 380));
    for (let k = 1; k < n; k++)
      box(p.w - 2 * t, t, d - 30, white, p.x + p.w / 2, p.y + (k * p.h) / n, z0 + (d - 30) / 2, false);
  });
  if (S.sys === 'metod') {

      if (tops.length) {
        const a2 = Math.min(...tops.map(p => p.x)),

          b2 - a2 + 20,

        c.position.set(x, L.plinth / 2, -60);

  }
  // side panels, flush with the front of the fronts
  L.sides.forEach(sd => {
    const lk = sideLook();
    rbox(SIDE_T, sd.h, sd.w, matFor(lk, { w: sd.w, h: sd.h }), sd.x + SIDE_T / 2, sd.y + sd.h / 2, 20 - sd.w / 2);
  });
  // the fronts
  const FT = 19,
    hcache = {};
  L.fronts.forEach(f => {
    const lk = lookOf(f),
      m = MATS[lk.mat],
      cx = f.x + f.w / 2,
      cy = f.y + f.h / 2,
      cz = FT / 2 + 1;
    let hit;
    if (m.glass) {
      const fr = 22,
        fm = new T.MeshStandardMaterial({
          color: GFRAME[S.gframe].hex,

      box(f.w, fr, FT, fm, cx, f.y + fr / 2, cz);

}
function handle3D(f, lk, root, cache, FT) {

/* ---------- camera, turning and tapping ---------- */
/* ---------- the room around the cabinets ----------
   Oak plank floor, a warm plaster wall with a skirting board, a side wall on the left with a tall window the
   sun comes through, a wool rug and a plant. All in millimetres, the cabinets' back against the wall (z < 0). */
function plankTex() {
  if (V3.tex.planks) return V3.tex.planks;
  // 8 planks of 180 mm side by side, 2400 mm long, ends staggered
  const t = canvasTex(512, 1024, (g, w, h) => {
    const r = prng(41),
      pw = w / 8;
    g.fillStyle = 'rgb(200,168,126)';
    g.fillRect(0, 0, w, h);
    for (let i = 0; i < 8; i++) {
      const off = r() * h * 0.62;
      for (let k = -1; k < 3; k++) {
        const y0 = off + k * h * 0.62,
          len = h * 0.62;
        const l = 0.92 + r() * 0.14;
        g.fillStyle = `rgb(${Math.round(203 * l)},${Math.round(170 * l)},${Math.round(128 * l)})`;
        g.fillRect(i * pw, y0, pw, len);
        g.strokeStyle = 'rgba(110,80,45,.10)';
        for (let q = 0; q < 9; q++) {
          const x = i * pw + 4 + r() * (pw - 8);
          g.lineWidth = 0.6 + r() * 1.4;
          g.beginPath();
          g.moveTo(x, y0);
          g.bezierCurveTo(x + (r() - 0.5) * 8, y0 + len * 0.3, x + (r() - 0.5) * 8, y0 + len * 0.7, x, y0 + len);
          g.stroke();
        }
        g.fillStyle = 'rgba(70,50,30,.35)';
        g.fillRect(i * pw, y0, pw, 1.5);
      }
      g.fillStyle = 'rgba(70,50,30,.4)';
      g.fillRect(i * pw, 0, 1.5, h);
    }
  });
  return (V3.tex.planks = t);
}
function plasterTex() {
  if (V3.tex.plaster) return V3.tex.plaster;
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#ece8e0';
    g.fillRect(0, 0, w, h);
    const r = prng(7);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,.025)' : 'rgba(255,255,255,.05)';
      const s = 1 + r() * 3;
      g.fillRect(r() * w, r() * h, s, s);
    }
  });
  return (V3.tex.plaster = t);
}
function room3D(T, root, L, box) {
  const W = L.W,
    D = S.sys === 'metod' ? 600 : S.sys === 'besta' ? 420 : 580,
    xl = -1500, // the side wall

    zf = 6500,

  const ft = plankTex().clone();

    new T.PlaneGeometry(xr - xl, zf + D),

  root.add(floor);
  // back wall and skirting
  const pt = plasterTex().clone();

  const plaster = new T.MeshStandardMaterial({ map: pt, roughness: 0.95 });
  const back = new T.Mesh(new T.PlaneGeometry(xr - xl, wallH), plaster);

  // side wall with a tall window (the opening lets the sun and the sky in)

    w0 = 700,
    w1 = 2300, // window from z = 700 to 2300
    y0 = 650,
    y1 = 2550;
  const side = (z0, z1, ya, yb) => {
    const ms = box(t, yb - ya, z1 - z0, plaster, xl - t / 2, (ya + yb) / 2, (z0 + z1) / 2);
    ms.receiveShadow = true;
  };
  side(-D - 2, w0, 0, wallH);
  side(w1, zf, 0, wallH);
  side(w0, w1, 0, y0);
  side(w0, w1, y1, wallH);
  // a slim dark steel window frame and a deep sill
  const steel = new T.MeshStandardMaterial({ color: '#2b2d2f', roughness: 0.4, metalness: 0.5 });
  box(30, y1 - y0, 30, steel, xl + 10, (y0 + y1) / 2, w0 + 15);
  box(30, y1 - y0, 30, steel, xl + 10, (y0 + y1) / 2, w1 - 15);
  box(30, 30, w1 - w0, steel, xl + 10, y1 - 15, (w0 + w1) / 2);
  box(30, 30, w1 - w0, steel, xl + 10, (y0 + y1) / 2, (w0 + w1) / 2);
  box(
    t + 60,
    30,
    w1 - w0 + 40,
    new T.MeshStandardMaterial({ color: '#d9d4ca', roughness: 0.7 }),
    xl - t / 2 + 20,
    y0 - 15,

  );
  // the ceiling: closes the room so light comes in through the window and the open front, like an interior
  const ceil = new T.Mesh(
    new T.PlaneGeometry(xr - xl, zf + D),
    new T.MeshStandardMaterial({ color: '#f4f2ee', roughness: 0.9 })
  );
  ceil.rotation.x = Math.PI / 2;

  // a wool rug in front of the cabinets

  rug.castShadow = false;
  // a plant in a stone pot, to the right of the run

    new T.CylinderGeometry(190, 150, 420, 32),

  );
  pot.position.set(px, 210, pz);
  pot.castShadow = pot.receiveShadow = true;
  root.add(pot);
  const soil = new T.Mesh(
    new T.CylinderGeometry(175, 175, 10, 24),
    new T.MeshStandardMaterial({ color: '#3b2f25', roughness: 1 })
  );
  soil.position.set(px, 412, pz);
  root.add(soil);
  const leaf = new T.MeshStandardMaterial({ color: '#4f6b43', roughness: 0.6, side: T.DoubleSide }),
    stem = new T.MeshStandardMaterial({ color: '#6b5a3e', roughness: 0.8 }),
    r = prng(5);
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + r() * 0.5,
      tilt = 0.35 + r() * 0.5,
      len = 520 + r() * 420,
      base = new T.Vector3(px, 415, pz),
      dir = new T.Vector3(Math.sin(a) * Math.sin(tilt), Math.cos(tilt), Math.cos(a) * Math.sin(tilt)),
      tip = base.clone().addScaledVector(dir, len);
    const st = new T.Mesh(new T.CylinderGeometry(5, 7, len, 6), stem);
    st.position.copy(base).addScaledVector(dir, len / 2);
    st.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir);
    root.add(st);
    const lf = new T.Mesh(new T.SphereGeometry(1, 16, 10), leaf);
    lf.scale.set(70 + r() * 35, 230 + r() * 110, 9);
    lf.position.copy(tip);
    lf.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir);
    lf.rotateY(r() * Math.PI);
    lf.castShadow = true;
    root.add(lf);
  }
}

/* the fixed camera: a little to the left and above, looking at the middle of the run, everything in frame */
function draw3D(resized) {
  if (!V3.ready || !V3.L) return;
  const el = V3.r.domElement.parentElement;
  if (!el || !el.clientWidth) return;
  const w = el.clientWidth,
    h = el.clientHeight,
    L = V3.L,
    cam = V3.cam,
    T = V3.T;
  V3.r.setSize(w, h, false);
  V3.r.domElement.style.width = w + 'px';
  V3.r.domElement.style.height = h + 'px';
  const H = Math.max(L.H, 900),
    tgt = new T.Vector3((L.W + 200) / 2, H / 2 + 60, 0),
    yaw = -0.2,
    pitch = 0; // level camera: verticals stay straight, like an architectural photo
  cam.aspect = w / h;
  const span = Math.max((L.W + 1700) / cam.aspect, H + 500) * 1.08,
    dist = span / 2 / Math.tan((cam.fov * Math.PI) / 360);
  cam.position.set(
    tgt.x + Math.sin(yaw) * Math.cos(pitch) * dist,
    tgt.y + Math.sin(pitch) * dist,
    Math.cos(yaw) * Math.cos(pitch) * dist
  );
  cam.lookAt(tgt);
  cam.updateProjectionMatrix();
  overlay3D();
  // a design already rendered at this size shows straight away
  const ck = V3.key + '|' + w + 'x' + h;
  if (V3.cache.has(ck)) {
    V3.gen++;
    V3.drafting = false;
    V3.shot = V3.cache.get(ck);
    showShot(V3.shot, true);
    document.getElementById('rimg').classList.remove('working', 'draft');
    return msg3D('');
  }
  if (!V3.pt) {
    V3.r.render(V3.sc, cam);
    grabShot(false);
    keepShot(ck);
    return msg3D('');
  }
  if (V3.ptScene !== V3.key) {
    msg3D('Rendering');
    // a quick first frame, shown soft until the traced one is ready
    V3.r.render(V3.sc, cam);
    grabShot(true);
    try {
      V3.pt.setScene(V3.sc, cam);
    } catch (e) {
      V3.pt = null;
      V3.r.render(V3.sc, cam);
      grabShot(false);
      return msg3D('');
    }
    V3.ptScene = V3.key;
  } else V3.pt.updateCamera();
  trace3D(ck);
}
/* finished renders, kept for this visit (the last 16) */
function keepShot(ck) {
  if (!V3.shot) return;
  V3.cache.set(ck, V3.shot);
  if (V3.cache.size > 16) V3.cache.delete(V3.cache.keys().next().value);
}
/* refine the still: one path-traced sample per frame until it is clean, then stop */
function trace3D(ck) {
  const g = ++V3.gen,
    pt = V3.pt,
    max = PT_MAX();
  const step = () => {
    if (g !== V3.gen || !V3.r.domElement.isConnected) return;
    try {
      // a few samples per frame while the picture is out of sight
      for (let k = 0; k < 2; k++) pt.renderSample();
    } catch (e) {
      V3.pt = null;
      V3.r.render(V3.sc, V3.cam);
      grabShot(false);
      return msg3D('');
    }
    const n = Math.floor(pt.samples);
    if (n < max) {
      msg3D('Rendering', n / max);
      requestAnimationFrame(step);
    } else {
      grabShot(false);
      keepShot(ck);
      document.getElementById('rimg').classList.remove('working', 'draft');
      msg3D('');
    }
  };
  requestAnimationFrame(step);
}
function msg3D(t, f) {
  const b = document.getElementById('rbar');
  if (!b) return;
  b.hidden = !t;
  document.getElementById('rmsg').textContent = t;
  document.getElementById('rbarI').style.width = Math.round((f || 0.02) * 100) + '%';
}
/* on top of the render: the outline of the selected front, at its place in the picture */
function overlay3D() {
  const svg = document.getElementById('rover');
  if (!svg) return;
  const T = V3.T,
    cam = V3.cam,
    el = V3.r.domElement,
    w = el.clientWidth,
    h = el.clientHeight,
    P = (x, y, z) => {
      const v = new T.Vector3(x, y, z).project(cam);
      return [((v.x + 1) / 2) * w, ((1 - v.y) / 2) * h];
    };
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let o = '';
  const f = S.sel && V3.L.fronts.find(x => x.id === S.sel);
  if (f) {
    const z = 21,
      pts = [
        P(f.x - 4, f.y - 4, z),
        P(f.x + f.w + 4, f.y - 4, z),
        P(f.x + f.w + 4, f.y + f.h + 4, z),
        P(f.x - 4, f.y + f.h + 4, z)
      ];
    o += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" class="osel"/>`;

function tap3D(e) {
  const T = V3.T,
    rc = V3.r.domElement.getBoundingClientRect(),
    v = new T.Vector2(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1),
    ray = new T.Raycaster();
  ray.setFromCamera(v, V3.cam);
  const hit = ray.intersectObjects(V3.meshes, false)[0];
  selectFront(hit ? hit.object.userData.fid : null);
}

/* ==== 30-ui.js ====

const STEPS = [

const segC = (act, c, cur, opts) =>

const f1 = v => (Math.round(v * 10) / 10).toString();

function render() {
  if (!matOk(S.style, S.mat)) S.style = MATS[S.mat] && MATS[S.mat].only ? MATS[S.mat].only : 'flat';
  const L = layout(),

  ).join('');
  document.getElementById('steps').innerHTML = stepBtns;
  document.getElementById('bsteps').innerHTML = stepBtns;

function quickMake(q, sys) {
  sys = sys || S.sys;
  const mk = (kind, w, h, lay) => {
    const c = cab(sys, kind, w, h, lay);
    fixLayout(c);
    return c;
  };
  if (Array.isArray(q)) return q.map(([w, h, lay]) => mk('frame', w, h, lay));
  const out = [];
  ['high', 'base', 'wall'].forEach(k =>
    (q[k] || []).forEach(e => {
      const [w, lay] = Array.isArray(e) ? e : [e];
      out.push(mk(k, w, SYS.metod.kinds[k].heights[k === 'high' ? 1 : k === 'wall' ? 2 : 0], lay));
    })
  );
  return out;
}
/* "100 50 100" or "2x100 50" → widths, each snapped to the nearest IKEA width */
function parseWidths(txt, widths) {
  const out = [];
  String(txt || '')
    .replace(/,/g, ' ')
    .split(/\s+/)
    .filter(Boolean)
    .forEach(t => {
      const m = t.match(/^(?:(\d+)\s*[x×*])?(\d{2,3})$/i);
      if (!m) return;
      const n = Math.min(12, +(m[1] || 1)),
        w = widths.reduce((b, v) => (Math.abs(v - +m[2]) < Math.abs(b - +m[2]) ? v : b), widths[0]);
      for (let i = 0; i < n; i++) out.push(w);
    });
  return out;
}

/* ==== 40-import.js ====
   Read an IKEA list — the planner's item list, the shopping cart, an order confirmation, or typed by hand —
   and turn every PAX frame, METOD cabinet and BESTÅ frame into a cabinet. Everything else (doors, hinges,
   legs, drawers) is skipped, but IKEA doors and drawer fronts are counted so we can compare.

   Copied text comes in two shapes, and both work:
     one item per line      PAX Wardrobe frame, white, 100x58x236 cm   2 pcs
     one item over lines    PAX
                            Wardrobe frame, white, 100x58x236 cm
                            € 95
                            2
   A new item starts at a line that begins with an IKEA name in capitals (PAX, METOD / MAXIMERA, KOMPLEMENT …)
   or names one of the three systems; lines in between belong to the item above.
   English, Dutch, French and German words are understood. Sizes are width × depth × height in cm
   ("cm" may be left out); with two numbers the second is the height, unless it is clearly a depth.
   METOD cabinets that come with drawers or doors ("with 3 drawers", "2 fronts/4 drawers", "met 2 deuren")
   get the matching front layout.
*/
const IMPORT_EXAMPLE = `PAX Wardrobe frame, white, 100x58x236 cm   2 pcs
PAX Wardrobe frame, white, 50x58x236 cm   1 pcs
KOMPLEMENT Hinge with damper, 4 pack   3
METOD / MAXIMERA Base cabinet with 3 drawers, white/Voxtorp, 60x60x80 cm   Qty: 1
METOD Base cabinet frame, white, 80x60x80 cm   Qty: 2
METOD Wall cabinet with 2 doors, white, 80x37x80 cm   2
METOD High cabinet frame, white, 60x60x200 cm   1
BESTÅ Frame, white, 120x40x38 cm   1`;

const IMP = {
  frame:
    /FRAME|CABINET|CARCASS|STOMME|KORPUS|CORPS|CAISSON|OMBOUW|ONDERKAST|BOVENKAST|HOGE ?KAST|KASTFRAME|KAST\b|SCHRANK|ÉLÉMENT|ELEMENT|ÉLT\b|ELT\b|ARMOIRE|BENCH|BANC|MEUBLE|UNIT\b/,
  // words that make the head of the line something else than a frame
  other:
    /\b(DOORS?|DEUR(EN)?|PORTES?|TÜR(EN)?|FRONTS?|FRONTEN|FAÇADES?|FACADES?|HINGES?|SCHARNIER(EN)?|CHARNIÈRES?|LEGS?|POOT|POTEN|PIEDS?|FÜSSE|PLINTH|PLINT|SOCLE|SOCKEL|SHELF|SHELVES|PLANK(EN)?|TABLETTES?|EINLEGEBODEN|RAILS?|KNOBS?|HANDLES?|GREPEN?|GREEP|POIGNÉES?|GRIFFE?|COVER PANEL|DEKPANEEL|PANNEAU|ABDECKSEITE|DECO STRIP|WORKTOP|COUNTERTOP|WERKBLAD|PLAN DE TRAVAIL|DRAWERS?|LADES?|LADEN|TIROIRS?|SCHUBLADEN?|INTERIOR|ORGANI[SZ]ER|MIRROR|SPIEGEL|LIGHTING|LED)\b/,
  combo: /COMBINATION|COMBINATIE|COMBINAISON|KOMBINATION/,
  wall: /WALL|BOVENKAST|WANDKAST|OBERSCHRANK|WANDSCHRANK|MURAL|ÉLÉMENT HAUT|\bBOVEN\b/,
  high: /HIGH|TALL|HOGE ?KAST|HOCHSCHRANK|ARMOIRE|COLONNE/,
  doorFront:
    /\b(DOORS?|DEUR(EN)?|PORTES?|TÜR(EN)?|DRAWER FRONTS?|LADEFRONTS?|FAÇADES? DE TIROIR|SCHUBLADENFRONTS?|FRONTS?)\b/,
  depths: [20, 35, 37, 39, 40, 42, 58, 60, 61]
};

/* split the text into items */
function impBlocks(text) {
  const blocks = [];
  String(text || '')
    .replace(/ /g, ' ')
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(Boolean)
    .forEach(l => {
      const starts =
        /^(\d{1,2}\s*[x×]\s+)?[A-ZÅÄÖ]{3,}(\s*\/\s*[A-ZÅÄÖ]{3,})*(\s|,|$)/.test(l) ||
        /\b(pax|metod|best[aå])\b/i.test(l);
      if (starts || !blocks.length) blocks.push([l]);
      else blocks[blocks.length - 1].push(l);
    });
  return blocks;
}
function impQty(lines) {
  const all = lines.join('  '),
    pats = [
      /^\s*(\d{1,2})\s*[x×]\s+/i,
      /(?:QTY|QUANTITY|AANTAL|ANTAL|QUANTITÉ|QTÉ|ANZAHL|MENGE)\s*[:.]?\s*(\d{1,3})/i,
      /(\d{1,3})\s*(?:PCS|PC|PIECES|PIÈCES|ST|STK|STUKS?)\.?(?:\s|$)/i,
      /(?:^|[^\d\s])\s*[x×]\s*(\d{1,2})\s*$/i
    ];
  for (const p of pats) {
    const m = all.match(p);
    if (m) return +m[1];
  }
  // a table row: a cell that is just a number (tabs or wide gaps between the columns)
  for (const l of lines) {
    const cells = l.split(/\t|\s{2,}/).map(c => c.trim());
    const q = cells.slice(1).find(c => /^\d{1,2}$/.test(c));
    if (q) return +q;
  }
  const after = all.match(/\bcm\.?\s+(\d{1,2})\s*$/i) || all.match(/\b(\d)\s*[x×]\s+(?=\d{2,3}\s*[x×])/i);
  if (after) return +after[1];
  // a line that is just a number (the quantity column), or a number at the end after a wide gap
  for (const l of lines.slice(1)) if (/^\d{1,2}$/.test(l)) return +l;
  const t = lines[0].match(/\s{2,}(\d{1,2})\s*$/);
  return t ? +t[1] : 1;
}
const impNum = s => +String(s).replace(',', '.');
/* a PAX combination's width as frames: as many 100s as fit, then a 50 or 75 (125 = 75 + 50) */
function paxSplit(w) {
  if (w < 50 || w > 600 || w % 25) return null;
  let n = Math.floor(w / 100),
    r = w - n * 100;
  const out = [];
  if (r === 25) {
    if (!n) return null;
    n--;
    out.push(75, 50);
  } else if (r) out.push(r);
  return Array(n).fill(100).concat(out);
}

function parsePlanner(text, only) {
  const found = [],
    skipped = [],
    notes = [],
    combos = [];
  let ikeaFronts = 0;
  impBlocks(text).forEach(lines => {
    const line = lines.join(' '),
      up = line.toUpperCase(),
      sys = /\bPAX\b/.test(up)
        ? 'pax'
        : /\bMETOD\b/.test(up)
          ? 'metod'
          : /\bBEST[AÅ](?![A-Z])/.test(up)
            ? 'besta'
            : null;
    // the head: the name of the thing, before its colour, size and "with …"
    const head = up.replace(/^\d{1,2}\s*[x×]\s+/, '').split(/,|\s(?:WITH|W\/|MET|AVEC|MIT|FOR|VOOR|POUR|FÜR)\s/)[0];
    const dm = line.match(/(\d{2,3}(?:[.,]\d)?)\s*[x×*]\s*(\d{2,3}(?:[.,]\d)?)(?:\s*[x×*]\s*(\d{2,3}(?:[.,]\d)?))?/);
    const qty = Math.min(impQty(lines), 30);
    if (IMP.combo.test(head)) {
      const pw = dm && sys === 'pax' ? paxSplit(impNum(dm[1])) : null;
      if (!pw || /CORNER|HOEK|ANGLE|ECK/.test(up)) {
        if (sys) combos.push(line);
        return;
      }
      const hh = impNum(dm[3] || dm[2]) > 210 ? 236 : 201;
      for (let q = 0; q < qty; q++)
        pw.forEach(w => found.push(cab('pax', 'frame', w, hh, /\bOPEN\b/.test(up) ? 'open' : 'doors')));
      notes.push(`PAX combination ${impNum(dm[1])} cm wide read as frames ${pw.join(' + ')} — check the order below.`);
      return;
    }
    const name = head.replace(/\b(PAX|METOD|BEST[AÅ])\b/g, ''),
      fm = name.match(IMP.frame),
      om = name.match(IMP.other),
      bare = !name
        .replace(
          /\d+([.,]\d)?|[x×*\/:\-]|\bCM\b|\b(BASE|WALL|HIGH|TALL|FRAME|ONDER|BOVEN|HOOG|HOGE|BAS|MURAL|PCS|ST|QTY)\b/gi,
          ''
        )
        .trim();
    const isFrame = sys && dm && ((fm && (!om || om.index > fm.index)) || (bare && !om));
    if (!isFrame) {
      if (dm && IMP.doorFront.test(head) && !/HINGE|SCHARNIER|CHARNIÈRE|SCHARNIERE/.test(up)) ikeaFronts += qty;
      if (sys || /^[A-ZÅÄÖ]{3,}/.test(lines[0])) skipped.push(lines[0]);
      return;
    }
    if (!dm) {
      notes.push(`No size found in “${lines[0].slice(0, 60)}” — add the size like 60x60x80 cm.`);
      return;
    }
    if (only && sys !== only) {
      skipped.push(lines[0]);
      return;
    }
    let kind = 'frame';
    if (sys === 'metod') kind = IMP.wall.test(up) ? 'wall' : IMP.high.test(up) ? 'high' : 'base';
    const kd = SYS[sys].kinds[kind],
      a = impNum(dm[1]),
      b = impNum(dm[2]),
      c3 = dm[3] ? impNum(dm[3]) : null;
    // width × depth × height; with two numbers the second is the height unless it is a depth
    const w = a,
      h =
        c3 != null
          ? c3
          : IMP.depths.includes(b)
            ? kd.heights[kind === 'high' ? kd.heights.length - 1 : kind === 'wall' ? 2 : 0]
            : b;
    const near = (list, v) => list.reduce((p, q) => (Math.abs(q - v) < Math.abs(p - v) ? q : p), list[0]);
    const W = near(kd.widths, w),
      H = near(kd.heights, h);
    if (Math.abs(W - w) > 2 || Math.abs(H - h) > 2)
      notes.push(
        `${SYS[sys].name} ${w}×${h} is not a standard size — read as ${W}×${H}. Check it in your cabinets below.`
      );
    const lay = impLayout(sys, kind, W, H, up);
    for (let i = 0; i < qty; i++) {
      const c = cab(sys, kind, W, H, lay || undefined);
      fixLayout(c);
      found.push(c);
    }
  });
  if (combos.length)
    notes.push(
      `${combos.length} ready-made combination${combos.length === 1 ? '' : 's'} (like PAX/FORSAND) can’t be split into frames from the name alone — paste the frame lines, or type the widths below.`
    );
  return { found, skipped, notes, ikeaFronts };
}

/* the front layout a cabinet came with, from words like "with 3 drawers", "2 fronts/4 drawers", "met 2 deuren" */
function impLayout(sys, kind, w, h, up) {
  const num = re => {
    const m = up.match(re);
    return m ? +m[1] : 0;
  };
  const nf = num(/(\d)\s*(?:FRONTS?|FRONTEN|FAÇADES?|FACES)\b/),
    nd = num(/(\d)\s*(?:HIGH\s+|LOW\s+)?(?:DRAWERS?|LADES?|LADEN|TIROIRS?|SCHUBLADEN?)\b/),
    nDoor = num(/(\d)\s*(?:DOORS?|DEUREN|PORTES|TÜREN)\b/) || (/\b(DOOR|DEUR|PORTE|TÜR)\b/.test(up) ? 1 : 0),
    hasDrawer = /\b(DRAWERS?|LADES?|LADEN|TIROIRS?|SCHUBLADEN?)\b/.test(up);
  if (sys === 'pax') return /\bOPEN\b/.test(up) ? 'open' : 'doors';
  if (sys === 'besta') return hasDrawer ? 'drawers' : null;
  if (kind === 'base') {
    if (hasDrawer && nDoor) return 'drawer_door';
    if (hasDrawer) {
      const n = nf || nd || 3;
      return n >= 4 ? 'drawers4' : n === 3 ? 'drawers3' : n === 2 ? 'drawers2' : 'drawer_door';
    }
    if (nDoor) return nDoor >= 2 && w >= 60 ? 'doors2' : 'door';
    return null;
  }
  if (kind === 'wall') return nDoor >= 2 && w >= 60 ? 'doors2' : nDoor ? 'door' : null;
  if (kind === 'high') return nDoor >= 2 && h === 200 ? 'split' : null;
  return null;
}

/* what the reader found, as a short preview with a button per system */
function impPreviewHTML(text) {
  if (!String(text || '').trim())
    return `<p class="hint">Nothing pasted yet. <button type="button" class="lnk" data-act="impEx">Try an example list</button></p>`;
  const r = parsePlanner(text),
    bySys = {};
  r.found.forEach(c => (bySys[c.sys] = bySys[c.sys] || []).push(c));
  if (!r.found.length)
    return `<p class="impbad">No PAX, METOD or BESTÅ frames in this text yet.${r.notes.length ? ' ' + esc(r.notes[0]) : ' Each item needs its name and a size, like “METOD Base cabinet frame 60x60x80 cm”.'}</p>`;
  const order = Object.keys(bySys).sort((p, q) => bySys[q].length - bySys[p].length);
  const groups = order
    .map(sys => {
      const m = new Map();
      bySys[sys].forEach(c => {
        const k = `${c.kind}|${c.w}|${c.h}|${c.layout}`;
        m.set(k, (m.get(k) || 0) + 1);
      });
      const chips = [...m.entries()]
        .map(([k, n]) => {
          const [kind, w, h, lay] = k.split('|'),
            kd = SYS[sys].kinds[kind],
            ln = (LAYOUTS[sys === 'metod' ? 'metod_' + kind : sys] || []).find(x => x[0] === lay);
          return `<span class="ichip"><b>${n}×</b> ${sys === 'metod' ? kd.label.replace(' cabinet', '') : 'Frame'} ${w}×${h}${ln && ln[0] !== 'door' && ln[0] !== 'doors' ? ` <small>${esc(ln[1].toLowerCase())}</small>` : ''}</span>`;
        })
        .join('');
      return `<div class="igrp"><div class="igh"><b>${SYS[sys].name}</b> ${bySys[sys].length} cabinet${bySys[sys].length === 1 ? '' : 's'}</div><div class="ichips">${chips}</div>
        <button type="button" class="btn ${sys === order[0] ? 'pri' : ''} sm" data-act="impUse" data-a="${sys}">Use ${order.length > 1 ? 'these ' + bySys[sys].length + ' ' + SYS[sys].name : 'these ' + bySys[sys].length} cabinet${bySys[sys].length === 1 ? '' : 's'}</button></div>`;
    })
    .join('');
  const ours = order.length
    ? (() => {
        const n = layoutFronts(bySys[order[0]]);
        return r.ikeaFronts
          ? `<p class="hint">Your list also has ${r.ikeaFronts} IKEA door${r.ikeaFronts === 1 ? '' : 's'} and drawer fronts; these cabinets take ${n} of ours.${r.ikeaFronts !== n ? ' Check the fronts per cabinet after you use them.' : ''}</p>`
          : '';
      })()
    : '';
  return `${groups}${r.notes.map(n => `<p class="hint warn">${esc(n)}</p>`).join('')}${ours}${order.length > 1 ? '<p class="hint">One system per order for now — use one, order, then come back for the other.</p>' : ''}`;
}
function layoutFronts(cabs) {
  return cabs.reduce((n, c) => n + frontsOf(c, 0, 0).length, 0);
}

/* ==== 45-surprise.js ====
   "Surprise me": not a dice roll but a recipe, like Fitted's. Each recipe is a small rule set a designer would use —
   one bold colour, wood with one colour, two colours that go together, a glass accent, birch, walnut — and gives
   every front its look by what it is: a tall door, a drawer, a wall cabinet, the top row. Handles follow the colours:
   brass on dark and saturated colours, black on light colours and birch, the same colour for a quiet look.
*/
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
const BOLD = ['cobalt', 'midnight', 'racing', 'mustard', 'terracotta', 'tomato', 'oxblood', 'plum'];
const DARK = { cobalt: 1, midnight: 1, racing: 1, oxblood: 1, plum: 1, black: 1, terracotta: 1, tomato: 1 };
// colours that sit well together (first the main one, then the partner)
const PAIRS = [
  ['cobalt', 'chalk'],
  ['racing', 'blush'],
  ['oxblood', 'blush'],
  ['terracotta', 'sage'],
  ['midnight', 'mustard'],
  ['plum', 'sage'],
  ['tomato', 'chalk'],
  ['racing', 'mustard'],
  ['black', 'terracotta']
];
/* what a front is, for the rules */
function roleOf(f) {
  if (f.kind === 'drawer') return 'drawer';
  if (f.ckind === 'wall') return 'wall';
  if (f.sys === 'besta') return f.y > 700 ? 'top' : 'low';
  if (f.h > 1200) return 'tall';
  return 'door';
}
const RECIPES = [
  {
    name: 'One bold colour',
    make(r) {
      const c = pick(r, BOLD);
      return {
        all: { mat: 'painted', col: c, style: pick(r, ['fluted', 'fluted', 'grooves']) },
        by: { drawer: { style: 'flat' } },
        hfin: DARK[c] ? 'brass' : 'black',
        say: COLOURS[c].name
      };
    }
  },
  {
    name: 'Wood and one colour',
    make(r) {
      const wood = pick(r, ['oak', 'walnut']),
        c = pick(
          r,
          wood === 'oak'
            ? ['racing', 'cobalt', 'terracotta', 'midnight', 'tomato']
            : ['mustard', 'blush', 'sage', 'chalk', 'terracotta']
        );
      return {
        all: { mat: wood, style: 'flat' },
        by: {
          drawer: { mat: 'painted', col: c, style: 'flat' },
          wall: { mat: 'painted', col: c, style: 'flat' },
          top: { mat: 'painted', col: c, style: 'flat' }
        },
        hfin: wood === 'walnut' ? 'brass' : 'black',
        say: `${MATS[wood].name.replace(' veneer', '')} & ${COLOURS[c].name.toLowerCase()}`
      };
    }
  },
  {
    name: 'Two colours',
    make(r) {
      const [a, b] = pick(r, PAIRS);
      return {
        all: { mat: 'painted', col: a, style: 'fluted' },
        by: { wall: { col: b, style: 'flat' }, top: { col: b, style: 'flat' }, drawer: { col: a, style: 'flat' } },
        hfin: DARK[a] ? 'brass' : 'black',
        say: `${COLOURS[a].name} & ${COLOURS[b].name.toLowerCase()}`
      };
    }
  },
  {
    name: 'Glass accent',
    make(r) {
      const base = pick(r, ['walnut', 'oak', 'painted']),
        c = pick(r, ['midnight', 'racing', 'oxblood', 'black', 'chalk']);
      const look = base === 'painted' ? { mat: 'painted', col: c, style: 'flat' } : { mat: base, style: 'flat' };
      return {
        all: look,
        by: { wall: { mat: 'glass' }, top: { mat: 'glass' }, tall: { mat: 'glass', every: 2 } },
        gframe: base === 'oak' ? 'oak' : pick(r, ['black', 'alu']),
        hfin: base === 'walnut' || DARK[c] ? 'brass' : 'black',
        say: `${base === 'painted' ? COLOURS[c].name : MATS[base].name.replace(' veneer', '')} & fluted glass`
      };
    }
  },
  {
    name: 'Plywood with colour',
    make(r) {
      const c = pick(r, ['tomato', 'cobalt', 'mustard', 'racing', 'blush']),
        ply = pick(r, ['birch', 'birch', 'pine']);
      return {
        all: { mat: ply, style: 'flat', oil: pick(r, ['pure', 'white5', 'smoke5']) },
        by: { drawer: { mat: 'painted', col: c, style: 'flat' } },
        handle: pick(r, ['push', 'tab', 'grip']),
        hfin: 'black',
        say: `${ply === 'pine' ? 'Pine' : 'Birch'} & ${COLOURS[c].name.toLowerCase()}`
      };
    }
  },
  {
    name: 'Charcoal oak',
    make(r) {
      const c = pick(r, ['mustard', 'terracotta', 'sage', 'blush']);
      return {
        all: { mat: 'oak', style: 'flat', oil: 'charcoal' },
        by: { drawer: { mat: 'painted', col: c, style: 'grooves' } },
        handle: 'bar',
        hfin: 'brass',
        say: `Charcoal-oiled oak & ${COLOURS[c].name.toLowerCase()} grooves`
      };
    }
  },
  {
    name: 'Walnut, quietly',
    make() {
      return {
        all: { mat: 'walnut', style: 'flat' },
        by: {},
        handle: 'bar',
        hfin: 'brass',
        say: 'Walnut'
      };
    }
  }
];
function surprise(seed) {
  const r = prng(seed || Date.now() & 0xffffffff),
    L = layout();
  // glass needs something to show off: skip glass recipes when nothing suits it
  const okR = RECIPES.filter(
    x => x.name !== 'Glass accent' || L.fronts.some(f => ['wall', 'top', 'tall'].includes(roleOf(f)))
  );
  let rec = pick(r, okR);
  if (okR.length > 1 && rec.name === S.recipe)
    rec = okR[(okR.indexOf(rec) + 1 + Math.floor(r() * (okR.length - 1))) % okR.length];
  const plan = rec.make(r);
  applyPlan(plan, r);
  S.recipe = rec.name;
  S.recipeSay = plan.say;
  S.sel = null;
}

/* put a plan on the fronts: a look for all, and other looks by role (drawers, wall cabinets, tall doors …) */
function applyPlan(plan, r) {
  S.style = plan.all.style || 'flat';
  S.mat = plan.all.mat;
  if (plan.all.col) S.col = plan.all.col;
  S.oil = plan.all.oil || 'pure';
  S.fx = {};
  const count = {};
  layout().fronts.forEach(f => {
    const role = roleOf(f),
      o = plan.by[role];
    if (!o) return;
    count[role] = (count[role] || 0) + 1;
    if (o.every && count[role] % o.every) return; // e.g. every other tall door in glass
    const lk = Object.assign({}, plan.all, o);
    delete lk.every;
    if (lk.mat !== S.mat || lk.style !== S.style || (lk.col && lk.col !== S.col) || (lk.oil && lk.oil !== S.oil))
      S.fx[f.id] = lk;
  });
  if (plan.gframe) S.gframe = plan.gframe;
  S.handle = plan.handle || (r ? pick(r, ['knob', 'bar', 'knob', 'push']) : 'knob');
  S.hfin = S.handle === 'tab' ? 'black' : plan.hfin || 'brass';
}

   Open one to see what the configurator can do, then change anything.
   A cabinet here: [kind, width, height, front layout]. Looks by role work like the Surprise recipes
   (drawer, wall, tall, top, low, door). */
const DEMOS = [

  },

      ['base', 60, 80, 'drawers2'],
      ['base', 80, 80, 'doors2'],
      ['wall', 80, 60, 'doors2'],
      ['wall', 60, 60, 'door'],
      ['wall', 60, 60, 'door'],
      ['wall', 80, 60, 'doors2']
    ],

  {

    cabs: [
      ['frame', 100, 236, 'doors'],
      ['frame', 50, 236, 'doors'],
      ['frame', 100, 236, 'doors']
    ],
    all: { mat: 'painted', col: 'midnight', style: 'fluted' },
    by: {},
    handle: 'push',
    sides: 'both',
    edge: 'round'
  },
  {
    name: 'Birch under the eaves',
    say: 'Low PAX in birch ply, White 5% oil, cut-out grips, chamfered edges',
    sys: 'pax',
    cabs: [
      ['frame', 100, 201, 'doors'],

    ],

  },

      ['frame', 60, 192, 'door']
    ],
    all: { mat: 'walnut', style: 'flat' },
    by: { top: { mat: 'glass', style: 'fluted' } },
    gframe: 'oak',
    handle: 'bar',
    hfin: 'brass',
    sides: 'none',
    edge: 'round'
  },
  {

      ['frame', 120, 64, 'drawers'],

    ],

    by: {},
    handle: 'knob',

    sides: 'both',
    edge: 'round'
  }
];
/* the state a demo sets, worked out once (its cabinets, looks per front, sides, edge, handles) */
const DEMO_ST = [];
function demoState(i) {
  if (DEMO_ST[i]) return DEMO_ST[i];
  const d = DEMOS[i],
    keep = S;
  S = Object.assign({}, keep, { sys: d.sys, flip: {}, fx: {}, sel: null });
  S.cabs = d.cabs.map(([kind, w, h, lay]) => {
    const c = cab(d.sys, kind, w, h, lay);
    fixLayout(c);
    return c;
  });
  applyPlan(d);
  const st = {
    sys: S.sys,
    cabs: S.cabs,
    fx: S.fx,
    style: S.style,
    mat: S.mat,
    col: S.col,
    oil: S.oil,
    handle: S.handle,
    hfin: S.hfin,
    gframe: S.gframe,
    sides: d.sides || 'none',
    edge: d.edge || 'round'
  };
  S = keep;
  return (DEMO_ST[i] = st);
}
function loadDemo(i) {
  const d = DEMOS[i];
  if (!d) return;
  S.undo = JSON.stringify({ sys: S.sys, cabs: S.cabs, fx: S.fx, flip: S.flip });
  Object.assign(S, JSON.parse(JSON.stringify(demoState(i))));
  S.flip = {};
  S.recipe = null;
  S.demo = d.name;
  S.sel = null;
  S.impMsg = '';
}
/* the demo cards: a picture of the design, its name and one line */
function demosHTML() {
  return `<div class="tiles">${DEMOS.map(
    (d, i) =>
      `<button type="button" class="tile ${S.demo === d.name ? 'on' : ''}" data-act="demo" data-a="${i}"><span class="tpic">${designThumb('demo' + i, demoState(i))}</span><b>${esc(d.name)}</b><small>${SYS[d.sys].name}, ${esc(d.say.charAt(0).toLowerCase() + d.say.slice(1))}</small></button>`
  ).join('')}</div>`;
}
