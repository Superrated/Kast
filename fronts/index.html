    const ch = S.edge === 'chamfer',
      ms = new T.Mesh(new V3.RB(w, h, d, ch ? 1 : 3, ch ? 3.5 : 2.5), mat);
    ms.position.set(x, y, z);
    ms.castShadow = ms.receiveShadow = true;
    root.add(ms);
    return ms;
  };
  const white = new T.MeshStandardMaterial({ color: '#f2f1ec', roughness: 0.7 }),
    inner = new T.MeshStandardMaterial({ color: '#dedcd5', roughness: 0.8 });
  const W = L.W,
    Dmax = S.sys === 'metod' ? 600 : DEPTH[S.sys],
    dOf = c => (c.sys === 'metod' ? DEPTH.metod[c.kind] || 600 : DEPTH[c.sys] || 580),
    zfOf = {}; // where each cabinet's front plane is (wall cabinets are shallower)
  // the IKEA boxes, backs against the wall: open at the front, so glass and open shelves show the inside
  L.cabs.forEach(p => {
    const d = dOf(p.c),
      t = 16,
      z0 = -Dmax;
    zfOf[p.c.id] = d - Dmax;
    box(t, p.h, d, white, p.x + t / 2, p.y + p.h / 2, z0 + d / 2);
    box(t, p.h, d, white, p.x + p.w - t / 2, p.y + p.h / 2, z0 + d / 2);
    box(p.w, t, d, white, p.x + p.w / 2, p.y + t / 2, z0 + d / 2);
    box(p.w, t, d, white, p.x + p.w / 2, p.y + p.h - t / 2, z0 + d / 2);
    box(p.w, p.h, 4, inner, p.x + p.w / 2, p.y + p.h / 2, z0 + 2, false);
    const n = Math.max(1, Math.round(p.h / 380));
    for (let k = 1; k < n; k++)
      box(p.w - 2 * t, t, d - 30, white, p.x + p.w / 2, p.y + (k * p.h) / n, z0 + (d - 30) / 2, false);
  });
  if (S.sys === 'metod') {
    const bases = L.cabs.filter(p => p.c.kind !== 'wall');
    if (bases.length) {
      const a = Math.min(...bases.map(p => p.x)),
        b = Math.max(...bases.map(p => p.x + p.w));
      box(
        b - a,
        L.plinth - 10,
        18,
        S.plinth === 'match'
          ? matFor(Object.assign({}, sideLook(), { style: 'flat' }), { w: b - a, h: L.plinth })
          : new T.MeshStandardMaterial({ color: '#2a2a28', roughness: 0.6 }),
        (a + b) / 2,
        (L.plinth - 10) / 2,
        -40
      );
      const tops = L.cabs.filter(p => p.c.kind === 'base');
      if (tops.length) {
        const a2 = Math.min(...tops.map(p => p.x)),
          b2 = Math.max(...tops.map(p => p.x + p.w));
        box(
          b2 - a2 + 20,
          40,
          640,
          new T.MeshPhysicalMaterial({ color: '#d6d0c4', roughness: 0.35, clearcoat: 0.3 }),
          (a2 + b2) / 2,
          920,
          -600 + 320 + 20
        );
      }
    }
  }
  if (S.sys === 'besta') {
    const leg = new T.MeshStandardMaterial({ color: '#8f8f8a', roughness: 0.4, metalness: 0.6 });
    L.cabs.forEach(p => {
      [p.x + 52, p.x + p.w - 52].forEach(x => {
        const c = new T.Mesh(new T.CylinderGeometry(12, 12, L.plinth, 16), leg);
        c.position.set(x, L.plinth / 2, -60);
        c.castShadow = true;
        root.add(c);
      });
    });
  }
  // side panels, against the wall and flush with the fronts
  L.sides.forEach(sd => {
    const lk = sideLook();
    rbox(SIDE_T, sd.h, sd.w, matFor(lk, { w: sd.w, h: sd.h }), sd.x + SIDE_T / 2, sd.y + sd.h / 2, -Dmax + sd.w / 2);
  });
  // the fronts
  const FT = 19,
    hcache = {};
  L.fronts.forEach(f => {
    const lk = lookOf(f),
      m = MATS[lk.mat],
      cx = f.x + f.w / 2,
      cy = f.y + f.h / 2,
      cz = FT / 2 + 1,
      n0 = root.children.length;
    let hit;
    if (m.glass) {
      const fr = 22,
        fm = new T.MeshStandardMaterial({
          color: GFRAME[S.gframe].hex,
          roughness: S.gframe === 'oak' ? 0.5 : 0.35,
          metalness: S.gframe === 'oak' ? 0 : 0.6
        });
      box(f.w, fr, FT, fm, cx, f.y + f.h - fr / 2, cz);
      box(f.w, fr, FT, fm, cx, f.y + fr / 2, cz);
      box(fr, f.h - 2 * fr, FT, fm, f.x + fr / 2, cy, cz);
      box(fr, f.h - 2 * fr, FT, fm, f.x + f.w - fr / 2, cy, cz);
      const nm = fluteTex(S.flute.dir).clone();
      nm.needsUpdate = true;
      if (S.flute.dir === 'v') nm.repeat.set((f.w - 2 * fr) / S.flute.pitch, 1);
      else nm.repeat.set(1, (f.h - 2 * fr) / S.flute.pitch);
      // reeded glass, faked: a pale see-through pane that blurs the shelves behind it
      const gm = new T.MeshPhysicalMaterial({
        color: '#e4ece9',
        roughness: 0.25,
        metalness: 0,
        transparent: true,
        opacity: 0.62,
        normalMap: nm,
        normalScale: new T.Vector2(2.2, 2.2),
        clearcoat: 1,
        clearcoatRoughness: 0.1
      });
      hit = box(f.w - 2 * fr, f.h - 2 * fr, 6, gm, cx, cy, cz, false);
    } else if (lk.style === 'fluted' && V3.merge) {
      // real flutes: half-round ribs on a thinner slab, so they catch the light like the routed board
      const mat = matFor(lk, f, true);
      hit = rbox(f.w, f.h, FT - FLUTE_D, mat, cx, cy, cz - FLUTE_D / 2);
      const fl = fluteMesh(f, mat, FT);
      fl.position.set(cx, cy, cz);
      fl.userData.fid = f.id;
      root.add(fl);
      V3.meshes.push(fl);
    } else hit = rbox(f.w, f.h, FT, matFor(lk, f), cx, cy, cz);
    hit.userData.fid = f.id;
    V3.meshes.push(hit);
    handle3D(f, lk, root, hcache, FT);
    // wall cabinets are shallower: their fronts (and handles) sit further back
    const zf = zfOf[f.cab] || 0;
    if (zf) for (let i = n0; i < root.children.length; i++) root.children[i].position.z += zf;
  });
  if (!S.zoom) plant3D(T, root, W + 520, -Dmax + 380);
  contact3D(T, root, L, Dmax, dOf);
  // the whole run stands centred against the back wall
  root.position.set(-W / 2, 0, Dmax);
  V3.sc.add(root);
  V3.L = L;
  if (!noDraw) draw3D();
}
/* soft contact shadows, multiplied onto the room picture: a dark band on the floor along the foot of the run,

  sg.fillRect(0, 0, 16, 16);

  pot.position.set(px, 210, pz);

  const soil = new T.Mesh(
    new T.CylinderGeometry(175, 175, 10, 24),

  );

  root.add(soil);
  const leaf = new T.MeshStandardMaterial({ color: '#4c6941', roughness: 0.55, side: T.DoubleSide }),
    stem = new T.MeshStandardMaterial({ color: '#6b5a3e', roughness: 0.8 }),
    r = prng(5);
  for (let i = 0; i < 16; i++) {

      len = 520 + r() * 460,
      base = new T.Vector3(px, 415, pz),
      dir = new T.Vector3(Math.sin(a) * Math.sin(tilt), Math.cos(tilt), Math.cos(a) * Math.sin(tilt)),
      tip = base.clone().addScaledVector(dir, len);
    const st = new T.Mesh(new T.CylinderGeometry(5, 7, len, 6), stem);
    st.position.copy(base).addScaledVector(dir, len / 2);
    st.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir);
    st.castShadow = true;

function handle3D(f, lk, root, cache, FT) {

function plankTex() {
  if (V3.tex.planks) return V3.tex.planks;
  // 8 planks of 180 mm side by side, 2400 mm long, ends staggered
  const t = canvasTex(512, 1024, (g, w, h) => {
    const r = prng(41),
      pw = w / 8;
    g.fillStyle = 'rgb(200,168,126)';
    g.fillRect(0, 0, w, h);
    for (let i = 0; i < 8; i++) {
      const off = r() * h * 0.62;
      for (let k = -1; k < 3; k++) {
        const y0 = off + k * h * 0.62,
          len = h * 0.62;
        const l = 0.92 + r() * 0.14;
        g.fillStyle = `rgb(${Math.round(203 * l)},${Math.round(170 * l)},${Math.round(128 * l)})`;
        g.fillRect(i * pw, y0, pw, len);
        g.strokeStyle = 'rgba(110,80,45,.10)';
        for (let q = 0; q < 9; q++) {
          const x = i * pw + 4 + r() * (pw - 8);
          g.lineWidth = 0.6 + r() * 1.4;
          g.beginPath();
          g.moveTo(x, y0);
          g.bezierCurveTo(x + (r() - 0.5) * 8, y0 + len * 0.3, x + (r() - 0.5) * 8, y0 + len * 0.7, x, y0 + len);
          g.stroke();
        }
        g.fillStyle = 'rgba(70,50,30,.35)';
        g.fillRect(i * pw, y0, pw, 1.5);
      }
      g.fillStyle = 'rgba(70,50,30,.4)';
      g.fillRect(i * pw, 0, 1.5, h);
    }
  });
  return (V3.tex.planks = t);
}
function plasterTex() {
  if (V3.tex.plaster) return V3.tex.plaster;
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#ece8e0';
    g.fillRect(0, 0, w, h);
    const r = prng(7);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,.025)' : 'rgba(255,255,255,.05)';
      const s = 1 + r() * 3;
      g.fillRect(r() * w, r() * h, s, s);
    }
  });
  return (V3.tex.plaster = t);
}

/* ---------- the pre-render (open the page with #prerender; tools/prerender.js saves the results) ----------
   Ray-traces the empty room with three-gpu-pathtracer: the picture from the fixed camera, and the light of the
   room as an HDR panorama (RGBE in a PNG) for lighting the cabinets. No sun here: the sun is added live. */
function skyTex(T) {
  const w = 256,
    h = 128,
    d = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const v = 1 - y / (h - 1),
        base = v > 0.5 ? 1.0 + 0.5 * (v - 0.5) : 0.5 + 1.0 * v,
        k = (y * w + x) * 4;
      d[k] = base * 0.97;
      d[k + 1] = base * 0.98;
      d[k + 2] = base * 1.02;
      d[k + 3] = 1;
    }
  const t = new T.DataTexture(d, w, h, T.RGBAFormat, T.FloatType);
  t.mapping = T.EquirectangularReflectionMapping;
  t.magFilter = t.minFilter = T.LinearFilter;
  t.needsUpdate = true;
  return t;
}
function prerenderRoom() {
  const T = V3.T,
    PT = V3.PT,
    q = new URLSearchParams(location.search),
    spp = +q.get('spp') || 256,
    espp = +q.get('espp') || 128;
  document.body.innerHTML = '';
  const r = new T.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  r.outputColorSpace = T.SRGBColorSpace;
  r.toneMapping = T.NeutralToneMapping;
  r.toneMappingExposure = ROOM.exposure;
  r.setPixelRatio(1);
  r.setSize(ROOM.W, ROOM.H);
  document.body.appendChild(r.domElement);
  const sc = new T.Scene();
  sc.environment = sc.background = skyTex(T);
  const plaster = (() => {
    const t = plasterTex().clone();
    t.needsUpdate = true;
    t.repeat.set(14000 / 900, ROOM.ceil / 900);
    return new T.MeshStandardMaterial({ map: t, roughness: 0.95 });
  })();
  const ft = plankTex().clone();
  ft.needsUpdate = true;
  ft.repeat.set(12000 / 1440, 9000 / 2400);
  const floor = new T.Mesh(new T.PlaneGeometry(12000, 9000), new T.MeshStandardMaterial({ map: ft, roughness: 0.55 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, 4500);
  sc.add(floor);
  const back = new T.Mesh(new T.PlaneGeometry(14000, ROOM.ceil), plaster);
  back.position.set(0, ROOM.ceil / 2, 0);
  sc.add(back);
  const skirt = new T.Mesh(
    new T.BoxGeometry(14000, 80, 14),
    new T.MeshStandardMaterial({ color: '#f3f1ec', roughness: 0.6 })
  );
  skirt.position.set(0, 40, 7);
  sc.add(skirt);
  roomWindowWall(T, sc, plaster, false);
  const [z0, z1, y0, y1] = ROOM.win,
    xl = ROOM.wallL,
    steel = new T.MeshStandardMaterial({ color: '#2b2d2f', roughness: 0.4, metalness: 0.5 }),
    bx = (w, h, d, m, x, y, z) => {
      const ms = new T.Mesh(new T.BoxGeometry(w, h, d), m);
      ms.position.set(x, y, z);
      sc.add(ms);
    };
  bx(30, y1 - y0, 30, steel, xl + 10, (y0 + y1) / 2, z0 + 15);
  bx(30, y1 - y0, 30, steel, xl + 10, (y0 + y1) / 2, z1 - 15);
  bx(30, 30, z1 - z0, steel, xl + 10, y1 - 15, (z0 + z1) / 2);
  bx(30, 30, z1 - z0, steel, xl + 10, (y0 + y1) / 2, (z0 + z1) / 2);
  bx(
    200,
    30,
    z1 - z0 + 40,
    new T.MeshStandardMaterial({ color: '#d9d4ca', roughness: 0.7 }),
    xl - 50,
    y0 - 15,
    (z0 + z1) / 2
  );
  const ceil = new T.Mesh(
    new T.PlaneGeometry(14000, 9000),
    new T.MeshStandardMaterial({ color: '#f4f2ee', roughness: 0.9 })
  );
  ceil.rotation.x = Math.PI / 2;
  ceil.position.set(0, ROOM.ceil, 4500);
  sc.add(ceil);
  bx(3200, 10, 1700, new T.MeshStandardMaterial({ color: '#cbbfa9', roughness: 1 }), 0, 5, 1500);
  const cam = new T.PerspectiveCamera(ROOM.fov, ROOM.W / ROOM.H, 20, 60000);
  cam.position.set(...ROOM.cam);
  cam.lookAt(ROOM.cam[0], ROOM.cam[1], 0);
  cam.updateMatrixWorld();
  const pt = new PT.WebGLPathTracer(r);
  pt.bounces = 6;
  pt.renderDelay = 0;
  pt.fadeDuration = 0;
  pt.minSamples = 1;
  pt.tiles.set(2, 2);
  // the last frame goes to the screen through a light edge-aware denoise
  let clean = false;
  const dn = new PT.DenoiseMaterial({ map: null, blending: T.NoBlending, transparent: true });
  pt.renderToCanvasCallback = (target, renderer, quad) => {
    const m = quad.material;
    if (clean) {
      dn.map = m.map;
      dn.opacity = 1;
      dn.sigma = 2.2;
      dn.threshold = 0.045;
      dn.kSigma = 1;
      quad.material = dn;
    }
    const ac = renderer.autoClear;
    renderer.autoClear = false;
    quad.render(renderer);
    renderer.autoClear = ac;
    quad.material = m;
  };
  const out = (window.__prerender = { status: 'room' });
  pt.setScene(sc, cam);
  const step = () => {
    pt.renderSample();
    out.samples = pt.samples;
    if (pt.samples < spp - 1) return requestAnimationFrame(step);
    if (!clean) {
      clean = true;
      return requestAnimationFrame(step);
    }
    clean = false;
    out.bg = r.domElement.toDataURL('image/jpeg', 0.86);
    // the light of the room, seen from where the cabinets stand: an HDR panorama
    out.status = 'env';
    r.setSize(256, 128);
    const ec = new PT.EquirectCamera();
    ec.position.set(...ROOM.envAt);
    ec.updateMatrixWorld();
    pt.setScene(sc, ec);
    const step2 = () => {
      pt.renderSample();
      out.samples = pt.samples;
      if (pt.samples < espp) return requestAnimationFrame(step2);
      const tg = pt.target,
        px = new Float32Array(tg.width * tg.height * 4);
      r.readRenderTargetPixels(tg, 0, 0, tg.width, tg.height, px);
      const c = document.createElement('canvas');
      c.width = tg.width;
      c.height = tg.height;
      const g = c.getContext('2d'),
        im = g.createImageData(c.width, c.height);
      for (let y = 0; y < c.height; y++)
        for (let x = 0; x < c.width; x++) {
          const i = ((c.height - 1 - y) * c.width + x) * 4, // the target is bottom-up
            o = (y * c.width + x) * 4,
            m = Math.max(px[i], px[i + 1], px[i + 2]);
          if (m < 1e-32) continue;
          const e = Math.ceil(Math.log2(m)),
            sc2 = Math.pow(2, -e) * 256;
          im.data[o] = Math.min(255, px[i] * sc2);
          im.data[o + 1] = Math.min(255, px[i + 1] * sc2);
          im.data[o + 2] = Math.min(255, px[i + 2] * sc2);
          im.data[o + 3] = e + 128;
        }
      g.putImageData(im, 0, 0);
      out.env = c.toDataURL('image/png');
      out.status = 'done';
    };
    requestAnimationFrame(step2);
  };
  requestAnimationFrame(step);
}

/* on top of the render: the outline of the selected front, at its place in the picture */
function overlay3D() {
  const svg = document.getElementById('rover');
  if (!svg) return;
  const T = V3.T,
    cam = V3.cam,
    el = V3.r.domElement,
    w = el.clientWidth,
    h = el.clientHeight,
    P = (x, y, z) => {
      const v = new T.Vector3(x, y, z).project(cam);
      return [((v.x + 1) / 2) * w, ((1 - v.y) / 2) * h];
    };
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let o = '';
  // the selected front: the front face of its mesh, in the picture
  const ms = S.sel && V3.meshes.find(m => m.userData.fid === S.sel);
  if (ms) {
    const b = new T.Box3().setFromObject(ms),
      z = b.max.z + 2,
      pts = [
        P(b.min.x - 4, b.min.y - 4, z),
        P(b.max.x + 4, b.min.y - 4, z),
        P(b.max.x + 4, b.max.y + 4, z),
        P(b.min.x - 4, b.max.y + 4, z)
      ];
    o += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" class="osel"/>`;
  }
  svg.innerHTML = o;
}
function tap3D(e) {
  const T = V3.T,
    rc = V3.r.domElement.getBoundingClientRect(),
    v = new T.Vector2(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1),
    ray = new T.Raycaster();
  ray.setFromCamera(v, V3.cam);
  const hit = ray.intersectObjects(V3.meshes, false)[0];
  selectFront(hit ? hit.object.userData.fid : null);
}

   The four steps (1 Cabinets · 2 Fronts · 3 Handles · 4 Order), the panel for each, the picture switch
   (Front | 3D), Surprise me, the price bar and every tap. One render() redraws everything from S.
   Tapping a front selects it: in Fronts it can get its own look, in Handles its hinge side can swap.

const STEPS = [

  ['fronts', 'Fronts'],

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const segC = (act, c, cur, opts) =>
  `<div class="seg">${opts.map(([k, l]) => `<button type="button" class="${String(k) === String(cur) ? 'on' : ''}" data-act="${act}" data-a="${c.id}|${k}">${l}</button>`).join('')}</div>`;
const f1 = v => (Math.round(v * 10) / 10).toString();

function render() {
  if (!matOk(S.style, S.mat)) S.style = MATS[S.mat] && MATS[S.mat].only ? MATS[S.mat].only : 'flat';
  const L = layout(),
    P = priceAll(L);
  if (S.sel && !L.fronts.some(f => f.id === S.sel)) S.sel = null;
  save();
  const i = STEPS.findIndex(s => s[0] === S.step);
  const stepBtns = STEPS.map(

  ).join('');

function quickMake(q, sys) {

  const out = [];
  ['high', 'base', 'wall'].forEach(k =>
    (q[k] || []).forEach(e => {
      const [w, lay] = Array.isArray(e) ? e : [e];

/* "100 50 100" or "2x100 50" → widths, each snapped to the nearest IKEA width */
function parseWidths(txt, widths) {
  const out = [];
  String(txt || '')
    .replace(/,/g, ' ')
    .split(/\s+/)
    .filter(Boolean)
    .forEach(t => {
      const m = t.match(/^(?:(\d+)\s*[x×*])?(\d{2,3})$/i);
      if (!m) return;
      const n = Math.min(12, +(m[1] || 1)),
        w = widths.reduce((b, v) => (Math.abs(v - +m[2]) < Math.abs(b - +m[2]) ? v : b), widths[0]);
      for (let i = 0; i < n; i++) out.push(w);
    });
  return out;
}

function sendOrder() {
  const v = id => (document.getElementById(id).value || '').trim();
  if (!v('oName') || !/.+@.+\..+/.test(v('oMail'))) {
    document.querySelector('#mbox .hint').textContent = 'Please fill in your name and a valid e-mail address.';
    return;
  }
  const txt = orderText() + `\n\nFrom: ${v('oName')} <${v('oMail')}>, ${v('oZip')}\n${v('oNote')}`;
  try {
    const all = JSON.parse(localStorage.getItem('bruis-fronts-orders') || '[]');
    all.push({ at: Date.now(), txt });
    localStorage.setItem('bruis-fronts-orders', JSON.stringify(all));
  } catch (e) {
    /* fine */
  }
  document.getElementById('mbox').innerHTML =
    `<h2>Thank you, ${esc(v('oName').split(' ')[0])}!</h2><p class="lede">In the real shop BRUIS would now e-mail you to check the sizes and send a payment link. In this prototype nothing was sent — here is the order as text:</p><pre class="otext">${esc(txt)}</pre><div class="adds"><button type="button" class="btn pri" data-act="copyOrder">Copy</button><button type="button" class="btn" data-act="close">Close</button></div>`;
  S.lastOrder = txt;
  save();
}

/* ---------- a look change, for all fronts or for one ---------- */
/* fluted or grooves picked on wood: budget ply goes to raw MDF, the rest to painted */
const mdfFor = mat => (MATS[mat] && MATS[mat].budget ? 'rawmdf' : 'painted');
function setLook(target, field, val) {
  if (target === 'all') {
    S[field] = val;
    if (field === 'mat' && !matOk(S.style, val)) S.style = MATS[val].only || 'flat';
    if (field === 'style' && !matOk(val, S.mat)) S.mat = mdfFor(S.mat);
    S.recipe = null;
    return;
  }
  const cur = lookOf({ id: target }),
    nx = { style: cur.style, mat: cur.mat, col: cur.col, oil: cur.oil };
  nx[field] = val;
  if (field === 'mat' && !matOk(nx.style, val)) nx.style = MATS[val].only || 'flat';
  if (field === 'style' && !matOk(val, nx.mat)) nx.mat = mdfFor(nx.mat);
  S.fx[target] = nx;
}

/* ---------- taps ---------- */
document.addEventListener('click', e => {
  const fr = e.target.closest('#pic .front');
  if (fr) {
    selectFront(fr.dataset.f);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.closest('summary')) e.preventDefault();
  const a = b.dataset.a || '',
    [id, val] = a.split('|'),
    c = S.cabs.find(x => x.id === id);
  switch (b.dataset.act) {
    case 'step':
      S.step = a;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'next': {
      const i = STEPS.findIndex(s => s[0] === S.step);
      S.step = STEPS[Math.min(STEPS.length - 1, i + 1)][0];
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    }
    case 'view':
      S.view = a;
      break;
    case 'openShared': {
      const m = String(S.impText || '').match(/#d=([A-Za-z0-9_-]+)/),
        o = m && readCode(m[1]);
      if (o) {
        S.undo = JSON.stringify({ sys: S.sys, cabs: S.cabs, fx: S.fx, flip: S.flip });
        Object.assign(S, o, { step: 'fronts', sel: null, recipe: null, demo: null, impText: '' });
      }
      break;
    }
    case 'share': {
      const url = shareLink();
      const done = ok => {
        b.textContent = ok ? 'Link copied' : 'Copy failed';
        if (!ok) prompt('Copy this link to share your design:', url);
        setTimeout(() => (b.textContent = 'Share this design'), 2200);
      };
      try {
        navigator.clipboard.writeText(url).then(
          () => done(true),
          () => done(false)
        );
      } catch (er) {
        done(false);
      }
      return;
    }
    case 'print':
      printQuote();
      return;
    case 'trend':
      if (S.step === 'home') loadDemo(0);
      surprise(undefined, true);
      S.step = 'fronts';
      window.scrollTo({ top: 0 });
      break;
    case 'surprise':
      surprise();
      if (S.step === 'cabs') S.step = 'fronts';
      break;
    case 'sys':
      if (a !== S.sys) {
        // another system starts from an example row of its cabinets; the look you chose stays
        const keep = {
          style: S.style,
          flute: S.flute,
          mat: S.mat,
          col: S.col,
          oil: S.oil,
          edge: S.edge,
          gframe: S.gframe,
          handle: S.handle,
          hfin: S.hfin,
          view: S.view
        };
        S = Object.assign(freshState(a), keep, { step: 'cabs' });
      }
      break;
    case 'quick':
      S.cabs = quickMake(QUICK[S.sys][+a][1]);
      S.flip = {};
      S.demo = null;
      S.fx = {};
      break;
    case 'qh':
      S.qh = +a;
      break;
    case 'typed': {
      const kinds = SYS[S.sys].kinds,
        got = [];
      if (S.sys === 'metod') {
        S.twBase = document.getElementById('twBase').value;
        S.twWall = document.getElementById('twWall').value;
        parseWidths(S.twBase, kinds.base.widths).forEach(w => got.push(cab('metod', 'base', w, 80)));
        parseWidths(S.twWall, kinds.wall.widths).forEach(w => got.push(cab('metod', 'wall', w, 80)));
        // keep the tall cabinets you already had
        S.cabs.filter(x => x.kind === 'high').forEach(x => got.unshift(x));
      } else {
        S.twFrame = document.getElementById('twFrame').value;
        const h = S.qh && kinds.frame.heights.includes(S.qh) ? S.qh : kinds.frame.heights[1];
        parseWidths(S.twFrame, kinds.frame.widths).forEach(w => got.push(cab(S.sys, 'frame', w, h)));
      }
      if (got.length) {
        S.cabs = got;
        S.flip = {};
        S.fx = {};
      }
      break;
    }
    case 'addw': {
      const kd = SYS[S.sys].kinds[id],
        h =
          kd.heights.length === 1
            ? kd.heights[0]
            : S.sys === 'metod'
              ? kd.heights[id === 'wall' ? 2 : 1]
              : S.qh && kd.heights.includes(S.qh)
                ? S.qh
                : kd.heights[1];
      S.cabs.push(cab(S.sys, id, +val, h));
      S.openCab = S.cabs[S.cabs.length - 1].id;
      break;
    }
    case 'cw':
      if (c) {
        c.w = +val;
        fixLayout(c);
      }
      break;
    case 'ch':
      if (c) {
        c.h = +val;
        fixLayout(c);
      }
      break;
    case 'cl':
      if (c) c.layout = val;
      break;
    case 'mv': {
      const i = S.cabs.indexOf(c),
        j = i + +val;
      if (c && j >= 0 && j < S.cabs.length) [S.cabs[i], S.cabs[j]] = [S.cabs[j], S.cabs[i]];
      break;
    }
    case 'del':
      S.cabs = S.cabs.filter(x => x !== c);
      break;
    case 'impEx':
      S.impText = IMPORT_EXAMPLE;
      S.impMsg = '';
      S.impMsg = '';
      break;
    case 'demo':
      loadDemo(+a);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'impUse': {
      const r = parsePlanner(S.impText),
        got = r.found.filter(c => c.sys === a);
      if (!got.length) break;
      S.undo = JSON.stringify({ sys: S.sys, cabs: S.cabs, fx: S.fx, flip: S.flip });
      S.sys = a;
      S.cabs = got;
      S.demo = null;
      S.fx = {};
      S.flip = {};
      S.sel = null;
      S.impMsg = `✓ ${got.length} ${SYS[a].name} cabinet${got.length === 1 ? '' : 's'} set up from your list — check them below. <button type="button" class="lnk" data-act="undo">Undo</button> · <button type="button" class="lnk" data-act="step" data-a="fronts">Choose your fronts</button>`;
      break;
    }
    case 'undo':
      if (S.undo) {
        Object.assign(S, JSON.parse(S.undo));
        S.undo = null;
        S.impMsg = '';
      }
      break;
    case 'impClear':
      S.impText = '';
      S.impMsg = '';
      break;
    case 'impPaste':
      try {
        navigator.clipboard
          .readText()
          .then(t => {
            S.impText = t;
            S.impMsg = '';
            render();
          })
          .catch(() => impPasteHelp());
      } catch (er) {
        impPasteHelp();
      }
      return;
    case 'lk': {
      const [t, field, v] = a.split('|');
      setLook(t, field, v);
      break;
    }
    case 'own':
      if (S.sel) {
        if (a === 'same') delete S.fx[S.sel];
        else S.fx[S.sel] = { style: S.style, mat: S.mat, col: S.col, oil: S.oil };
      }
      break;
    case 'copycab': {
      const L = layout(),
        f = L.fronts.find(x => x.id === S.sel);
      if (f && S.fx[f.id])
        L.fronts.filter(x => x.cab === f.cab).forEach(x => (S.fx[x.id] = Object.assign({}, S.fx[f.id])));
      break;
    }
    case 'desel':
      S.sel = null;
      break;
    case 'flip':
      if (S.sel) {
        if (S.flip[S.sel]) delete S.flip[S.sel];
        else S.flip[S.sel] = 1;
      }
      break;
    case 'unflip':
      S.flip = {};
      break;
    case 'pitch':
      S.flute.pitch = +a;
      break;
    case 'gpitch':
      S.flute.gpitch = +a;
      break;
    case 'fdir':
      S.flute.dir = a;
      break;
    case 'gframe':
      S.gframe = a;
      break;
    case 'edge':
      S.edge = a;
      break;
    case 'sides':
      S.sides = a;
      break;
    case 'plinth':
      S.plinth = a;
      break;
    case 'fillers':
      S.fillers = +a;
      break;
    case 'planCheck':
      S.planCheck = !!b.checked;
      break;
    case 'samples':
      openSamples();
      return;
    case 'sendSamples':
      sendSamples();
      return;
    case 'home':
      S.step = 'home';
      window.scrollTo({ top: 0 });
      break;
    case 'goPaste':
      S.step = 'cabs';
      window.scrollTo({ top: 0 });
      render();
      setTimeout(() => {
        const t = document.getElementById('impText');
        if (t) {
          t.scrollIntoView({ block: 'center', behavior: 'smooth' });
          t.focus({ preventScroll: true });
        }
      }, 60);
      return;
    case 'demoGo':
      loadDemo(+a);
      S.step = 'fronts';
      window.scrollTo({ top: 0 });
      break;
    case 'handle':
      S.handle = a;
      break;
    case 'hfin':
      S.hfin = a;
      break;
    case 'orderNow':
      openOrder();
      return;
    case 'send':
      sendOrder();
      return;
    case 'copyOrder':
      try {
        navigator.clipboard.writeText(S.lastOrder || orderText());
        b.textContent = 'Copied';
      } catch (er) {
        /* ignore */
      }
      return;
    case 'close':
      document.getElementById('modal').hidden = true;
      return;
    default:
      return;
  }
  render();
});
document.addEventListener(

/* ==== 40-import.js ====
   Read an IKEA list — the planner's item list, the shopping cart, an order confirmation, or typed by hand —
   and turn every PAX frame, METOD cabinet and BESTÅ frame into a cabinet. Everything else (doors, hinges,
   legs, drawers) is skipped, but IKEA doors and drawer fronts are counted so we can compare.

   Copied text comes in two shapes, and both work:
     one item per line      PAX Wardrobe frame, white, 100x58x236 cm   2 pcs
     one item over lines    PAX
                            Wardrobe frame, white, 100x58x236 cm
                            € 95
                            2
   A new item starts at a line that begins with an IKEA name in capitals (PAX, METOD / MAXIMERA, KOMPLEMENT …)
   or names one of the three systems; lines in between belong to the item above.
   English, Dutch, French and German words are understood. Sizes are width × depth × height in cm
   ("cm" may be left out); with two numbers the second is the height, unless it is clearly a depth.
   METOD cabinets that come with drawers or doors ("with 3 drawers", "2 fronts/4 drawers", "met 2 deuren")
   get the matching front layout.

const IMPORT_EXAMPLE = `PAX Wardrobe frame, white, 100x58x236 cm   2 pcs
PAX Wardrobe frame, white, 50x58x236 cm   1 pcs
KOMPLEMENT Hinge with damper, 4 pack   3
METOD / MAXIMERA Base cabinet with 3 drawers, white/Voxtorp, 60x60x80 cm   Qty: 1
METOD Base cabinet frame, white, 80x60x80 cm   Qty: 2
METOD Wall cabinet with 2 doors, white, 80x37x80 cm   2
METOD High cabinet frame, white, 60x60x200 cm   1
BESTÅ Frame, white, 120x40x38 cm   1`;

const IMP = {
  frame:
    /FRAME|CABINET|CARCASS|STOMME|KORPUS|CORPS|CAISSON|OMBOUW|ONDERKAST|BOVENKAST|HOGE ?KAST|KASTFRAME|KAST\b|SCHRANK|ÉLÉMENT|ELEMENT|ÉLT\b|ELT\b|ARMOIRE|BENCH|BANC|MEUBLE|UNIT\b/,
  // words that make the head of the line something else than a frame
  other:
    /\b(DOORS?|DEUR(EN)?|PORTES?|TÜR(EN)?|FRONTS?|FRONTEN|FAÇADES?|FACADES?|HINGES?|SCHARNIER(EN)?|CHARNIÈRES?|LEGS?|POOT|POTEN|PIEDS?|FÜSSE|PLINTH|PLINT|SOCLE|SOCKEL|SHELF|SHELVES|PLANK(EN)?|TABLETTES?|EINLEGEBODEN|RAILS?|KNOBS?|HANDLES?|GREPEN?|GREEP|POIGNÉES?|GRIFFE?|COVER PANEL|DEKPANEEL|PANNEAU|ABDECKSEITE|DECO STRIP|WORKTOP|COUNTERTOP|WERKBLAD|PLAN DE TRAVAIL|DRAWERS?|LADES?|LADEN|TIROIRS?|SCHUBLADEN?|INTERIOR|ORGANI[SZ]ER|MIRROR|SPIEGEL|LIGHTING|LED)\b/,
  combo: /COMBINATION|COMBINATIE|COMBINAISON|KOMBINATION/,
  wall: /WALL|BOVENKAST|WANDKAST|OBERSCHRANK|WANDSCHRANK|MURAL|ÉLÉMENT HAUT|\bBOVEN\b/,
  high: /HIGH|TALL|HOGE ?KAST|HOCHSCHRANK|ARMOIRE|COLONNE/,
  doorFront:
    /\b(DOORS?|DEUR(EN)?|PORTES?|TÜR(EN)?|DRAWER FRONTS?|LADEFRONTS?|FAÇADES? DE TIROIR|SCHUBLADENFRONTS?|FRONTS?)\b/,
  depths: [20, 35, 37, 39, 40, 42, 58, 60, 61]

/* split the text into items */
function impBlocks(text) {
  const blocks = [];
  String(text || '')
    .replace(/ /g, ' ')
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(Boolean)
    .forEach(l => {
      const starts =
        /^(\d{1,2}\s*[x×]\s+)?[A-ZÅÄÖ]{3,}(\s*\/\s*[A-ZÅÄÖ]{3,})*(\s|,|$)/.test(l) ||
        /\b(pax|metod|best[aå])\b/i.test(l);
      if (starts || !blocks.length) blocks.push([l]);
      else blocks[blocks.length - 1].push(l);
    });
  return blocks;
}
function impQty(lines) {
  const all = lines.join('  '),
    pats = [
      /^\s*(\d{1,2})\s*[x×]\s+/i,
      /(?:QTY|QUANTITY|AANTAL|ANTAL|QUANTITÉ|QTÉ|ANZAHL|MENGE)\s*[:.]?\s*(\d{1,3})/i,
      /(\d{1,3})\s*(?:PCS|PC|PIECES|PIÈCES|ST|STK|STUKS?)\.?(?:\s|$)/i,
      /(?:^|[^\d\s])\s*[x×]\s*(\d{1,2})\s*$/i
    ];
  for (const p of pats) {
    const m = all.match(p);
    if (m) return +m[1];
  }
  // a table row: a cell that is just a number (tabs or wide gaps between the columns)
  for (const l of lines) {
    const cells = l.split(/\t|\s{2,}/).map(c => c.trim());
    const q = cells.slice(1).find(c => /^\d{1,2}$/.test(c));
    if (q) return +q;
  }
  const after = all.match(/\bcm\.?\s+(\d{1,2})\s*$/i) || all.match(/\b(\d)\s*[x×]\s+(?=\d{2,3}\s*[x×])/i);
  if (after) return +after[1];
  // a line that is just a number (the quantity column), or a number at the end after a wide gap
  for (const l of lines.slice(1)) if (/^\d{1,2}$/.test(l)) return +l;
  const t = lines[0].match(/\s{2,}(\d{1,2})\s*$/);
  return t ? +t[1] : 1;
}
const impNum = s => +String(s).replace(',', '.');
/* a PAX combination's width as frames: as many 100s as fit, then a 50 or 75 (125 = 75 + 50) */
function paxSplit(w) {
  if (w < 50 || w > 600 || w % 25) return null;
  let n = Math.floor(w / 100),
    r = w - n * 100;
  const out = [];
  if (r === 25) {
    if (!n) return null;
    n--;
    out.push(75, 50);
  } else if (r) out.push(r);
  return Array(n).fill(100).concat(out);
}

function parsePlanner(text, only) {
  const found = [],
    skipped = [],
    notes = [],
    combos = [];
  let ikeaFronts = 0;
  impBlocks(text).forEach(lines => {
    const line = lines.join(' '),
      up = line.toUpperCase(),
      sys = /\bPAX\b/.test(up)
        ? 'pax'
        : /\bMETOD\b/.test(up)
          ? 'metod'
          : /\bBEST[AÅ](?![A-Z])/.test(up)
            ? 'besta'
            : null;
    // the head: the name of the thing, before its colour, size and "with …"
    const head = up.replace(/^\d{1,2}\s*[x×]\s+/, '').split(/,|\s(?:WITH|W\/|MET|AVEC|MIT|FOR|VOOR|POUR|FÜR)\s/)[0];
    const dm = line.match(/(\d{2,3}(?:[.,]\d)?)\s*[x×*]\s*(\d{2,3}(?:[.,]\d)?)(?:\s*[x×*]\s*(\d{2,3}(?:[.,]\d)?))?/);
    const qty = Math.min(impQty(lines), 30);
    if (IMP.combo.test(head)) {
      const pw = dm && sys === 'pax' ? paxSplit(impNum(dm[1])) : null;
      if (!pw || /CORNER|HOEK|ANGLE|ECK/.test(up)) {
        if (sys) combos.push(line);
        return;
      }
      const hh = impNum(dm[3] || dm[2]) > 210 ? 236 : 201;
      for (let q = 0; q < qty; q++)
        pw.forEach(w => found.push(cab('pax', 'frame', w, hh, /\bOPEN\b/.test(up) ? 'open' : 'doors')));
      notes.push(`PAX combination ${impNum(dm[1])} cm wide read as frames ${pw.join(' + ')} — check the order below.`);
      return;
    }
    const name = head.replace(/\b(PAX|METOD|BEST[AÅ])\b/g, ''),
      fm = name.match(IMP.frame),
      om = name.match(IMP.other),
      bare = !name
        .replace(
          /\d+([.,]\d)?|[x×*\/:\-]|\bCM\b|\b(BASE|WALL|HIGH|TALL|FRAME|ONDER|BOVEN|HOOG|HOGE|BAS|MURAL|PCS|ST|QTY)\b/gi,
          ''
        )
        .trim();
    const isFrame = sys && dm && ((fm && (!om || om.index > fm.index)) || (bare && !om));
    if (!isFrame) {
      if (dm && IMP.doorFront.test(head) && !/HINGE|SCHARNIER|CHARNIÈRE|SCHARNIERE/.test(up)) ikeaFronts += qty;
      if (sys || /^[A-ZÅÄÖ]{3,}/.test(lines[0])) skipped.push(lines[0]);
      return;
    }
    if (!dm) {
      notes.push(`No size found in “${lines[0].slice(0, 60)}” — add the size like 60x60x80 cm.`);
      return;
    }
    if (only && sys !== only) {
      skipped.push(lines[0]);
      return;
    }
    let kind = 'frame';
    if (sys === 'metod') kind = IMP.wall.test(up) ? 'wall' : IMP.high.test(up) ? 'high' : 'base';
    const kd = SYS[sys].kinds[kind],
      a = impNum(dm[1]),
      b = impNum(dm[2]),
      c3 = dm[3] ? impNum(dm[3]) : null;
    // width × depth × height; with two numbers the second is the height unless it is a depth
    const w = a,
      h =
        c3 != null
          ? c3
          : IMP.depths.includes(b)
            ? kd.heights[kind === 'high' ? kd.heights.length - 1 : kind === 'wall' ? 2 : 0]
            : b;
    const near = (list, v) => list.reduce((p, q) => (Math.abs(q - v) < Math.abs(p - v) ? q : p), list[0]);
    const W = near(kd.widths, w),
      H = near(kd.heights, h);
    if (Math.abs(W - w) > 2 || Math.abs(H - h) > 2)
      notes.push(
        `${SYS[sys].name} ${w}×${h} is not a standard size — read as ${W}×${H}. Check it in your cabinets below.`
      );
    const lay = impLayout(sys, kind, W, H, up);
    for (let i = 0; i < qty; i++) {
      const c = cab(sys, kind, W, H, lay || undefined);
      fixLayout(c);
      found.push(c);
    }
  });
  if (combos.length)
    notes.push(
      `${combos.length} ready-made combination${combos.length === 1 ? '' : 's'} (like PAX/FORSAND) can’t be split into frames from the name alone — paste the frame lines, or type the widths below.`
    );
  return { found, skipped, notes, ikeaFronts };
}

/* the front layout a cabinet came with, from words like "with 3 drawers", "2 fronts/4 drawers", "met 2 deuren" */
function impLayout(sys, kind, w, h, up) {
  const num = re => {
    const m = up.match(re);
    return m ? +m[1] : 0;
  };
  const nf = num(/(\d)\s*(?:FRONTS?|FRONTEN|FAÇADES?|FACES)\b/),
    nd = num(/(\d)\s*(?:HIGH\s+|LOW\s+)?(?:DRAWERS?|LADES?|LADEN|TIROIRS?|SCHUBLADEN?)\b/),
    nDoor = num(/(\d)\s*(?:DOORS?|DEUREN|PORTES|TÜREN)\b/) || (/\b(DOOR|DEUR|PORTE|TÜR)\b/.test(up) ? 1 : 0),
    hasDrawer = /\b(DRAWERS?|LADES?|LADEN|TIROIRS?|SCHUBLADEN?)\b/.test(up);
  if (sys === 'pax') return /\bOPEN\b/.test(up) ? 'open' : 'doors';
  if (sys === 'besta') return hasDrawer ? 'drawers' : null;
  if (kind === 'base') {
    if (hasDrawer && nDoor) return 'drawer_door';
    if (hasDrawer) {
      const n = nf || nd || 3;
      return n >= 4 ? 'drawers4' : n === 3 ? 'drawers3' : n === 2 ? 'drawers2' : 'drawer_door';
    }
    if (nDoor) return nDoor >= 2 && w >= 60 ? 'doors2' : 'door';
    return null;
  }
  if (kind === 'wall') return nDoor >= 2 && w >= 60 ? 'doors2' : nDoor ? 'door' : null;
  if (kind === 'high') return nDoor >= 2 && h === 200 ? 'split' : null;
  return null;
}

    })

function surprise(seed, trendOnly) {
  const r = prng(seed || Date.now() & 0xffffffff),
    L = layout();
  // glass needs something to show off: skip glass recipes when nothing suits it
  const okR = RECIPES.filter(
    x =>
      (!trendOnly || x.trend) &&
      (x.name !== 'Glass accent' || L.fronts.some(f => ['wall', 'top', 'tall'].includes(roleOf(f))))
  );
  let rec = pick(r, okR);
  if (okR.length > 1 && rec.name === S.recipe)
    rec = okR[(okR.indexOf(rec) + 1 + Math.floor(r() * (okR.length - 1))) % okR.length];
  const plan = rec.make(r);
  applyPlan(plan, r);
  S.recipe = rec.name;
  S.recipeSay = plan.say;
  S.sel = null;
}

/* put a plan on the fronts: a look for all, and other looks by role (drawers, wall cabinets, tall doors …) */
function applyPlan(plan, r) {
  S.style = plan.all.style || 'flat';
  S.mat = plan.all.mat;
  if (plan.all.col) S.col = plan.all.col;
  S.oil = plan.all.oil || 'pure';
  S.fx = {};
  const count = {};
  layout().fronts.forEach(f => {
    const role = roleOf(f),
      o = plan.by[role];
    if (!o) return;
    count[role] = (count[role] || 0) + 1;
    if (o.every && count[role] % o.every) return; // e.g. every other tall door in glass
    const lk = Object.assign({}, plan.all, o);
    delete lk.every;
    if (lk.mat !== S.mat || lk.style !== S.style || (lk.col && lk.col !== S.col) || (lk.oil && lk.oil !== S.oil))
      S.fx[f.id] = lk;
  });
  if (plan.gframe) S.gframe = plan.gframe;
  // wooden knobs, wooden handles or finger holes: walnut on light fronts and oak, oak on deep colours and walnut
  S.handle = HANDLES[plan.handle] ? plan.handle : r ? pick(r, ['knob', 'bar', 'knob', 'hole']) : 'knob';
  const base =
    plan.all.mat === 'painted'
      ? DARK[plan.all.col]
        ? 'dark'
        : 'light'
      : plan.all.mat === 'walnut' || plan.all.oil === 'chocolate' || plan.all.oil === 'charcoal'
        ? 'dark'
        : 'light';
  S.hfin = HFIN[plan.hfin] ? plan.hfin : base === 'dark' ? 'oak' : 'walnut';
}

/* the state a demo sets, worked out once (its cabinets, looks per front, sides, edge, handles) */
const DEMO_ST = [];
function demoState(i) {
  if (DEMO_ST[i]) return DEMO_ST[i];
  const d = DEMOS[i],
    keep = S;
  S = Object.assign({}, keep, { sys: d.sys, flip: {}, fx: {}, sel: null });
  S.cabs = d.cabs.map(([kind, w, h, lay]) => {
    const c = cab(d.sys, kind, w, h, lay);
    fixLayout(c);
    return c;
  });
  applyPlan(d);
  const st = {
    sys: S.sys,
    cabs: S.cabs,
    fx: S.fx,
    style: S.style,
    mat: S.mat,
    col: S.col,
    oil: S.oil,
    handle: S.handle,
    hfin: S.hfin,
    gframe: S.gframe,
    sides: d.sides || 'none',
    edge: d.edge || 'round',
    plinth: d.plinth || 'ikea',
    fillers: 0
  };
  S = keep;
  return (DEMO_ST[i] = st);
}
function loadDemo(i) {
  const d = DEMOS[i];
  if (!d) return;
  S.undo = JSON.stringify({ sys: S.sys, cabs: S.cabs, fx: S.fx, flip: S.flip });
  Object.assign(S, JSON.parse(JSON.stringify(demoState(i))));
  S.flip = {};
  S.recipe = null;
  S.demo = d.name;
  S.sel = null;
  S.impMsg = '';
}
