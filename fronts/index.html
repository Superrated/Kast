/* ==== fronts.css ====
   BRUIS Fronts. Colours and fonts come from Fitted (its :root tokens are put in front of this file by build.py).
   Computer: picture left, panel right, price bar at the bottom.
   Phone: picture on top, panel below, steps and price bar at the bottom. */
/* BRUIS look: a maker's sample board. Cool plaster instead of cream, graphite ink, one cobalt for actions,
   raw-MDF tan for small structure; one family (Bricolage Grotesque), condensed and heavy for headings. */
/* BRUIS: a studio look. Stone white, soft black ink, hairline rules; colour comes only from the fronts.
   One light theme on every device, like a brand site (dark-mode tokens from Fitted are overridden). */
:root {
  --bg: #f3f3f1;
  --surface: #f3f3f1;
  --raised: #fbfbfa;
  --ink: #1a1a1a;
  --ink2: #6b6b67;
  --ink3: #8f8f8a;
  --line: #dcdbd6;
  --accent: #1a1a1a;
  --accent-ink: #fbfbfa;
  --accent-soft: rgba(26, 26, 26, 0.05);
  --warn: #8a5a2b;
  --warn-soft: rgba(138, 90, 43, 0.1);
  --mdf: #b49c7c;
  --wall: #e9e8e4;
  --stage: #e9e8e4;
  --floor: #d6d0c6;
  --hatch: #d3d5d1;
  --paper: #fbfbfa;
  --shade: rgba(20, 20, 20, 0.18);
  --f-d: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  --f-b: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  --f-m: 'Bricolage Grotesque', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #f3f3f1;
    --surface: #f3f3f1;
    --raised: #fbfbfa;
    --ink: #1a1a1a;
    --ink2: #6b6b67;
    --ink3: #8f8f8a;
    --line: #dcdbd6;
    --accent: #1a1a1a;
    --accent-ink: #fbfbfa;
    --accent-soft: rgba(26, 26, 26, 0.05);
    --warn: #8a5a2b;
    --warn-soft: rgba(138, 90, 43, 0.1);
    --mdf: #b49c7c;
    --wall: #e9e8e4;
    --stage: #e9e8e4;
    --floor: #d6d0c6;
    --hatch: #d3d5d1;
    --paper: #fbfbfa;
    --shade: rgba(20, 20, 20, 0.18);
    --f-d: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    --f-b: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    --f-m: 'Bricolage Grotesque', ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-b);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
h2 {
  font-family: var(--f-d);
  font-weight: 400;
  font-size: 30px;
  margin: 4px 0 6px;
}
h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink2);
  margin: 22px 0 8px;
}
.lede {
  color: var(--ink2);
  margin: 0 0 14px;
  line-height: 1.45;
}
.hint {
  color: var(--ink2);
  font-size: 13.5px;
  line-height: 1.45;
}
small {
  color: var(--ink2);
}
.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  height: 100dvh;
}
header.top {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand {
  font-family: var(--f-d);
  font-size: 24px;
  white-space: nowrap;
}
.brand b {
  font-family: var(--f-b);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  margin-right: 4px;
}
.brand small {
  display: block;
  font-family: var(--f-b);
  font-size: 11.5px;
  margin-top: -2px;
}
.steps,
.bsteps {
  display: flex;
  gap: 4px;
}
.steps {
  margin-left: auto;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
}
.steps button,
.bsteps button {
  border: 0;
  background: none;
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 600;
  color: var(--ink2);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.steps button i,
.bsteps button i {
  font-style: normal;
  font-size: 11px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: inline-grid;
  place-items: center;
}
.steps button.done i,
.bsteps button.done i {
  background: var(--ink2);
  border-color: var(--ink2);
  color: var(--bg);
}
.steps button.on,
.bsteps button.on {
  background: var(--ink);
  color: var(--bg);
}
.bsteps {
  display: none;
}
.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
  min-height: 0;
}
.stage {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--stage);
  padding: 14px 18px;
}
.stagebar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 13px;
}
.sw {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, 0.15);
  flex: none;
}
.pic {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px 0;
}
.pic svg {
  width: 100%;
  height: 100%;
  max-height: 100%;
}
.pic .dim {
  font: 500 44px var(--f-m);
  fill: var(--ink2);
}
.pic .front.hd {
  cursor: pointer;
}
.pic .front.hd:hover > rect:first-child {
  stroke: var(--accent);
  stroke-opacity: 1;
  stroke-width: 8;
}
.pichint {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: var(--ink2);
  min-height: 18px;
}
.panel {
  overflow: auto;
  padding: 18px 20px 30px;
  background: var(--surface);
  border-left: 1px solid var(--line);
}
.syss,
.stcs,
.mats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mats {
  grid-template-columns: repeat(2, 1fr);
}
.sys,
.stc,
.mat {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--raised);
  border-radius: 14px;
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sys span {
  font-size: 13px;
}
.sys small,
.stc small,
.mat small {
  font-size: 11.5px;
  line-height: 1.3;
}
.sys.on,
.stc.on,
.mat.on {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.stc svg {
  width: 100%;
  height: 92px;
  margin-bottom: 4px;
}
.mat {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  column-gap: 7px;
}
.mat small {
  flex-basis: 100%;
}
.cabs {
  display: grid;
  gap: 10px;
  margin: 14px 0 10px;
}
.cab {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.cabh {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.cabh b {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  display: inline-grid;
  place-items: center;
  font-size: 12px;
}
.sp {
  flex: 1;
}
.ib {
  border: 1px solid var(--line);
  background: none;
  border-radius: 8px;
  width: 30px;
  height: 28px;
  font-size: 12px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0;
}
.row > label {
  width: 58px;
  font-size: 13px;
  color: var(--ink2);
  flex: none;
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
}
.seg button {
  border: 0;
  background: none;
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 13.5px;
  font-weight: 500;
}
.seg button.on {
  background: var(--ink);
  color: var(--bg);
}
.seg button.on small {
  color: inherit;
  opacity: 0.75;
}
.adds {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}
.btn {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: 999px;
  padding: 9px 16px;
  font-weight: 600;
}
.btn.pri {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.ghost {
  background: none;
}
.btn.big {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 14px;
}
.linkb {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
}
.imp {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.imp summary {
  font-weight: 600;
  cursor: pointer;
}
textarea,
input,
select {
  width: 100%;
  font: inherit;
  font-size: 14px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--raised);
  color: var(--ink);
}
textarea {
  font-family: var(--f-m);
  font-size: 12.5px;
}
.field {
  display: block;
  margin: 10px 0;
}
.field > span {
  display: block;
  font-size: 13px;
  color: var(--ink2);
  margin-bottom: 4px;
}
.sws {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.swb {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--raised);
  box-shadow: 0 0 0 1px var(--line);
}
.swb.on {
  box-shadow: 0 0 0 2.5px var(--accent);
}
.ord {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.ord th,
.ord td {
  padding: 7px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
.ord th {
  font-size: 12px;
  color: var(--ink2);
  font-weight: 600;
}
.ord .num {
  text-align: right;
  font-family: var(--f-m);
  font-size: 13px;
  white-space: nowrap;
}
.ord td small {
  display: block;
  font-family: var(--f-b);
  font-size: 11.5px;
}
.ord tfoot td {
  border-bottom: 0;
}
.ord .tot td {
  font-weight: 700;
  font-size: 15px;
  border-top: 2px solid var(--ink);
}
.pbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.ptot {
  margin-right: auto;
  display: flex;
  flex-direction: column;
}
.ptot span {
  font-size: 12px;
  color: var(--ink2);
}
.ptot b {
  font-size: 22px;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 14, 0.45);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
}
.modal[hidden] {
  display: none;
}
.mbox {
  background: var(--surface);
  border-radius: 18px;
  padding: 20px 22px;
  width: min(460px, 100%);
  max-height: 90vh;
  overflow: auto;
}
.otext {
  white-space: pre-wrap;
  font: 12.5px/1.5 var(--f-m);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
}
.legal {
  font-size: 11px;
  color: var(--ink2);
  text-align: center;
  margin: 0;
  padding: 6px 16px 10px;
}

/* ---------- phone ---------- */
@media (max-width: 860px) {
  .app {
    height: auto;
    display: block;
    padding-bottom: 136px;
  }
  header.top {
    padding: 10px 14px;
  }
  .steps {
    display: none;
  }
  .main {
    display: block;
  }
  .stage {
    position: sticky;
    top: 0;
    z-index: 5;
    height: 38vh;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .stagebar {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chip {
    white-space: nowrap;
  }
  .panel {
    border-left: 0;
    padding: 14px 14px 30px;
  }
  .syss,
  .stcs {
    grid-template-columns: repeat(3, 1fr);
  }
  .stc svg {
    height: 70px;
  }
  .mats {
    grid-template-columns: 1fr 1fr;
  }
  .pbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(62px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    padding: 8px 14px;
  }
  .pbar .ghost {
    display: none;
  }
  .bsteps {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around;
  }
  .bsteps button {
    flex-direction: column;
    gap: 3px;
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 12px;
  }
  .legal {
    padding-bottom: 150px;
  }
}

/* ---------- round 2: 3D, a look per front, surprise, quick setup ---------- */
.pic[hidden] {
  display: none;
}
.pic3d {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  padding: 0;
  margin: 10px 0 6px;
}
.pic3d canvas {
  display: block;
  cursor: grab;
}
.pic3d .c3 {
  margin: auto;
  text-align: center;
}
.stagebar {
  align-items: center;
}
.stagebar .seg button {
  padding: 4px 12px;
}
.btn.sm {
  padding: 6px 12px;
  font-size: 13px;
}
.btn.surp {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}
.chip.rec {
  border-color: var(--accent);
  color: var(--accent);
}
.pic .front {
  cursor: pointer;
}
.pic .front:hover > rect:first-child {
  stroke: var(--accent);
  stroke-opacity: 1;
  stroke-width: 8;
}
.stcs.two {
  grid-template-columns: repeat(2, 1fr);
}
.stcs.two .stc svg {
  height: 110px;
}
.mat .tag {
  font-style: normal;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--warn-soft);
  color: var(--warn);
  border-radius: 5px;
  padding: 1px 5px;
}
.sw.gl {
  background-image: repeating-linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.6) 0 2px,
    rgba(0, 0, 0, 0.12) 2px 4px
  ) !important;
}
.sws {
  gap: 10px;
}
.swb {
  width: 54px;
  height: 54px;
  border-radius: 12px;
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.swb span {
  position: absolute;
  top: calc(100% + 3px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 10.5px;
  color: var(--ink2);
  white-space: nowrap;
}
.sws {
  padding-bottom: 18px;
}
.selcard {
  border: 2px solid var(--accent);
  border-radius: 14px;
  padding: 10px 12px;
  margin: 12px 0;
  background: var(--accent-soft);
}
.selcard .seg {
  margin: 6px 0;
}
h3.big {
  font-size: 13px;
  color: var(--ink);
  margin-top: 26px;
}
.qks {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.qk {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--raised);
  border-radius: 12px;
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.qk:hover {
  border-color: var(--accent);
}
.qk small {
  font-size: 11.5px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.syss .sys {
  align-items: flex-start;
}
.ord .lkh td {
  padding-top: 14px;
  font-weight: 600;
  border-bottom: 0;
}
.ord .lkh .sw {
  vertical-align: -2px;
  margin-right: 6px;
}
@media (max-width: 860px) {
  .stagebar .chip.rec {
    display: none;
  }
  .stagebar {
    gap: 5px;
  }
  .stcs.two .stc svg {
    height: 80px;
  }
  .swb {
    width: 46px;
    height: 46px;
  }
}

.stagebar .seg {
  flex-wrap: nowrap;
  flex: none;
}
.btn.surp {
  white-space: nowrap;
}

/* ---------- the IKEA list: paste, see what was found, use it ---------- */
.impcard {
  background: var(--raised);
  border: 1.5px solid var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
  border-radius: 14px;
  padding: 12px;
  margin: 6px 0 4px;
}
.imphead {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.imphead .sp {
  flex: 1;
}
.file {
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.file input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.impcard textarea {
  font-family: var(--f-m);
  font-size: 12.5px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  resize: vertical;
  min-height: 92px;
}
.impprev {
  margin-top: 6px;
}
.igrp {
  border-top: 1px solid var(--line);
  padding: 10px 0 4px;
}
.igrp:first-child {
  border-top: 0;
}
.igh {
  font-size: 14px;
  margin-bottom: 6px;
}
.ichips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 9px;
}
.ichip {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 13px;
}
.ichip small {
  margin-left: 2px;
}
.hint.warn {
  background: var(--warn-soft);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 9px;
}
.impbad {
  font-size: 13.5px;
  color: var(--ink2);
}
.impok {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 14px;
  line-height: 1.5;
  margin: 8px 0 2px;
}
.lnk {
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
  font-weight: 600;
}
.how {
  margin-top: 8px;
  font-size: 13.5px;
}
.how summary {
  cursor: pointer;
  color: var(--ink2);
  font-weight: 600;
}
.how ol {
  margin: 8px 0 4px;
  padding-left: 20px;
  line-height: 1.5;
}
.how li {
  margin-bottom: 4px;
}
.or {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 22px 0 12px;
  color: var(--ink2);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.or::before,
.or::after {
  content: '';
  flex: 1;
  border-top: 1px solid var(--line);
}
.addrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
}
.addrow > span {
  font-size: 13px;
  color: var(--ink2);
  margin-right: 4px;
}

.impsub {
  display: flex;
  gap: 14px;
  justify-content: flex-end;
  font-size: 13px;
  margin-top: 4px;
}
@media (max-width: 480px) {
  .stagebar .surp span {
    display: none;
  }
}

/* cabinet cards fold to one line */
details.cab > summary {
  list-style: none;
  cursor: pointer;
  margin-bottom: 0;
}
details.cab > summary::-webkit-details-marker {
  display: none;
}
details.cab[open] > summary {
  margin-bottom: 6px;
}
.cabh span small {
  display: block;
  font-size: 12px;
}

/* demo designs */
.demos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.demo {
  text-align: left;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 9px 11px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.demo.on {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.demo small {
  font-size: 12px;
  line-height: 1.35;
}
.dstrip {
  display: flex;
  height: 22px;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 5px;
  border: 1px solid rgba(0, 0, 0, 0.1);
}
.dstrip i {
  flex: 1;
}
.dstrip i:first-child {
  flex: 3;
}

/* ==== the BRUIS look (applies over the rules above) ==== */
body {
  font-size: 15px;
  font-variation-settings: 'opsz' 14;
}
h2 {
  font-family: var(--f-d);
  font-weight: 750;
  font-stretch: 78%;
  font-variation-settings:
    'wdth' 78,
    'opsz' 48;
  font-size: 32px;
  line-height: 1.02;
  letter-spacing: -0.015em;
  margin: 2px 0 8px;
}
h3,
h3.big {
  font-size: 15.5px;
  font-weight: 650;
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink);
  margin: 26px 0 10px;
}
.lede {
  font-size: 15px;
  max-width: 62ch;
}

/* header: the wordmark and the four steps as one numbered track */
header.top {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 12px 20px;
}
.brand {
  font-family: var(--f-b);
  font-size: 15px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.brand b {
  font-weight: 800;
  font-size: 26px;
  letter-spacing: 0.02em;
  font-variation-settings:
    'wdth' 75,
    'opsz' 96;
  margin: 0;
}
.brand small {
  display: inline;
  font-size: 13px;
  margin: 0;
}
.steps {
  background: none;
  border: 0;
  padding: 0;
  gap: 0;
}
.steps button {
  border-radius: 0;
  padding: 6px 4px 6px 14px;
  position: relative;
  color: var(--ink3);
  font-weight: 600;
}
.steps button + button::before {
  content: '';
  width: 26px;
  border-top: 1.5px solid var(--line);
  margin-right: 10px;
}
.steps button.on {
  background: none;
  color: var(--ink);
}
.steps button.on i {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.steps button.done {
  color: var(--ink2);
}
.steps button.done i,
.bsteps button.done i {
  background: var(--mdf);
  border-color: var(--mdf);
  color: #fff;
}
.steps button i,
.bsteps button i {
  width: 22px;
  height: 22px;
  font-size: 12px;
  font-weight: 700;
}

/* the stage: a wall and a floor */
.stage {
  background: var(--stage);
}
.chip {
  border-radius: 8px;
}
.panel {
  background: var(--surface);
}

/* buttons: squarer, one cobalt for the main action */
.btn {
  border-radius: 10px;
  font-weight: 650;
}
.btn.sm {
  border-radius: 8px;
}
.btn.pri {
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
}
.btn.surp {
  border-radius: 8px;
}
.btn:focus-visible,
.tile:focus-visible,
.sys:focus-visible,
.stc:focus-visible,
.mat:focus-visible,
.seg button:focus-visible,
.swb:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}

/* choice cards: a firm cobalt edge when chosen, no glow */
.sys,
.stc,
.mat,
.cab {
  border-radius: 12px;
  border: 1px solid var(--line);
}
.sys.on,
.stc.on,
.mat.on,
.tile.on {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.sys b {
  font-size: 17px;
  font-weight: 750;
  font-variation-settings: 'wdth' 80;
}
.mat .tag {
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
}
.or {
  text-transform: none;
  letter-spacing: 0;
  font-size: 13px;
}
.seg {
  border-radius: 9px;
}
.seg button {
  border-radius: 6px;
}

/* presets and demos: each one shows its own drawing */
.tiles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.tile {
  text-align: left;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 7px 7px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.tile:hover {
  border-color: var(--ink3);
}
.tile b {
  font-size: 15px;
  font-weight: 700;
  padding: 0 4px;
  margin-top: 6px;
}
.tile small {
  font-size: 12.5px;
  line-height: 1.35;
  padding: 0 4px;
}
.tpic {
  display: block;
  height: 104px;
  background: var(--stage);
  border-radius: 8px;
  overflow: hidden;
  padding: 10px 8px 0;
}
.tpic svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* the IKEA list card */
.impcard {
  border: 1.5px solid var(--ink);
  box-shadow: 4px 4px 0 var(--mdf);
  border-radius: 12px;
}
.impcard textarea {
  font-family: ui-monospace, Menlo, monospace;
}

/* the price bar: a paint chip of your main look, then the price */
.pbar {
  background: var(--bg);
  gap: 14px;
}
.pchip {
  display: flex;
  align-items: stretch;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  min-width: 0;
  max-width: 260px;
}
.pchip i {
  width: 46px;
  flex: none;
}
.pchip span {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 5px 12px 6px 10px;
  min-width: 0;
}
.pchip b {
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pchip small {
  font-size: 11.5px;
  white-space: nowrap;
}
.ptot b {
  font-size: 24px;
  font-weight: 750;
  font-variation-settings:
    'wdth' 80,
    'opsz' 36;
  font-variant-numeric: tabular-nums;
}
.ord .num,
.pic .dim {
  font-variant-numeric: tabular-nums;
}
.pic .dim {
  font-weight: 600;
}
@media (max-width: 860px) {
  .pchip {
    max-width: 44%;
  }
  .pchip i {
    width: 30px;
  }
  .ptot b {
    font-size: 20px;
  }
  .brand b {
    font-size: 22px;
  }
  h2 {
    font-size: 28px;
  }
}
@media (max-width: 400px) {
  .pchip small {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
@media (max-width: 860px) {
  .brand small {
    display: none;
  }
  .bsteps {
    background: var(--bg);
  }
  .bsteps button.on {
    background: none;
    color: var(--ink);
  }
  .bsteps button.on i {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .bsteps button {
    color: var(--ink3);
    font-weight: 600;
  }
}
@media (max-width: 480px) {
  .pchip span {
    display: none;
  }
  .pchip i {
    width: 38px;
    height: 38px;
  }
  .ptot span {
    white-space: nowrap;
  }
}

/* the render: one still picture, with the selection and widths drawn on top */
.pic3d {
  position: relative;
  margin: 10px 0 6px;
  border-radius: 10px;
  background: var(--stage);
}
.pic3d canvas {
  cursor: pointer;
}
.rover {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.rover .osel {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linejoin: round;
}
.rover .odim {
  stroke: rgba(31, 36, 40, 0.55);
  stroke-width: 1.2;
}
.rover .otx {
  font: 600 11px var(--f-b);
  fill: rgba(31, 36, 40, 0.75);
  text-anchor: middle;
}

/* the picture: the canvas fills the stage */
.pic3d canvas {
  position: absolute;
  inset: 0;
  display: block;
}
.pic3d {
  overflow: hidden;
}

/* ==== studio layer: image first, quiet type, hairlines instead of boxes ==== */
body {
  font-weight: 400;
  letter-spacing: 0.002em;
}
h2 {
  font-weight: 380;
  font-stretch: 100%;
  font-variation-settings:
    'wdth' 100,
    'opsz' 96;
  font-size: 38px;
  line-height: 1.02;
  letter-spacing: -0.025em;
  margin: 6px 0 12px;
}
h3,
h3.big {
  font-size: 13px;
  font-weight: 560;
  color: var(--ink);
  margin: 34px 0 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.lede {
  color: var(--ink2);
  font-size: 15px;
  line-height: 1.5;
}
.hint {
  font-size: 13px;
}

/* header: wordmark, then the steps as small numbered text */
header.top {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 14px 28px;
}
.brand span {
  font-size: 15px;
  font-weight: 450;
}
.brand small {
  color: var(--ink3);
}
.steps button {
  font-weight: 500;
  font-size: 14px;
  color: var(--ink3);
  padding: 6px 2px 6px 18px;
}
.steps button + button::before {
  width: 18px;
  border-top: 1px solid var(--line);
}
.steps button i,
.bsteps button i {
  border: 0;
  width: auto;
  height: auto;
  background: none !important;
  color: inherit !important;
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.steps button.on,
.bsteps button.on {
  color: var(--ink);
  background: none;
}
.steps button.on span,
.bsteps button.on span {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 6px;
}

/* the stage: the render runs edge to edge, the caption underneath */
.stage {
  padding: 0;
  background: var(--stage);
}
.pic3d {
  margin: 0;
  border-radius: 0;
}
.pic {
  padding: 0;
}
.stagebar {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 12px 28px 16px;
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.cap {
  margin: 0;
  font-size: 13.5px;
  color: var(--ink2);
  line-height: 1.45;
  flex: 1;
}
.cap b {
  color: var(--ink);
  font-weight: 560;
}
.cap span {
  display: block;
  color: var(--ink3);
  font-size: 12.5px;
}
.lnk.surp {
  font-weight: 500;
  font-size: 13.5px;
  color: var(--ink);
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
  white-space: nowrap;
}
.rover .osel {
  stroke: #fff;
  stroke-width: 2;
  filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.5));
}

/* the panel: a spec sheet */
.panel {
  background: var(--bg);
  border-left: 1px solid var(--line);
  padding: 26px 28px 40px;
}
.btn {
  border-radius: 2px;
  border: 1px solid var(--ink);
  background: transparent;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.btn.sm {
  border-radius: 2px;
}
.btn.pri {
  background: var(--ink);
  color: var(--accent-ink);
  box-shadow: none;
}
.btn.surp {
  border-radius: 2px;
  background: transparent;
  color: var(--ink);
}
.lnk {
  color: var(--ink);
  font-weight: 500;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
.seg {
  border-radius: 2px;
  background: transparent;
  border: 1px solid var(--line);
  padding: 2px;
}
.seg button {
  border-radius: 1px;
  font-weight: 450;
  color: var(--ink2);
}
.seg button.on {
  background: var(--ink);
  color: var(--accent-ink);
}

/* choices: borderless pictures with a caption; the chosen one gets a fine ink rule */
.tile,
.stc,
.sys {
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 0;
  box-shadow: none;
}
.tile.on,
.stc.on,
.sys.on {
  box-shadow: none;
}
.tpic,
.stc svg {
  border-radius: 2px;
  outline: 1px solid transparent;
  outline-offset: 3px;
}
.tile.on .tpic,
.stc.on svg {
  outline-color: var(--ink);
}
.tile:hover .tpic,
.stc:hover svg {
  outline-color: var(--line);
}
.tile b,
.stc b {
  font-size: 14px;
  font-weight: 560;
  padding: 0;
  margin-top: 9px;
}
.tile small,
.stc small {
  padding: 0;
  font-size: 12.5px;
}
.tiles {
  gap: 22px 16px;
}
.syss {
  gap: 0;
  border: 1px solid var(--line);
}
.sys {
  padding: 12px 14px;
  border-right: 1px solid var(--line);
}
.sys:last-child {
  border-right: 0;
}
.sys.on {
  background: var(--ink);
  color: var(--accent-ink);
}
.sys.on span {
  color: inherit;
  opacity: 0.75;
}
.sys b {
  font-variation-settings: 'wdth' 100;
  font-weight: 600;
  font-size: 15px;
}

/* materials as a list of rows */
.mats {
  grid-template-columns: 1fr;
  gap: 0;
  border-top: 1px solid var(--line);
}
.mat {
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  padding: 12px 4px;
  box-shadow: none;
}
.mat.on {
  box-shadow: none;
  background: var(--accent-soft);
}
.mat b {
  font-weight: 560;
}
.mat .sw {
  width: 22px;
  height: 22px;
  border-radius: 1px;
}
.mat.on b::after {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-left: 8px;
  vertical-align: middle;
  background: var(--ink);
  border-radius: 50%;
}
.mat .tag {
  background: none;
  color: var(--warn);
  padding: 0;
  font-weight: 500;
}
.swb {
  border-radius: 1px;
  border: 0;
  box-shadow: none;
  outline: 1px solid transparent;
  outline-offset: 3px;
}
.swb.on {
  box-shadow: none;
  outline-color: var(--ink);
}

/* cards that stay boxes: the IKEA list, cabinets, the selected front */
.impcard {
  border: 1px solid var(--ink);
  box-shadow: none;
  border-radius: 2px;
  background: var(--raised);
}
.impcard textarea {
  border-radius: 2px;
  background: var(--bg);
}
.cab,
details.cab {
  border-radius: 2px;
  background: transparent;
}
.cabh b {
  background: none;
  color: var(--ink3);
  width: auto;
  font-weight: 500;
}
.ib {
  border-radius: 2px;
}
.selcard {
  border: 1px solid var(--ink);
  border-radius: 2px;
  background: var(--raised);
}
.impok {
  border-radius: 2px;
  background: var(--accent-soft);
}
.hint.warn {
  border-radius: 2px;
}
.or {
  font-size: 12.5px;
  color: var(--ink3);
}
.ord .tot td {
  border-top: 1px solid var(--ink);
}
.btn.big {
  border-radius: 2px;
  padding: 16px;
}

/* the price bar */
.pbar {
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 12px 28px;
}
.pchip {
  border-radius: 2px;
  background: transparent;
  border: 0;
}
.pchip i {
  border-radius: 1px;
  width: 40px;
}
.ptot b {
  font-weight: 450;
  font-variation-settings:
    'wdth' 100,
    'opsz' 36;
  font-size: 24px;
  letter-spacing: -0.01em;
}
.ptot span {
  color: var(--ink3);
}

@media (max-width: 860px) {
  header.top {
    padding: 12px 16px;
  }
  .stage {
    height: auto;
    padding: 0;
  }
  .pic3d {
    height: 40vh;
    min-height: 240px;
  }
  .stagebar {
    padding: 10px 16px 12px;
  }
  .panel {
    padding: 20px 16px 40px;
  }
  h2 {
    font-size: 32px;
  }
  .pbar {
    padding: 10px 16px;
  }
  .bsteps {
    background: var(--bg);
  }
  .bsteps button {
    font-size: 12.5px;
  }
  .bsteps button i {
    font-size: 11px;
  }
}
.tpic img,
.tpic .tdraw {
  display: block;
  width: 100%;
  height: 100%;
}
.tpic img {
  object-fit: cover;
}
.tpic:has(img) {
  padding: 0;
}

/* ==== the landing page ==== */
.home[hidden] {
  display: none;
}
.app[data-step='home'] .main,
.app[data-step='home'] .pbar {
  display: none;
}
.app[data-step='home'] {
  height: auto;
  display: block;
}
.app[data-step='home'] .steps button.on span {
  text-decoration: none;
}
button.brand {
  background: none;
  border: 0;
  padding: 0;
  color: var(--ink);
  text-align: left;
}
.home {
  background: var(--bg);
}
.hero {
  position: relative;
}
.hpic {
  aspect-ratio: 1800 / 860;
  max-height: 80vh;
  width: 100%;
  overflow: hidden;
  background: var(--stage);
}
.hpic img,
.hpic .tdraw {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hpic .tdraw svg {
  width: 100%;
  height: 100%;
}
.htext {
  max-width: 1200px;
  margin: 0 auto;
  padding: 36px 28px 8px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 12px 48px;
  align-items: end;
}
.htext h1 {
  font-family: var(--f-d);
  font-weight: 360;
  font-variation-settings:
    'wdth' 100,
    'opsz' 96;
  font-size: clamp(34px, 4.6vw, 62px);
  line-height: 1;
  letter-spacing: -0.03em;
  margin: 0;
  grid-row: span 2;
}
.htext p {
  margin: 0;
  color: var(--ink2);
  font-size: 16px;
  line-height: 1.5;
  max-width: 46ch;
}
.hcta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.hcta .btn {
  padding: 13px 20px;
  font-size: 15px;
}
.hsec {
  max-width: 1200px;
  margin: 0 auto;
  padding: 56px 28px 0;
}
.hsec h2 {
  font-size: 28px;
  margin: 0 0 18px;
}
.hhead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 24px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  margin-bottom: 18px;
}
.hhead h2 {
  margin: 0;
}
.hhead p {
  margin: 0;
  color: var(--ink2);
  font-size: 14px;
}
.hsteps ol {
  list-style: none;
  counter-reset: s;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line);
}
.hsteps li {
  counter-increment: s;
  padding: 18px 24px 0 0;
}
.hsteps li::before {
  content: counter(s);
  display: block;
  font-size: 13px;
  color: var(--ink3);
  margin-bottom: 10px;
  font-variant-numeric: tabular-nums;
}
.hsteps b,
.hfacts b,
.hcard h3 {
  display: block;
  font-size: 17px;
  font-weight: 560;
  margin: 0 0 6px;
  padding: 0;
  border: 0;
  color: var(--ink);
}
.hsteps span,
.hfacts span,
.hcard p {
  color: var(--ink2);
  font-size: 14.5px;
  line-height: 1.5;
}
.hdemos {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px 20px;
}
.hdemo {
  text-align: left;
  background: none;
  border: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hdemo .tpic {
  height: auto;
  aspect-ratio: 3 / 2;
  padding: 0;
}
.hdemo:hover .tpic {
  outline-color: var(--ink3);
}
.hdl {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
}
.hdl b {
  font-size: 15px;
  font-weight: 560;
}
.hdl em {
  font-style: normal;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.hdemo small {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.4;
}
.hsplit {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.hcard {
  border-top: 1px solid var(--ink);
  padding-top: 18px;
}
.hcard .btn {
  margin-top: 6px;
}
.hchips {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
}
.hchips i {
  flex: 1;
  height: 34px;
  border-radius: 1px;
}
.hfacts ul {
  list-style: none;
  margin: 0;
  padding: 18px 0 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  border-top: 1px solid var(--line);
}
.hfoot {
  max-width: 1200px;
  margin: 64px auto 0;
  padding: 18px 28px 40px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 16px;
  align-items: baseline;
  color: var(--ink3);
  font-size: 13px;
}
.hfoot b {
  font-weight: 800;
  font-variation-settings: 'wdth' 75;
  font-size: 18px;
  color: var(--ink);
}
/* the order step: plan check and sample box */
.chk {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 18px 0 4px;
  font-size: 14px;
  line-height: 1.45;
  cursor: pointer;
}
.chk input {
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  accent-color: var(--ink);
  flex: none;
}
.chk b {
  display: block;
  font-weight: 560;
}
.chk span {
  color: var(--ink2);
}
.sbox {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 14px;
}
.sbox div {
  flex: 1;
}
.sbox b {
  display: block;
  font-weight: 560;
}
.sbox span {
  color: var(--ink2);
}
@media (max-width: 860px) {
  .hpic {
    aspect-ratio: 4 / 3;
  }
  .htext {
    grid-template-columns: 1fr;
    padding: 24px 16px 0;
  }
  .htext h1 {
    grid-row: auto;
  }
  .hsec {
    padding: 44px 16px 0;
  }
  .hsteps ol,
  .hfacts ul {
    grid-template-columns: 1fr;
  }
  .hsteps li {
    padding: 16px 0 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  .hdemos {
    grid-template-columns: 1fr 1fr;
    gap: 24px 12px;
  }
  .hsplit {
    grid-template-columns: 1fr;
    gap: 36px;
  }
  .hfoot {
    padding: 18px 16px 110px;
    flex-direction: column;
    gap: 4px;
  }
  .app[data-step='home'] .bsteps {
    display: none;
  }
}
.hdl em {
  white-space: nowrap;
}

/* the 2027 edit */
.tag27 {
  font-style: normal;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid currentColor;
  border-radius: 2px;
  padding: 0 4px;
  margin-left: 4px;
  vertical-align: 2px;
  color: var(--ink2);
}
.swb.tr::after {
  content: '2027';
  position: absolute;
  top: 3px;
  right: 3px;
  font-size: 8.5px;
  font-weight: 600;
  color: #fff;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 2px;
  padding: 0 3px;
}
.h27 {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 40px;
  align-items: start;
}
.h27t {
  border-top: 1px solid var(--ink);
  padding-top: 18px;
}
.h27t h2 {
  margin-bottom: 12px;
}
.h27t p {
  color: var(--ink2);
  font-size: 15px;
  line-height: 1.55;
  max-width: 52ch;
}
.h27c {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 10px;
  border-top: 1px solid var(--line);
  padding-top: 18px;
}
.h27c span {
  font-size: 13px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.h27c i {
  display: block;
  aspect-ratio: 4 / 3;
  border-radius: 1px;
  margin-bottom: 6px;
}
.h27c small {
  color: var(--ink3);
  font-size: 11.5px;
}
@media (max-width: 860px) {
  .h27 {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .h27c {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* style cards with their close-up render */
.stc img,
.stc .tdraw {
  display: block;
  width: 100%;
  aspect-ratio: 32 / 30;
  height: auto;
  object-fit: cover;
  border-radius: 2px;
  outline: 1px solid transparent;
  outline-offset: 3px;
}
.stc .tdraw svg {
  height: 100%;
}
.stc.on img {
  outline-color: var(--ink);
}
.stcs.two {
  grid-template-columns: repeat(2, 1fr);
}
.adds.qa {
  margin-top: 10px;
}
/* FAQ */
.hfaq details {
  border-top: 1px solid var(--line);
  padding: 14px 0;
}
.hfaq details:last-child {
  border-bottom: 1px solid var(--line);
}
.hfaq summary {
  cursor: pointer;
  font-size: 16px;
  font-weight: 500;
  list-style: none;
  display: flex;
  justify-content: space-between;
  gap: 16px;
}
.hfaq summary::-webkit-details-marker {
  display: none;
}
.hfaq summary::after {
  content: '+';
  color: var(--ink3);
  font-weight: 400;
}
.hfaq details[open] summary::after {
  content: '–';
}
.hfaq p {
  color: var(--ink2);
  font-size: 14.5px;
  line-height: 1.55;
  max-width: 70ch;
  margin: 10px 0 2px;
}
/* the quote, only when printing */
#printq {
  display: none;
}
@media print {
  body > *:not(#printq) {
    display: none !important;
  }
  #printq {
    display: block;
    font-family: var(--f-b);
    color: #111;
    font-size: 11pt;
  }
  #printq header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid #111;
    padding-bottom: 8pt;
    margin-bottom: 12pt;
  }
  #printq header b {
    font-size: 20pt;
    font-weight: 800;
    font-variation-settings: 'wdth' 75;
  }
  #printq img {
    width: 100%;
    max-height: 90mm;
    object-fit: cover;
    margin-bottom: 10pt;
  }
  #printq h1 {
    font-size: 16pt;
    font-weight: 450;
    margin: 0 0 4pt;
  }
  #printq table {
    width: 100%;
    border-collapse: collapse;
    margin: 10pt 0;
  }
  #printq td {
    border-bottom: 0.5pt solid #bbb;
    padding: 4pt 2pt;
    vertical-align: top;
  }
  #printq td small {
    display: block;
    color: #555;
    font-size: 9pt;
  }
  #printq .num {
    text-align: right;
    white-space: nowrap;
  }
  #printq .tot td {
    border-top: 1pt solid #111;
    font-weight: 600;
  }
  #printq .link {
    font-size: 8pt;
    color: #555;
    word-break: break-all;
  }
  #printq footer {
    margin-top: 14pt;
    font-size: 8.5pt;
    color: #555;
  }
}

/* the three handles */
.hcards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.hcard {
  text-align: left;
  background: none;
  border: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.hcard .hico svg {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 2px;
  outline: 1px solid transparent;
  outline-offset: 3px;
}
.hcard.on .hico svg {
  outline-color: var(--ink);
}
.hcard b {
  font-size: 14px;
  font-weight: 560;
  margin-top: 8px;
}
.hcard small {
  font-size: 12px;
  color: var(--ink2);
  line-height: 1.35;
}

</style>
</head>

            door 49.5 × 229.4 cm on a 236 frame (195 cm on a 201 frame)

     BESTÅ  fronts 59.6 wide; 63.7 / 37.7 / 25.7 high for the 64 / 38 / 26 positions

*/

    what: 'Wardrobe',
    blurb: 'Wardrobe frames 50, 75 or 100 cm wide, 201 or 236 cm high',

  },

const LAYOUTS = {

/* Rubio Monocoat Oil Plus 2C: one coat of hardwax oil, in four tints. mix = how much of the tint covers the wood */
const OILS = {
  pure: { name: 'Pure', blurb: 'Clear, the wood as it is', hex: '#000000', mix: 0 },
  white5: { name: 'White 5%', blurb: 'A light Nordic wash', hex: '#F4EFE7', mix: 0.38 },
  smoke5: { name: 'Smoke 5%', blurb: 'Soft grey, like weathered wood', hex: '#C9C1B6', mix: 0.42 },
  charcoal: { name: 'Charcoal', blurb: 'Near black, the grain still shows', hex: '#34302D', mix: 0.74 },

};
/* side panels: none, or on the left / right / both ends of the run */
const SIDES = { none: 'None', left: 'Left', right: 'Right', both: 'Both ends' };
/* the rounded or chamfered edge on every front */
const EDGES = {
  round: { name: 'Round', blurb: '2 mm radius, soft and hard-wearing' },
  chamfer: { name: 'Chamfer', blurb: '45°, crisp; shows the ply layers as a line' }
};
function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)),
    x = p(a),
    y = p(b);
  return (
    '#' +
    x
      .map((v, i) =>
        Math.round(v + (y[i] - v) * t)
          .toString(16)
          .padStart(2, '0')
      )
      .join('')
  );
}
/* the wood and grain colour of a material after its oil */
function woodCol(mat, oil) {
  const m = MATS[mat],
    o = (m.oil && OILS[oil]) || OILS.pure;
  return { wood: mixHex(m.wood, o.hex, o.mix), grain: mixHex(m.grain || m.wood, o.hex, o.mix * 0.75) };
}
/* the curated range: two styles … */

/* … the frame around fluted glass … */
const GFRAME = {

const COLOURS = {

/* ---------- cabinet → fronts ----------
   A front: { id, cab, kind: 'door'|'drawer', nom: 'w×h' (IKEA's name for the size), w, h (real, mm),
              x, y (bottom-left in the picture, mm from the left / floor), hinge: 'L'|'R'|null } */
const PAX_H = { 236: 2294, 201: 1950 },
  PAX_W = { 50: 495, 25: 245 };
function frontsOf(c, x0, y0) {
  const out = [],
    add = (kind, nw, nh, realW, realH, x, y, hinge) =>
      out.push({
        id: c.id + ':' + out.length,
        cab: c.id,
        ckind: c.kind,
        sys: c.sys,
        kind,
        nom: `${nw}×${nh}`,
        w: realW,
        h: realH,
        x,
        y,
        hinge
      });
  const W = c.w * 10,
    H = c.h * 10;
  if (c.layout === 'open') return out;
  if (c.sys === 'pax') {
    const parts = c.w === 100 ? [50, 50] : c.w === 75 ? [50, 25] : [50];
    const dh = PAX_H[c.h];
    let x = x0 + 2.5;
    parts.forEach((pw, i) => {
      add(
        'door',
        pw,
        c.h === 236 ? 229 : 195,
        PAX_W[pw],
        dh,
        x,
        y0 + (H - dh) / 2,
        parts.length === 1 ? 'R' : i === 0 ? 'L' : 'R'
      );
      x += pw * 10;
    });
  } else if (c.sys === 'metod') {
    const g = 3; // METOD fronts are 3 mm smaller than the cabinet
    if (c.kind === 'base') {
      const stack = {
        door: null,
        doors2: null,
        drawer_door: [20, 60],
        drawers3: [20, 20, 40],
        drawers2: [40, 40],
        drawers4: [20, 20, 20, 20]
      }[c.layout];
      if (!stack) {
        const n = c.layout === 'doors2' ? 2 : 1;
        for (let i = 0; i < n; i++)
          add(
            'door',
            c.w / n,
            c.h,
            W / n - g,
            H - g,
            x0 + (i * W) / n + g / 2,
            y0 + g / 2,
            n === 1 ? 'R' : i === 0 ? 'L' : 'R'
          );
      } else {
        let y = y0 + H;
        stack.forEach((sh, i) => {
          y -= sh * 10;
          const isDoor = c.layout === 'drawer_door' && i === 1;
          add(isDoor ? 'door' : 'drawer', c.w, sh, W - g, sh * 10 - g, x0 + g / 2, y + g / 2, isDoor ? 'R' : null);
        });
      }
    } else if (c.kind === 'wall') {
      const n = c.layout === 'doors2' ? 2 : 1;
      for (let i = 0; i < n; i++)
        add(
          'door',
          c.w / n,
          c.h,
          W / n - g,
          H - g,
          x0 + (i * W) / n + g / 2,
          y0 + g / 2,
          n === 1 ? 'R' : i === 0 ? 'L' : 'R'
        );
    } else {
      const stack = c.layout === 'split' ? [140, 60] : [c.h]; // bottom door first
      let y = y0;
      stack.forEach(sh => {
        add('door', c.w, sh, W - g, sh * 10 - g, x0 + g / 2, y + g / 2, 'R');
        y += sh * 10;
      });
    }
  } else if (c.sys === 'besta') {
    const cols = c.w / 60,
      realH = { 64: 637, 38: 377, 26: 257 };
    for (let k = 0; k < cols; k++) {
      const xs = x0 + k * 600 + 2;
      let stack;
      if (c.layout === 'drawers') stack = c.h === 64 ? [26, 38] : [c.h];
      else stack = c.h === 38 ? [38] : Array.from({ length: c.h / 64 }, () => 64);
      let y = y0 + H;
      stack.forEach(sh => {
        y -= sh * 10;
        const isDrawer = c.layout === 'drawers';
        add(
          isDrawer ? 'drawer' : 'door',
          60,
          sh,
          596,
          realH[sh],
          xs,
          y + (sh * 10 - realH[sh]) / 2,
          isDrawer ? null : cols > 1 && k === 0 ? 'L' : 'R'
        );
      });
    }
  }
  out.forEach(f => {
    if (f.hinge && S.flip[f.id]) f.hinge = f.hinge === 'L' ? 'R' : 'L';
  });
  return out;
}

/* ---------- the whole layout: cabinets placed side by side, kitchen wall cabinets above ---------- */
function layout() {
  const cabs = [],
    fronts = [];
  const plinth = S.sys === 'metod' ? 100 : S.sys === 'besta' ? 120 : 0;
  let xb = 0,
    xw = 0;
  // the floor row first (base and tall cabinets), so the wall row can skip the tall ones
  const tall = [],
    pos = new Map();
  S.cabs.forEach(c => {
    const kd = SYS[c.sys].kinds[c.kind] || {};
    if (c.sys === 'metod' && kd.row === 'wall') return;
    pos.set(c.id, [xb, plinth]);
    if (c.kind === 'high') tall.push([xb, xb + c.w * 10]);
    xb += c.w * 10;
  });
  S.cabs.forEach(c => {
    const kd = SYS[c.sys].kinds[c.kind] || {};
    if (!(c.sys === 'metod' && kd.row === 'wall')) return;
    // a wall cabinet never hangs where a tall cabinet stands: move along past it
    let moved = true;
    while (moved) {
      moved = false;
      tall.forEach(([a, b]) => {
        if (xw < b && xw + c.w * 10 > a) {
          xw = b;
          moved = true;
        }
      });
    }
    pos.set(c.id, [xw, 2200 - c.h * 10]); // wall cabinets hang with their tops in one line
    xw += c.w * 10;
  });
  S.cabs.forEach(c => {
    const [x, y] = pos.get(c.id),
      pc = { c, x, y, w: c.w * 10, h: c.h * 10 };
    cabs.push(pc);
    frontsOf(c, x, y).forEach(f => fronts.push(f));
  });
  const W = Math.max(xb, xw, 600),
    Hmax = Math.max(...cabs.map(p => p.y + p.h), 900);
  return {
    cabs,
    fronts,
    sides: sidesOf(cabs),
    W,
    H: Hmax,
    plinth,
    worktop: S.sys === 'metod' && S.cabs.some(c => c.kind === 'base')
  };
}

/* ---------- side panels: one look and one choice for the whole run ----------
   A panel covers the outer side of the first and/or last cabinet of each row (a kitchen has a base row and a
   wall row). It is a little deeper than the cabinet so it ends flush with the fronts:
     PAX 60 cm (58 frame + door), METOD base and tall 62 cm, METOD wall 39 cm, BESTÅ 42 cm; as high as the cabinet.
   A side: { id, kind: 'side', end: 'L'|'R', w: depth (mm), h (mm), x (where its 19 mm edge shows), y, cab } */
const SIDE_T = 19;
function sideDepth(c) {
  if (c.sys === 'pax') return 600;
  if (c.sys === 'besta') return 420;
  return c.kind === 'wall' ? 390 : 620;
}
function sidesOf(cabs) {
  if (S.sides === 'none' || !cabs.length) return [];
  const rows = {};
  cabs.forEach(p => {
    const r = p.c.sys === 'metod' && p.c.kind === 'wall' ? 'wall' : 'base';
    (rows[r] = rows[r] || []).push(p);
  });
  const out = [];
  Object.entries(rows).forEach(([r, ps]) => {
    const first = ps.reduce((a, b) => (b.x < a.x ? b : a)),
      last = ps.reduce((a, b) => (b.x + b.w > a.x + a.w ? b : a)),
      mk = (p, end) => ({
        id: `side:${r}:${end}`,
        kind: 'side',
        end,
        row: r,
        cab: p.c.id,
        w: sideDepth(p.c),
        h: p.h,
        nom: `${sideDepth(p.c) / 10}×${p.h / 10}`,
        x: end === 'L' ? p.x - SIDE_T : p.x + p.w,
        y: p.y
      });
    if (S.sides === 'left' || S.sides === 'both') out.push(mk(first, 'L'));
    if (S.sides === 'right' || S.sides === 'both') out.push(mk(last, 'R'));
  });
  // no panel where another cabinet stands right against that side (a wall cabinet next to a tall one),
  // and no second panel above a tall cabinet's full-height panel
  const yOver = (a, b) => Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > 1;
  return out.filter(sd => {
    const p = cabs.find(q => q.c.id === sd.cab),
      edge = sd.end === 'L' ? p.x : p.x + p.w;
    if (cabs.some(q => q !== p && yOver(q, p) && Math.abs((sd.end === 'L' ? q.x + q.w : q.x) - edge) < 1)) return false;
    return sd.row !== 'wall' || !out.some(o => o.row !== 'wall' && Math.abs(o.x - sd.x) < 1 && o.y + o.h > sd.y);
  });
}
/* sides take the look of "all fronts"; glass is for doors only, so glass sides become painted */
function sideLook() {
  const lk = lookOf(null);
  if (MATS[lk.mat].glass) return { style: 'flat', mat: 'painted', col: lk.col, oil: lk.oil, own: false };
  return lk;
}

/* ---------- the look of a front: the overall choice, unless this front has its own ---------- */
function matOk(style, mat) {
  const m = MATS[mat];
  if (!m || !STYLES[style]) return false;
  if (m.only) return m.only === style;
  /* flutes and grooves are routed into MDF only (painted or raw); wood and ply stay flat */
  return !STYLES[style].mdf || !!m.mdf;
}
function lookOf(f) {
  const o = (f && S.fx[f.id]) || {},
    lk = {
      style: o.style || S.style,
      mat: o.mat || S.mat,
      col: o.col || S.col,
      oil: o.oil || S.oil,
      own: !!S.fx[f && f.id]
    };
  if (!MATS[lk.mat]) lk.mat = 'painted';
  if (!COLOURS[lk.col]) lk.col = 'chalk';
  if (!OILS[lk.oil]) lk.oil = 'pure';
  if (!STYLES[lk.style]) lk.style = 'flat';
  if (MATS[lk.mat].only) lk.style = MATS[lk.mat].only;
  else if (!matOk(lk.style, lk.mat)) lk.style = 'flat';

}

  const m = MATS[lk.mat];

}
function lookKey(lk) {
  const m = MATS[lk.mat];
  return `${lk.style}|${lk.mat}|${m.paint ? lk.col : m.oil ? lk.oil : ''}`;
}

/* ---------- price ---------- */
function frontPrice(f) {
  const lk = lookOf(f),
    m = MATS[lk.mat],
    st = STYLES[lk.style],
    area = Math.max(PRICE.minArea, (f.w * f.h) / 1e6);
  let p = PRICE.perFront + area * m.rate * (m.glass ? 1 : st.f) + HANDLES[S.handle].price;
  if (f.kind === 'door') p += PRICE.hinge;
  return Math.round(p * 100) / 100;
}
function sidePrice(sd) {
  const lk = sideLook(),
    m = MATS[lk.mat],
    area = Math.max(PRICE.minArea, (sd.w * sd.h) / 1e6);
  return Math.round((PRICE.perFront + area * m.rate * STYLES[lk.style].f) * 100) / 100;

/* the plinth and filler strips, as order lines */
function extrasOf(L) {
  const out = [];

/* fronts with the same size, kind, hinge side and look, for the order list */
function grouped(L) {
  const m = new Map();
  L.fronts.forEach(f => {
    const lk = lookOf(f),
      k = `${f.kind}|${f.w}|${f.h}|${f.hinge || ''}|${lookKey(lk)}`;
    if (!m.has(k))
      m.set(k, { kind: f.kind, w: f.w, h: f.h, nom: f.nom, hinge: f.hinge, look: lk, n: 0, p: frontPrice(f) });
    m.get(k).n++;
  });
  (L.sides || []).forEach(sd => {
    const lk = sideLook(),
      k = `side|${sd.w}|${sd.h}||${lookKey(lk)}`;
    if (!m.has(k))
      m.set(k, { kind: 'side', w: sd.w, h: sd.h, nom: sd.nom, hinge: null, look: lk, n: 0, p: sidePrice(sd) });
    m.get(k).n++;

    (a, b) =>
      lookKey(a.look).localeCompare(lookKey(b.look)) ||
      (a.kind === 'side') - (b.kind === 'side') ||
      b.h - a.h ||
      b.w - a.w
  );
}

/* the price of another design (a demo or a preset) without touching yours */
function priceOfDesign(st) {
  const keep = S;

    S = Object.assign({}, keep, { fx: {}, flip: {}, sel: null, plinth: 'ikea', fillers: 0 }, st);
    return priceAll(layout()).total;
  } finally {
    S = keep;

}

/* ---------- a design in a link: #d=<code> (the parts that make the design, as base64url JSON) ---------- */
const SHARE_KEYS = [
  'sys',
  'cabs',
  'fx',
  'flip',
  'style',
  'mat',
  'col',
  'oil',
  'handle',
  'hfin',
  'gframe',
  'flute',
  'sides',
  'edge',
  'plinth',
  'fillers'
];
function designCode() {
  const o = {};
  SHARE_KEYS.forEach(k => (o[k] = S[k]));
  o.cabs = S.cabs.map(c => [c.kind, c.w, c.h, c.layout, c.id]);
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin = '';
  bytes.forEach(b => (bin += String.fromCharCode(b)));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function readCode(code) {
  try {
    const bin = atob(code.replace(/-/g, '+').replace(/_/g, '/')),
      o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
    if (!SYS[o.sys] || !Array.isArray(o.cabs)) return null;
    o.cabs = o.cabs.map(([kind, w, h, lay, id]) => Object.assign(cab(o.sys, kind, w, h, lay), id ? { id } : {}));
    return o;
  } catch (e) {
    return null;
  }
}
function shareLink() {
  return location.href.split('#')[0] + '#d=' + designCode();
}
// a shared design opens straight in the Fronts step
(() => {
  const m = location.hash.match(/#d=([A-Za-z0-9_-]+)/),
    o = m && readCode(m[1]);
  if (o) {
    Object.assign(S, o, { step: 'fronts', sel: null, recipe: null, demo: null });
    try {
      history.replaceState(null, '', location.href.split('#')[0]);
    } catch (e) {
      /* fine */
    }
  }
})();

/* ==== 20-draw.js ====
   The flat picture: the cabinets seen from the front with the new fronts, each in its own look (style,
   material, colour) and with its handle. Millimetres in, SVG out (y flipped so the floor is at the bottom).

function faceHex(lk) {
  const m = MATS[lk.mat];
  if (m.paint) return colHex(lk.col);
  if (m.glass) return '#cfdcd8';

}
function shade(hex, k) {
  // k < 0 darker, k > 0 lighter

    ch = s => Math.max(0, Math.min(255, Math.round(k < 0 ? s * (1 + k) : s + (255 - s) * k)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => ch(v).toString(16).padStart(2, '0')).join('');
}
function defsSVG(sfx) {

  <pattern id="flute${x}" width="${p}" height="40" patternUnits="userSpaceOnUse"${rot}><rect width="${p}" height="40" fill="url(#flg${x})"/></pattern>
 <pattern id="groove${x}" width="${S.flute.gpitch}" height="40" patternUnits="userSpaceOnUse"${rot}><rect x="${S.flute.gpitch / 2 - 2}" width="2.5" height="40" fill="#000" fill-opacity=".38"/><rect x="${S.flute.gpitch / 2 + 0.5}" width="2" height="40" fill="#fff" fill-opacity=".35"/></pattern>

    (m0.oil ? Object.keys(OILS) : ['pure']).forEach(oil =>
      tints.push([k + (oil === 'pure' ? '' : oil), Object.assign({}, m0, woodCol(k, oil))])
    );
  });
  tints.forEach(([k, m]) => {
    if (m.flame) {
      let arcs = '';
      // two flames per tile; the second is drawn again one tile higher so it runs on without a seam
      [
        [70, 0],
        [210, 260],
        [210, -260]
      ].forEach(([cx, oy]) => {
        for (let j = 0; j < 7; j++) {
          const hw = 16 + j * 12,
            top = oy + 40 + j * 28;

        }

      d += `<pattern id="gr_${k}${x}" width="280" height="520" patternUnits="userSpaceOnUse"><rect width="280" height="520" fill="${m.wood}"/>${arcs}</pattern>`;

      d += `<pattern id="gr_${k}${x}" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="${m.wood}"/><circle cx="3" cy="4" r=".9" fill="#000" fill-opacity=".08"/><circle cx="10" cy="10" r=".8" fill="#fff" fill-opacity=".12"/></pattern>`;
      return;
    }
    d += `<pattern id="gr_${k}${x}" width="90" height="900" patternUnits="userSpaceOnUse"><rect width="90" height="900" fill="${m.wood}"/>${Array.from(
      { length: 9 },
      (_, i) =>
        `<path d="M${6 + i * 10 + (i % 3)} 0 C ${12 + i * 10} 300, ${i * 10} 600, ${8 + i * 10} 900" stroke="${m.grain}" stroke-opacity="${(m.ply ? 0.1 : 0.18) + (i % 3) * 0.07}" stroke-width="${1 + (i % 2)}" fill="none"/>`

function frontSVG(f, Y, sfx) {

    m = MATS[lk.mat],
    x = f.x,
    y = Y(f.y + f.h),
    w = f.w,
    h = f.h,

    dark = shade(base, -0.38),

/* where the handle goes (mm, in the picture): doors on the side that opens, drawers in the middle at the top */

/* ==== 25-3d.js ====
   The picture: your cabinets with the new fronts, standing in a room — instantly, on any phone.
   The trick: the empty room (oak floor, plaster wall, ceiling, a tall window on the left, a rug) was ray-traced once
   ahead of time (tools/prerender.js) and ships as a picture, together with the light of that room as an HDR panorama.
   For your design only the cabinets are drawn, with quick hacks that make them sit in the photo:
     - they are lit by the room's own light (the panorama) and by the sun through the window, which also throws
       the window's shadow over the fronts,
     - the sun patch on the floor and wall is added on top of the room picture, with your cabinets' shadows in it,
     - soft contact shadows darken the floor and wall where the cabinets stand,
     - rounded or chamfered edges, real flute ribs, a plant beside the run.
   The camera never moves; the picture is cropped around your cabinets. Tap a front to select it.

const ROOM = {
  W: 1280, // the pre-rendered picture
  H: 800,
  cam: [-300, 1300, 7600], // level camera, looking straight at the wall
  fov: 36,
  wallL: -3200, // the side wall with the window
  win: [1000, 2600, 650, 2550], // window: z from, z to, y from, y to
  ceil: 2750,
  envAt: [0, 1150, 1000], // where the light panorama was taken
  sun: [-8200, 2300, 4300], // sun direction (from): low morning sun through the window, across the run

function open3D() {
  const el = document.getElementById('pic3d');
  if (V3.ready) return start3D(el);
  if (V3.loading) return;
  V3.loading = true;
  const pre = location.hash === '#prerender';
  Promise.all([
    import('three'),
    pre ? import('three-gpu-pathtracer') : null,
    import('three/examples/jsm/geometries/RoundedBoxGeometry.js').catch(() => null),
    import('three/examples/jsm/utils/BufferGeometryUtils.js').catch(() => null)
  ])
    .then(([T, PT, RB, BGU]) => {
      Object.assign(V3, { T, PT, RB: RB && RB.RoundedBoxGeometry, merge: BGU && BGU.mergeGeometries });
      if (pre) return prerenderRoom();
      return loadRoom().then(() => start3D(el));
    })
    .catch(() => {
      V3.failed = true;
      V3.loading = false;
      render();
    });
}
/* the two pictures that come with the page: the room (JPEG) and its light (RGBE in a PNG) */
function loadRoom() {
  const T = V3.T,
    img = src =>
      new Promise((ok, no) => {
        const im = new Image();
        im.onload = () => ok(im);
        im.onerror = no;
        im.src = src;
      });
  if (!ROOM_BG || !ROOM_ENV) return Promise.reject(new Error('no room pictures'));
  return Promise.all([img(ROOM_BG), img(ROOM_ENV)]).then(([bg, env]) => {
    const t = new T.Texture(bg);
    t.colorSpace = T.NoColorSpace; // drawn as it is: the picture is already finished
    t.needsUpdate = true;
    V3.bgTex = t;
    // RGBE → linear HDR panorama
    const c = document.createElement('canvas');
    c.width = env.width;
    c.height = env.height;
    const g = c.getContext('2d');
    g.drawImage(env, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data,
      f = new Float32Array(c.width * c.height * 4);
    // rows are stored top-down; a data texture starts at the bottom
    for (let y = 0; y < c.height; y++)
      for (let x = 0; x < c.width; x++) {
        const i = (y * c.width + x) * 4,
          o = ((c.height - 1 - y) * c.width + x) * 4,
          e = d[i + 3] ? Math.pow(2, d[i + 3] - 136) : 0;
        f[o] = d[i] * e;
        f[o + 1] = d[i + 1] * e;
        f[o + 2] = d[i + 2] * e;
        f[o + 3] = 1;
      }
    // half floats: every phone can filter them (full floats often can't, and the room went black)
    const hf = new Uint16Array(f.length);
    for (let i = 0; i < f.length; i++) hf[i] = T.DataUtils.toHalfFloat(Math.min(f[i], 65000));
    const et = new T.DataTexture(hf, c.width, c.height, T.RGBAFormat, T.HalfFloatType);
    et.mapping = T.EquirectangularReflectionMapping;
    et.magFilter = et.minFilter = T.LinearFilter;
    et.needsUpdate = true;
    V3.envTex = et;
  });
}

/* ---------- the live picture ---------- */
function start3D(el) {
  const T = V3.T;
  if (!T) return;
  if (!V3.ready) {
    let r;
    try {
      r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    } catch (e) {
      V3.failed = true;
      return render();
    }
    r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    r.outputColorSpace = T.SRGBColorSpace;
    r.toneMapping = T.NeutralToneMapping;
    r.toneMappingExposure = ROOM.exposure;
    r.shadowMap.enabled = true;
    r.shadowMap.type = T.PCFSoftShadowMap;
    const sc = new T.Scene(),
      pm = new T.PMREMGenerator(r);
    sc.environment = pm.fromEquirectangular(V3.envTex).texture;
    sc.environmentIntensity = 1.35; // the room's light on the cabinets, a touch brighter than the walls
    const cam = new T.PerspectiveCamera(ROOM.fov, ROOM.W / ROOM.H, 20, 60000);
    cam.position.set(...ROOM.cam);
    cam.lookAt(ROOM.cam[0], ROOM.cam[1], 0);
    // the sun through the window: lights the fronts and throws the window's shadow on them
    const sun = new T.DirectionalLight(0xfff0e0, 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0003;
    sun.shadow.normalBias = 2;
    sun.shadow.radius = 4;
    sun.position.set(...ROOM.sun);
    sun.target.position.set(0, 0, 0);
    Object.assign(sun.shadow.camera, { left: -7000, right: 7000, top: 7000, bottom: -7000, near: 100, far: 40000 });
    sun.shadow.camera.updateProjectionMatrix();
    sc.add(sun, sun.target);
    roomLive(T, sc);
    // the room picture behind everything, cropped like the camera
    const bgSc = new T.Scene(),
      bgCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1),
      bgMat = new T.ShaderMaterial({
        uniforms: { map: { value: V3.bgTex }, crop: { value: new T.Vector4(0, 0, 1, 1) } },
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader:
          'uniform sampler2D map; uniform vec4 crop; varying vec2 vUv; void main(){ gl_FragColor = texture2D(map, crop.xy + vUv * crop.zw); }',
        depthTest: false,
        depthWrite: false,
        toneMapped: false
      });
    bgSc.add(new T.Mesh(new T.PlaneGeometry(2, 2), bgMat));
    Object.assign(V3, { r, sc, cam, sun, bgSc, bgCam, bgMat, ready: true, loading: false, root: null });
    el.innerHTML = '<svg class="rover" id="rover" aria-hidden="true"></svg>';
    el.prepend(r.domElement);
    el.addEventListener('click', tap3D);
    new ResizeObserver(() => draw3D()).observe(el);
  } else if (!el.contains(V3.r.domElement)) {
    el.innerHTML = '<svg class="rover" id="rover" aria-hidden="true"></svg>';
    el.prepend(V3.r.domElement);
  }
  build3D();
}

/* the parts of the room the live picture needs: the window wall (it only throws shadow), and the floor and wall
   again, invisible except for the sun patch and the contact shadows that are blended onto the room picture */
function roomLive(T, sc) {
  const hide = new T.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  roomWindowWall(T, sc, hide, true);
  // for the sun the room is closed: a ceiling and a far front wall, so light only comes in through the window
  const lid = new T.Mesh(new T.BoxGeometry(30000, 100, 40000), hide);
  lid.position.set(10000, ROOM.ceil + 50, 19000);
  lid.castShadow = true;
  sc.add(lid);
  // the sun patch: only the sun's light on floor and wall, added onto the picture (which has no sun)
  const add = map =>
    new T.MeshLambertMaterial({
      map,
      transparent: true,
      blending: T.AdditiveBlending,
      depthWrite: false
    });
  const ft = plankTex().clone();
  ft.needsUpdate = true;
  ft.repeat.set(12000 / 1440, 9000 / 2400);
  const floor = new T.Mesh(new T.PlaneGeometry(12000, 9000), add(ft));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0.5, 4500);
  floor.receiveShadow = true;
  floor.renderOrder = 3;
  sc.add(floor);
  const wall = new T.Mesh(new T.PlaneGeometry(12000, ROOM.ceil), add(null));
  wall.position.set(0, ROOM.ceil / 2, 0.5);
  wall.receiveShadow = true;
  wall.renderOrder = 3;
  sc.add(wall);
  floor.material.color.set('#fff6ee').multiplyScalar(0.36);
  wall.material.color.set('#f2ece4').multiplyScalar(0.36);
}
/* the side wall with its window opening, as solid blocks (also used for the pre-render) */
function roomWindowWall(T, parent, mat, castOnly) {
  const [z0, z1, y0, y1] = ROOM.win,
    t = 140,
    x = ROOM.wallL - t / 2,
    zf = castOnly ? 40000 : 9000,
    add = (zA, zB, yA, yB) => {
      const m = new T.Mesh(new T.BoxGeometry(t, yB - yA, zB - zA), mat);
      m.position.set(x, (yA + yB) / 2, (zA + zB) / 2);
      m.castShadow = true;
      m.receiveShadow = !castOnly;
      parent.add(m);
    };
  add(-10, z0, 0, ROOM.ceil);
  add(z1, zf, 0, ROOM.ceil);
  add(z0, z1, 0, y0);
  add(z0, z1, y1, ROOM.ceil);
}

/* the camera is fixed; the picture is cropped around the cabinets to fill the stage */
function cropFor(L, aspect) {
  if (S.zoom) return cropClose(L, aspect);
  const T = V3.T,
    cam = V3.cam,
    side = S.sides === 'none' ? 0 : 20,
    x0 = -L.W / 2 - 350 - side,
    x1 = L.W / 2 + 900 + side, // room for the plant
    top = Math.max(L.H, 900) + 260;
  cam.clearViewOffset();
  cam.updateMatrixWorld();
  const P = (x, y, z) => {
    const v = new T.Vector3(x, y, z).project(cam);
    return [((v.x + 1) / 2) * ROOM.W, ((1 - v.y) / 2) * ROOM.H];
  };
  const pts = [P(x0, top, 0), P(x1, top, 0), P(x0, 0, 1600), P(x1, 0, 1600)];
  let l = Math.min(...pts.map(p => p[0])),
    r = Math.max(...pts.map(p => p[0])),
    t = Math.min(...pts.map(p => p[1])),
    b = Math.max(...pts.map(p => p[1]));
  let w = r - l,
    h = b - t;
  if (w / h > aspect) h = w / aspect;
  else w = h * aspect;
  w = Math.min(w, ROOM.W);
  h = Math.min(h, ROOM.H);
  if (w / h > aspect) w = h * aspect;
  else h = w / aspect;
  let cx = (l + r) / 2,
    cy = (t + b) / 2 + h * 0.04;
  // keep the ceiling line out of the top when there is floor to show instead
  const ceilY = P(0, ROOM.ceil - 60, 0)[1];
  cy = Math.max(cy, ceilY + h / 2);
  cx = Math.max(w / 2, Math.min(ROOM.W - w / 2, cx));
  cy = Math.max(h / 2, Math.min(ROOM.H - h / 2, cy));
  return [cx - w / 2, cy - h / 2, w, h];
}
/* a close-up: just the cabinet front, for the style cards */
function cropClose(L, aspect) {
  const T = V3.T,
    cam = V3.cam;
  cam.clearViewOffset();
  cam.updateMatrixWorld();
  const P = (x, y, z) => {
      const v = new T.Vector3(x, y, z).project(cam);
      return [((v.x + 1) / 2) * ROOM.W, ((1 - v.y) / 2) * ROOM.H];
    },
    z = 640,
    ys = L.fronts.map(f => f.y),
    y0 = Math.min(...ys) - 40,
    y1 = Math.max(...L.fronts.map(f => f.y + f.h)) + 40,
    pts = [P(-L.W / 2 - 40, y1, z), P(L.W / 2 + 40, y1, z), P(-L.W / 2 - 40, y0, z), P(L.W / 2 + 40, y0, z)];
  const l = Math.min(...pts.map(p => p[0])),
    r = Math.max(...pts.map(p => p[0])),
    t = Math.min(...pts.map(p => p[1])),
    b = Math.max(...pts.map(p => p[1]));
  let w = r - l,
    h = b - t;
  if (w / h > aspect) h = w / aspect;
  else w = h * aspect;
  return [(l + r) / 2 - w / 2, (t + b) / 2 - h / 2, w, h];
}
function draw3D(tw, th) {
  if (!V3.ready || !V3.L) return;
  const el = V3.r.domElement.parentElement;
  if (!tw && (!el || !el.clientWidth)) return queueThumbs(); // the stage is hidden (landing page): only cards
  const w = tw || el.clientWidth,
    h = th || el.clientHeight,
    r = V3.r;
  r.setSize(w, h, false);
  r.domElement.style.width = w + 'px';
  r.domElement.style.height = h + 'px';
  const [cx, cy, cw, ch] = cropFor(V3.L, w / h);
  V3.cam.aspect = ROOM.W / ROOM.H;
  V3.cam.setViewOffset(ROOM.W, ROOM.H, cx, cy, cw, ch);
  V3.cam.updateProjectionMatrix();
  // the room picture's texture coordinates run from the bottom
  V3.bgMat.uniforms.crop.value.set(cx / ROOM.W, 1 - (cy + ch) / ROOM.H, cw / ROOM.W, ch / ROOM.H);
  r.autoClear = true;
  r.render(V3.bgSc, V3.bgCam);
  r.autoClear = false;
  r.clearDepth();
  r.render(V3.sc, V3.cam);

/* ---------- small renders for the preset and demo cards ----------
   Made one at a time when the browser is idle: the design is built, drawn small on the same canvas, copied,
   and the main picture drawn again in the same moment (so nothing flickers). Kept for the visit and in the
   browser's storage. A card shows its drawing until its render is ready. */
const THUMB_W = 360,
  THUMB_H = 240;
V3.thumbs = new Map();

  const saved = JSON.parse(localStorage.getItem('bruis-fronts-thumbs') || '{}');
  Object.entries(saved).forEach(([k, v]) => V3.thumbs.set(k, v));

  /* no storage: render them again */
}
function thumbKey(key, st) {

    '|' +

      st.mat || S.mat,
      st.col || S.col,
      st.oil || S.oil,
      st.handle || S.handle,
      st.hfin || S.hfin,
      st.sides || 'none',
      st.edge || S.edge,
      st.plinth || 'ikea'

/* the card picture: the render if it is ready, otherwise the drawing; asks for the render */

    got = V3.thumbs.get(k);

  // big pictures (the landing page) go first
  if (!V3.failed && !V3.thumbQ.some(q => q.k === k)) V3.thumbQ[w ? 'unshift' : 'push']({ k, st, w, h });

  V3.thumbBusy = true;

  idle(() => {
    V3.thumbBusy = false;
    const job = V3.thumbQ.shift();
    if (!job || V3.thumbs.has(job.k)) return queueThumbs();
    const keep = S;
    let url = '';
    try {
      S = Object.assign(
        {},
        keep,
        { fx: {}, sel: null, flip: {}, sides: 'none', plinth: 'ikea', fillers: 0, zoom: false },
        job.st
      );
      V3.key = null;
      build3D(true);
      draw3D(job.w || THUMB_W, job.h || THUMB_H);
      url = V3.r.domElement.toDataURL('image/jpeg', 0.82);
    } catch (e) {
      url = '';
    } finally {
      S = keep;
      V3.key = null;
      build3D(true);
      draw3D();
    }
    if (url) {
      V3.thumbs.set(job.k, url);
      document.querySelectorAll('[data-tk]').forEach(el => {
        if (el.dataset.tk === job.k) el.outerHTML = `<img src="${url}" alt="" data-tk="${esc(job.k)}">`;
      });
      try {
        const o = {};
        [...V3.thumbs.entries()]
          .filter(([k]) => !k.startsWith('hero'))
          .slice(-24)
          .forEach(([k, v]) => (o[k] = v));
        localStorage.setItem('bruis-fronts-thumbs', JSON.stringify(o));
      } catch (e) {
        /* storage full: they stay for this visit */
      }
    }
    queueThumbs();
  });
}

/* ---------- textures, made once ---------- */
function canvasTex(w, h, paint, normal) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new V3.T.CanvasTexture(c);
  t.wrapS = t.wrapT = V3.T.RepeatWrapping;
  if (!normal) t.colorSpace = V3.T.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function woodTex(k, oil) {
  const tk = 'w' + k + (MATS[k].oil ? oil || 'pure' : '');
  if (V3.tex[tk]) return V3.tex[tk];
  const m = Object.assign({}, MATS[k], woodCol(k, oil));
  const t = canvasTex(256, 1024, (g, w, h) => {
    g.fillStyle = m.wood;
    g.fillRect(0, 0, w, h);
    const r = prng(k.length * 97 + 7);
    if (m.flame) {
      // pine plywood: nested flame arches with a few straight streaks between them
      for (let i = 0; i < 26; i++) {
        g.strokeStyle = m.grain;
        g.globalAlpha = 0.06 + r() * 0.06;
        g.lineWidth = 1 + r() * 2;
        const x = r() * w;
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x + (r() - 0.5) * 10, h);
        g.stroke();
      }
      [
        [w * 0.3, h * 0.05],
        [w * 0.78, h * 0.5]
      ].forEach(([cx, oy]) => {
        for (let j = 0; j < 9; j++) {
          const hw = 10 + j * 9 + r() * 4,
            top = oy + 30 + j * 30;
          g.globalAlpha = 0.22 + (j % 3) * 0.1;
          g.lineWidth = 2 + (j % 2) * 3;
          g.beginPath();
          g.moveTo(cx - hw, oy + h * 0.5);
          g.bezierCurveTo(cx - hw, top + 160, cx - hw * 0.62, top, cx, top);
          g.bezierCurveTo(cx + hw * 0.62, top, cx + hw, top + 160, cx + hw, oy + h * 0.5);
          g.stroke();
        }
      });
      g.globalAlpha = 1;
      return;
    }
    if (m.raw && !m.grain) {
      // raw MDF: fine, even speckle
      for (let i = 0; i < 5000; i++) {
        g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.06)';
        g.fillRect(r() * w, r() * h, 1.5, 1.5);
      }
      return;
    }
    for (let i = 0; i < 70; i++) {
      const x = r() * w,
        a = (m.ply ? 0.05 : 0.1) + r() * (m.ply ? 0.06 : 0.14);
      g.strokeStyle = m.grain;
      g.globalAlpha = a;
      g.lineWidth = 0.6 + r() * 2.2;
      g.beginPath();
      g.moveTo(x, 0);
      g.bezierCurveTo(x + (r() - 0.5) * 30, h * 0.33, x + (r() - 0.5) * 30, h * 0.66, x + (r() - 0.5) * 16, h);
      g.stroke();
    }
    g.globalAlpha = 1;
  });
  return (V3.tex[tk] = t);
}
/* flutes as a normal map: one rounded flute across the width of the canvas */
function fluteTex(dir) {
  const key = 'fl' + dir;
  if (V3.tex[key]) return V3.tex[key];
  const N = 64,
    t = canvasTex(
      dir === 'v' ? N : 4,
      dir === 'v' ? 4 : N,
      (g, w, h) => {
        for (let i = 0; i < N; i++) {
          const u = (i + 0.5) / N,
            s = Math.cos(u * Math.PI) * 0.85, // slope across the flute: left side faces left, right side faces right
            nx = -s,
            nz = Math.sqrt(Math.max(0, 1 - nx * nx));
          const col = `rgb(${Math.round((nx * 0.5 + 0.5) * 255)},128,${Math.round((nz * 0.5 + 0.5) * 255)})`;
          g.fillStyle =
            dir === 'v' ? col : `rgb(128,${Math.round((-nx * 0.5 + 0.5) * 255)},${Math.round((nz * 0.5 + 0.5) * 255)})`;
          if (dir === 'v') g.fillRect(i, 0, 1, h);
          else g.fillRect(0, i, w, 1);
        }
      },
      true
    );
  return (V3.tex[key] = t);
}
/* grooves as a normal map: flat, with one narrow V across the canvas */
function grooveTex(dir) {
  const key = 'gr' + dir;
  if (V3.tex[key]) return V3.tex[key];
  const N = 64,
    t = canvasTex(
      dir === 'v' ? N : 4,
      dir === 'v' ? 4 : N,
      (g, w, h) => {
        for (let i = 0; i < N; i++) {
          const u = i - N / 2,
            nx = Math.abs(u) <= 2 ? (u < 0 ? 0.7 : -0.7) : 0,
            nz = Math.sqrt(1 - nx * nx);
          g.fillStyle =
            dir === 'v'
              ? `rgb(${Math.round((nx * 0.5 + 0.5) * 255)},128,${Math.round((nz * 0.5 + 0.5) * 255)})`
              : `rgb(128,${Math.round((-nx * 0.5 + 0.5) * 255)},${Math.round((nz * 0.5 + 0.5) * 255)})`;
          if (dir === 'v') g.fillRect(i, 0, 1, h);
          else g.fillRect(0, i, w, 1);
        }
      },
      true
    );
  return (V3.tex[key] = t);
}
function matFor(lk, f, noRelief) {
  const T = V3.T,
    m = MATS[lk.mat],
    o = { roughness: 0.52, metalness: 0 };
  // matt spray paint; hardwax oil gives wood a soft satin sheen
  if (m.paint) o.color = new T.Color(colHex(lk.col));
  else if (m.glass) return null;
  else {
    const t = woodTex(lk.mat, lk.oil).clone();
    t.needsUpdate = true;
    t.repeat.set(f.w / 260, f.h / 1000);
    o.map = t;
    o.roughness = m.raw ? 0.85 : 0.5;
    if (m.oil) Object.assign(o, { clearcoat: 0.22, clearcoatRoughness: 0.45 });
  }
  if (!noRelief && (lk.style === 'fluted' || lk.style === 'grooves')) {
    const gr = lk.style === 'grooves',
      p = gr ? S.flute.gpitch : S.flute.pitch,
      n = (gr ? grooveTex : fluteTex)(S.flute.dir).clone();
    n.needsUpdate = true;
    if (S.flute.dir === 'v') n.repeat.set(f.w / p, 1);
    else n.repeat.set(1, f.h / p);
    o.normalMap = n;
    o.normalScale = new T.Vector2(gr ? 3 : 1.4, gr ? 3 : 1.4);
  }
  return new T.MeshPhysicalMaterial(o);

/* the ribs of a fluted front, as one mesh centred on the front: half-rounds side by side at the chosen pitch,
   7.5 mm proud of the slab, stopping 12 mm short of the edges like a routed panel */
const FLUTE_D = 7.5;
function fluteMesh(f, mat, FT) {
  const T = V3.T,
    v = S.flute.dir === 'v',
    span = v ? f.w : f.h,
    len = (v ? f.h : f.w) - 24,
    n = Math.max(2, Math.round((span - 8) / S.flute.pitch)),
    pw = (span - 8) / n,
    parts = [];
  for (let i = 0; i < n; i++) {
    const g = new T.CylinderGeometry(pw / 2, pw / 2, len, 12, 1, true, -Math.PI / 2, Math.PI);
    g.scale(1, 1, FLUTE_D / (pw / 2)); // as deep as a routed flute
    if (!v) g.rotateZ(Math.PI / 2);
    const o = -span / 2 + 4 + pw / 2 + i * pw;
    g.translate(v ? o : 0, v ? 0 : o, FT / 2 - FLUTE_D);
    parts.push(g);
  }
  const ms = new T.Mesh(V3.merge(parts), mat);
  ms.castShadow = ms.receiveShadow = true;
  return ms;

/* ---------- the cabinets ---------- */
const DEPTH = { pax: 580, metod: { base: 600, high: 600, wall: 370 }, besta: 420 };
/* what the picture shows; the cabinets are only rebuilt when this changes */
function sceneKey() {
  return JSON.stringify([
    S.sys,
    S.cabs,
    S.fx,
    S.flip,
    S.style,
    S.mat,
    S.col,
    S.oil,
    S.handle,
    S.hfin,
    S.gframe,
    S.flute,
    S.sides,
    S.edge,
    S.plinth

}
function build3D(noDraw) {
  if (!V3.ready) return;
  const key = sceneKey();
  if (key === V3.key && V3.L) return noDraw ? null : draw3D();
  V3.key = key;
  const T = V3.T,
    L = layout();
  if (V3.root) {
    V3.sc.remove(V3.root);
    V3.root.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && o.material.dispose && !o.material.keep) o.material.dispose();
    });
  }

    const ms = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    ms.position.set(x, y, z);

  const rbox = (w, h, d, mat, x, y, z) => {
