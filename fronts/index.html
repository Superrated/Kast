<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRUIS Fronts — custom fronts for IKEA PAX, METOD and BESTÅ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f3f3f0;
  --surface: #fafaf8;
  --raised: #ffffff;
  --ink: #17191b;
  --ink2: #62676b;
  --ink3: #6a6f74;
  --line: #e4e5e1;
  --accent: #3446d6;
  --accent-ink: #ffffff;
  --accent-soft: rgba(52, 70, 214, 0.09);
  --warn: #b4541a;
  --warn-soft: rgba(180, 84, 26, 0.1);
  --wall: #e7e7e3;
  --hatch: #d3d5d1;
  --stage: #ecedea;
  --paper: #ffffff;
  --shade: rgba(20, 22, 24, 0.2);
  --f-d: 'Instrument Serif', Georgia, serif;
  --f-b: 'Instrument Sans', system-ui, -apple-system, sans-serif;
  --f-m: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #121314;
    --surface: #18191b;
    --raised: #202224;
    --ink: #ecedeb;
    --ink2: #a2a7ab;
    --ink3: #90969b;
    --line: #2c2f32;
    --accent: #8f9bff;
    --accent-ink: #0e1030;
    --accent-soft: rgba(143, 155, 255, 0.14);
    --warn: #f0a060;
    --warn-soft: rgba(240, 160, 96, 0.14);
    --wall: #232528;
    --hatch: #34373b;
    --stage: #16171a;
    --paper: #1c1e20;
    --shade: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #121314;
  --surface: #18191b;
  --raised: #202224;
  --ink: #ecedeb;
  --ink2: #a2a7ab;
  --ink3: #90969b;
  --line: #2c2f32;
  --accent: #8f9bff;
  --accent-ink: #0e1030;
  --accent-soft: rgba(143, 155, 255, 0.14);
  --warn: #f0a060;
  --warn-soft: rgba(240, 160, 96, 0.14);
  --wall: #232528;
  --hatch: #34373b;
  --stage: #16171a;
  --paper: #1c1e20;
  --shade: rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
/* ==== fronts.css ====
   BRUIS Fronts. Colours and fonts come from Fitted (its :root tokens are put in front of this file by build.py).
   Computer: picture left, panel right, price bar at the bottom.
   Phone: picture on top, panel below, steps and price bar at the bottom. */
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-b);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
h2 {
  font-family: var(--f-d);
  font-weight: 400;
  font-size: 30px;
  margin: 4px 0 6px;
}
h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink2);
  margin: 22px 0 8px;
}
.lede {
  color: var(--ink2);
  margin: 0 0 14px;
  line-height: 1.45;
}
.hint {
  color: var(--ink2);
  font-size: 13.5px;
  line-height: 1.45;
}
small {
  color: var(--ink2);
}
.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  height: 100dvh;
}
header.top {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand {
  font-family: var(--f-d);
  font-size: 24px;
  white-space: nowrap;
}
.brand b {
  font-family: var(--f-b);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  margin-right: 4px;
}
.brand small {
  display: block;
  font-family: var(--f-b);
  font-size: 11.5px;
  margin-top: -2px;
}
.steps,
.bsteps {
  display: flex;
  gap: 4px;
}
.steps {
  margin-left: auto;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
}
.steps button,
.bsteps button {
  border: 0;
  background: none;
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 600;
  color: var(--ink2);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.steps button i,
.bsteps button i {
  font-style: normal;
  font-size: 11px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: inline-grid;
  place-items: center;
}
.steps button.done i,
.bsteps button.done i {
  background: var(--ink2);
  border-color: var(--ink2);
  color: var(--bg);
}
.steps button.on,
.bsteps button.on {
  background: var(--ink);
  color: var(--bg);
}
.bsteps {
  display: none;
}
.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
  min-height: 0;
}
.stage {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--stage);
  padding: 14px 18px;
}
.stagebar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 13px;
}
.sw {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, 0.15);
  flex: none;
}
.pic {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px 0;
}
.pic svg {
  width: 100%;
  height: 100%;
  max-height: 100%;
}
.pic .dim {
  font: 500 44px var(--f-m);
  fill: var(--ink2);
}
.pic .front.hd {
  cursor: pointer;
}
.pic .front.hd:hover > rect:first-child {
  stroke: var(--accent);
  stroke-opacity: 1;
  stroke-width: 8;
}
.pichint {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: var(--ink2);
  min-height: 18px;
}
.panel {
  overflow: auto;
  padding: 18px 20px 30px;
  background: var(--surface);
  border-left: 1px solid var(--line);
}
.syss,
.stcs,
.mats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mats {
  grid-template-columns: repeat(2, 1fr);
}
.sys,
.stc,
.mat {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--raised);
  border-radius: 14px;
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sys span {
  font-size: 13px;
}
.sys small,
.stc small,
.mat small {
  font-size: 11.5px;
  line-height: 1.3;
}
.sys.on,
.stc.on,
.mat.on {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.stc svg {
  width: 100%;
  height: 92px;
  margin-bottom: 4px;
}
.mat {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  column-gap: 7px;
}
.mat small {
  flex-basis: 100%;
}
.cabs {
  display: grid;
  gap: 10px;
  margin: 14px 0 10px;
}
.cab {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.cabh {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.cabh b {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  display: inline-grid;
  place-items: center;
  font-size: 12px;
}
.sp {
  flex: 1;
}
.ib {
  border: 1px solid var(--line);
  background: none;
  border-radius: 8px;
  width: 30px;
  height: 28px;
  font-size: 12px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0;
}
.row > label {
  width: 58px;
  font-size: 13px;
  color: var(--ink2);
  flex: none;
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
}
.seg button {
  border: 0;
  background: none;
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 13.5px;
  font-weight: 500;
}
.seg button.on {
  background: var(--ink);
  color: var(--bg);
}
.seg button.on small {
  color: inherit;
  opacity: 0.75;
}
.adds {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}
.btn {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: 999px;
  padding: 9px 16px;
  font-weight: 600;
}
.btn.pri {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.ghost {
  background: none;
}
.btn.big {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 14px;
}
.linkb {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
}
.imp {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.imp summary {
  font-weight: 600;
  cursor: pointer;
}
textarea,
input,
select {
  width: 100%;
  font: inherit;
  font-size: 14px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--raised);
  color: var(--ink);
}
textarea {
  font-family: var(--f-m);
  font-size: 12.5px;
}
.field {
  display: block;
  margin: 10px 0;
}
.field > span {
  display: block;
  font-size: 13px;
  color: var(--ink2);
  margin-bottom: 4px;
}
.sws {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.swb {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--raised);
  box-shadow: 0 0 0 1px var(--line);
}
.swb.on {
  box-shadow: 0 0 0 2.5px var(--accent);
}
.ord {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.ord th,
.ord td {
  padding: 7px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
.ord th {
  font-size: 12px;
  color: var(--ink2);
  font-weight: 600;
}
.ord .num {
  text-align: right;
  font-family: var(--f-m);
  font-size: 13px;
  white-space: nowrap;
}
.ord td small {
  display: block;
  font-family: var(--f-b);
  font-size: 11.5px;
}
.ord tfoot td {
  border-bottom: 0;
}
.ord .tot td {
  font-weight: 700;
  font-size: 15px;
  border-top: 2px solid var(--ink);
}
.pbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.ptot {
  margin-right: auto;
  display: flex;
  flex-direction: column;
}
.ptot span {
  font-size: 12px;
  color: var(--ink2);
}
.ptot b {
  font-size: 22px;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 14, 0.45);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
}
.modal[hidden] {
  display: none;
}
.mbox {
  background: var(--surface);
  border-radius: 18px;
  padding: 20px 22px;
  width: min(460px, 100%);
  max-height: 90vh;
  overflow: auto;
}
.otext {
  white-space: pre-wrap;
  font: 12.5px/1.5 var(--f-m);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
}
.legal {
  font-size: 11px;
  color: var(--ink2);
  text-align: center;
  margin: 0;
  padding: 6px 16px 10px;
}

/* ---------- phone ---------- */
@media (max-width: 860px) {
  .app {
    height: auto;
    display: block;
    padding-bottom: 136px;
  }
  header.top {
    padding: 10px 14px;
  }
  .steps {
    display: none;
  }
  .main {
    display: block;
  }
  .stage {
    position: sticky;
    top: 0;
    z-index: 5;
    height: 38vh;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .stagebar {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chip {
    white-space: nowrap;
  }
  .panel {
    border-left: 0;
    padding: 14px 14px 30px;
  }
  .syss,
  .stcs {
    grid-template-columns: repeat(3, 1fr);
  }
  .stc svg {
    height: 70px;
  }
  .mats {
    grid-template-columns: 1fr 1fr;
  }
  .pbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(62px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    padding: 8px 14px;
  }
  .pbar .ghost {
    display: none;
  }
  .bsteps {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around;
  }
  .bsteps button {
    flex-direction: column;
    gap: 3px;
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 12px;
  }
  .legal {
    padding-bottom: 150px;
  }
}

/* ---------- round 2: 3D, a look per front, surprise, quick setup ---------- */
.pic[hidden] {
  display: none;
}
.pic3d {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  padding: 0;
  margin: 10px 0 6px;
}
.pic3d canvas {
  display: block;
  cursor: grab;
}
.pic3d .c3 {
  margin: auto;
  text-align: center;
}
.stagebar {
  align-items: center;
}
.stagebar .seg button {
  padding: 4px 12px;
}
.btn.sm {
  padding: 6px 12px;
  font-size: 13px;
}
.btn.surp {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}
.chip.rec {
  border-color: var(--accent);
  color: var(--accent);
}
.pic .front {
  cursor: pointer;
}
.pic .front:hover > rect:first-child {
  stroke: var(--accent);
  stroke-opacity: 1;
  stroke-width: 8;
}
.stcs.two {
  grid-template-columns: repeat(2, 1fr);
}
.stcs.two .stc svg {
  height: 110px;
}
.mat .tag {
  font-style: normal;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--warn-soft);
  color: var(--warn);
  border-radius: 5px;
  padding: 1px 5px;
}
.sw.gl {
  background-image: repeating-linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.6) 0 2px,
    rgba(0, 0, 0, 0.12) 2px 4px
  ) !important;
}
.sws {
  gap: 10px;
}
.swb {
  width: 54px;
  height: 54px;
  border-radius: 12px;
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.swb span {
  position: absolute;
  top: calc(100% + 3px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 10.5px;
  color: var(--ink2);
  white-space: nowrap;
}
.sws {
  padding-bottom: 18px;
}
.selcard {
  border: 2px solid var(--accent);
  border-radius: 14px;
  padding: 10px 12px;
  margin: 12px 0;
  background: var(--accent-soft);
}
.selcard .seg {
  margin: 6px 0;
}
h3.big {
  font-size: 13px;
  color: var(--ink);
  margin-top: 26px;
}
.qks {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.qk {
  text-align: left;
  border: 1.5px solid var(--line);
  background: var(--raised);
  border-radius: 12px;
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.qk:hover {
  border-color: var(--accent);
}
.qk small {
  font-size: 11.5px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.syss .sys {
  align-items: flex-start;
}
.ord .lkh td {
  padding-top: 14px;
  font-weight: 600;
  border-bottom: 0;
}
.ord .lkh .sw {
  vertical-align: -2px;
  margin-right: 6px;
}
@media (max-width: 860px) {
  .stagebar .chip.rec {
    display: none;
  }
  .stagebar {
    gap: 5px;
  }
  .stcs.two .stc svg {
    height: 80px;
  }
  .swb {
    width: 46px;
    height: 46px;
  }
}

.stagebar .seg {
  flex-wrap: nowrap;
  flex: none;
}
.btn.surp {
  white-space: nowrap;
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>BRUIS</b> Fronts<small>custom fronts for your IKEA cabinets · prototype</small></div>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
  </header>
  <main class="main">
    <section class="stage" aria-label="Your cabinets with the new fronts">
      <div class="stagebar" id="stagebar"></div>
      <div class="pic" id="pic"></div>
      <div class="pic pic3d" id="pic3d" hidden></div>
      <p class="pichint" id="pichint"></p>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
  <footer class="pbar" id="pbar"></footer>
  <nav class="bsteps" id="bsteps" aria-label="Steps"></nav>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<p class="legal">IKEA, PAX, METOD and BESTÅ are trademarks of Inter IKEA Systems B.V. BRUIS is not part of or endorsed by IKEA. Prototype — prices and delivery times are examples.</p>
<script>
/* ==== 00-data.js ====
   Everything the configurator knows: the IKEA systems and their sizes, front styles, materials, colours,
   handles and prices. Sizes from IKEA's own product pages (checked Nov 2026):
     PAX    frames 50 / 75 / 100 wide, 201 / 236 high; hinged doors 50 or 25 wide (a 75 frame takes 50 + 25),
            door 49.5 × 229.4 cm on a 236 frame (195 cm on a 201 frame)
     METOD  fronts are 3 mm smaller than the cabinet both ways (39.7 × 79.7 for a 40 × 80 cabinet)
     BESTÅ  fronts 59.6 wide; 63.7 / 37.7 / 25.7 high for the 64 / 38 / 26 positions
   The range is curated: Flat or Fluted; painted in a few bold colours, oak, walnut, birch ply, fluted glass,
   and two budget boards (raw MDF, untreated birch ply). Prices are examples for the prototype.
*/
const SYS = {
  pax: {
    name: 'PAX',
    what: 'Wardrobe',
    blurb: 'Wardrobe frames 50, 75 or 100 cm wide, 201 or 236 cm high',
    kinds: { frame: { label: 'Frame', widths: [50, 75, 100], heights: [201, 236] } }
  },
  metod: {
    name: 'METOD',
    what: 'Kitchen',
    blurb: 'Base, wall and tall cabinets, 20 to 80 cm wide',
    kinds: {
      base: { label: 'Base cabinet', widths: [20, 30, 40, 60, 80], heights: [80], row: 'base' },
      high: { label: 'Tall cabinet', widths: [40, 60], heights: [140, 200], row: 'base' },
      wall: { label: 'Wall cabinet', widths: [20, 30, 40, 60, 80], heights: [40, 60, 80, 100], row: 'wall' }
    }
  },
  besta: {
    name: 'BESTÅ',
    what: 'Storage & TV',
    blurb: 'Frames 60 or 120 cm wide, 38 to 192 cm high',
    kinds: { frame: { label: 'Frame', widths: [60, 120], heights: [38, 64, 128, 192] } }
  }
};

/* how a cabinet is filled with fronts: [key, label, test(cab) → offered?] */
const LAYOUTS = {
  pax: [
    ['doors', 'Doors', () => true],
    ['open', 'No doors', () => true]
  ],

/* ---------- cabinet → fronts ----------
   A front: { id, cab, kind: 'door'|'drawer', nom: 'w×h' (IKEA's name for the size), w, h (real, mm),
              x, y (bottom-left in the picture, mm from the left / floor), hinge: 'L'|'R'|null } */
const PAX_H = { 236: 2294, 201: 1950 },
  PAX_W = { 50: 495, 25: 245 };
function frontsOf(c, x0, y0) {
  const out = [],
    add = (kind, nw, nh, realW, realH, x, y, hinge) =>
      out.push({
        id: c.id + ':' + out.length,
        cab: c.id,
        ckind: c.kind,
        sys: c.sys,
        kind,
        nom: `${nw}×${nh}`,
        w: realW,
        h: realH,
        x,
        y,
        hinge
      });
  const W = c.w * 10,
    H = c.h * 10;
  if (c.layout === 'open') return out;
  if (c.sys === 'pax') {
    const parts = c.w === 100 ? [50, 50] : c.w === 75 ? [50, 25] : [50];
    const dh = PAX_H[c.h];
    let x = x0 + 2.5;
    parts.forEach((pw, i) => {
      add(
        'door',
        pw,
        c.h === 236 ? 229 : 195,
        PAX_W[pw],
        dh,
        x,
        y0 + (H - dh) / 2,
        parts.length === 1 ? 'R' : i === 0 ? 'L' : 'R'
      );
      x += pw * 10;
    });
  } else if (c.sys === 'metod') {
    const g = 3; // METOD fronts are 3 mm smaller than the cabinet
    if (c.kind === 'base') {
      const stack = {
        door: null,
        doors2: null,
        drawer_door: [20, 60],
        drawers3: [20, 20, 40],
        drawers2: [40, 40],
        drawers4: [20, 20, 20, 20]
      }[c.layout];
      if (!stack) {
        const n = c.layout === 'doors2' ? 2 : 1;
        for (let i = 0; i < n; i++)
          add(
            'door',
            c.w / n,
            c.h,
            W / n - g,
            H - g,
            x0 + (i * W) / n + g / 2,
            y0 + g / 2,
            n === 1 ? 'R' : i === 0 ? 'L' : 'R'
          );
      } else {
        let y = y0 + H;
        stack.forEach((sh, i) => {
          y -= sh * 10;
          const isDoor = c.layout === 'drawer_door' && i === 1;
          add(isDoor ? 'door' : 'drawer', c.w, sh, W - g, sh * 10 - g, x0 + g / 2, y + g / 2, isDoor ? 'R' : null);
        });
      }
    } else if (c.kind === 'wall') {
      const n = c.layout === 'doors2' ? 2 : 1;
      for (let i = 0; i < n; i++)
        add(
          'door',
          c.w / n,
          c.h,
          W / n - g,
          H - g,
          x0 + (i * W) / n + g / 2,
          y0 + g / 2,
          n === 1 ? 'R' : i === 0 ? 'L' : 'R'
        );
    } else {
      const stack = c.layout === 'split' ? [140, 60] : [c.h]; // bottom door first
      let y = y0;
      stack.forEach(sh => {
        add('door', c.w, sh, W - g, sh * 10 - g, x0 + g / 2, y + g / 2, 'R');
        y += sh * 10;
      });
    }
  } else if (c.sys === 'besta') {
    const cols = c.w / 60,
      realH = { 64: 637, 38: 377, 26: 257 };
    for (let k = 0; k < cols; k++) {
      const xs = x0 + k * 600 + 2;
      let stack;
      if (c.layout === 'drawers') stack = c.h === 64 ? [26, 38] : [c.h];
      else stack = c.h === 38 ? [38] : Array.from({ length: c.h / 64 }, () => 64);
      let y = y0 + H;
      stack.forEach(sh => {
        y -= sh * 10;
        const isDrawer = c.layout === 'drawers';
        add(
          isDrawer ? 'drawer' : 'door',
          60,
          sh,
          596,
          realH[sh],
          xs,
          y + (sh * 10 - realH[sh]) / 2,
          isDrawer ? null : cols > 1 && k === 0 ? 'L' : 'R'
        );
      });
    }
  }
  out.forEach(f => {
    if (f.hinge && S.flip[f.id]) f.hinge = f.hinge === 'L' ? 'R' : 'L';
  });
  return out;
}

/* ---------- the whole layout: cabinets placed side by side, kitchen wall cabinets above ---------- */
function layout() {
  const cabs = [],
    fronts = [];
  const plinth = S.sys === 'metod' ? 100 : S.sys === 'besta' ? 120 : 0;
  let xb = 0,
    xw = 0;
  S.cabs.forEach(c => {
    const kd = SYS[c.sys].kinds[c.kind] || {};
    let x, y;
    if (c.sys === 'metod' && kd.row === 'wall') {
      x = xw;
      xw += c.w * 10;
      y = 2200 - c.h * 10; // wall cabinets hang with their tops in one line
    } else {
      x = xb;
      xb += c.w * 10;
      y = plinth;
    }
    const pc = { c, x, y, w: c.w * 10, h: c.h * 10 };
    cabs.push(pc);
    frontsOf(c, x, y).forEach(f => fronts.push(f));
  });
  const W = Math.max(xb, xw, 600),
    Hmax = Math.max(...cabs.map(p => p.y + p.h), 900);
  return { cabs, fronts, W, H: Hmax, plinth, worktop: S.sys === 'metod' && S.cabs.some(c => c.kind === 'base') };
}

/* ---------- the look of a front: the overall choice, unless this front has its own ---------- */
function matOk(style, mat) {
  const m = MATS[mat];
  return !!m && (!m.only || m.only === style);
}
function lookOf(f) {
  const o = (f && S.fx[f.id]) || {},
    lk = { style: o.style || S.style, mat: o.mat || S.mat, col: o.col || S.col, own: !!S.fx[f && f.id] };
  if (!MATS[lk.mat]) lk.mat = 'painted';
  if (!COLOURS[lk.col]) lk.col = 'chalk';
  if (MATS[lk.mat].only) lk.style = MATS[lk.mat].only;
  return lk;
}
function lookName(lk) {
  const m = MATS[lk.mat];
  return `${STYLES[lk.style].name} ${m.paint ? COLOURS[lk.col].name.toLowerCase() : m.name.toLowerCase()}`;
}
function lookKey(lk) {
  return `${lk.style}|${lk.mat}|${MATS[lk.mat].paint ? lk.col : ''}`;
}

/* ---------- price ---------- */
function frontPrice(f) {
  const lk = lookOf(f),
    m = MATS[lk.mat],
    st = STYLES[lk.style],
    area = Math.max(PRICE.minArea, (f.w * f.h) / 1e6);
  let p = PRICE.perFront + area * m.rate * (m.glass ? 1 : st.f) + HANDLES[S.handle].price;
  if (f.kind === 'door') p += PRICE.hinge;
  return Math.round(p * 100) / 100;
}
function priceAll(L) {
  const fr = L.fronts.map(f => ({ f, p: frontPrice(f) })),
    sub = fr.reduce((a, b) => a + b.p, 0),
    del = sub >= PRICE.deliveryFree || !fr.length ? 0 : PRICE.delivery;
  return { fr, sub, del, total: sub + del, n: fr.length };
}
const eur = v => '€ ' + Math.round(v).toLocaleString('en-IE');

/* fronts with the same size, kind, hinge side and look, for the order list */
function grouped(L) {
  const m = new Map();
  L.fronts.forEach(f => {
    const lk = lookOf(f),
      k = `${f.kind}|${f.w}|${f.h}|${f.hinge || ''}|${lookKey(lk)}`;
    if (!m.has(k))
      m.set(k, { kind: f.kind, w: f.w, h: f.h, nom: f.nom, hinge: f.hinge, look: lk, n: 0, p: frontPrice(f) });
    m.get(k).n++;
  });
  return [...m.values()].sort((a, b) => lookKey(a.look).localeCompare(lookKey(b.look)) || b.h - a.h || b.w - a.w);
}

/* the scalloped top edge: about 110 mm per scallop, never fewer than 3, depth a quarter of the width, at most 28 mm */
function scallops(w) {
  const n = Math.max(3, Math.round(w / 110)),
    sw = w / n;
  return { n, sw, d: Math.min(28, sw * 0.25) };
}

/* ==== 20-draw.js ====
   The flat picture: the cabinets seen from the front with the new fronts, each in its own look (style,
   material, colour) and with its handle. Millimetres in, SVG out (y flipped so the floor is at the bottom).
   Tap a front to select it. 25-3d.js draws the same fronts in 3D.
*/
function faceHex(lk) {
  const m = MATS[lk.mat];
  if (m.paint) return colHex(lk.col);
  if (m.glass) return '#cfdcd8';
  return m.wood;
}
function shade(hex, k) {

/* ==== 25-3d.js ====
   The 3D view: the white IKEA boxes with the new fronts on them, in their real materials — matt paint, oak and
   walnut grain, birch ply, raw MDF, flutes as a light-catching relief, fluted glass in its frame — and the handles.

  if (V3.loading) return;
  V3.loading = true;
  el.innerHTML = '<p class="hint c3">Loading 3D…</p>';
  const sc = document.createElement('script');
  sc.src = THREE_URL;
  sc.onload = () => start3D(el);

function canvasTex(w, h, paint, normal) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;

    g.fillStyle = m.wood;
    g.fillRect(0, 0, w, h);
    const r = prng(k.length * 97 + 7);
    if (m.raw && !m.grain) {
      // raw MDF: fine, even speckle

        g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.06)';
        g.fillRect(r() * w, r() * h, 1.5, 1.5);

        (a + b) / 2,
        (L.plinth - 10) / 2,
        -40
      );
      const tops = L.cabs.filter(p => p.c.kind === 'base');
      if (tops.length) {
        const a2 = Math.min(...tops.map(p => p.x)),
          b2 = Math.max(...tops.map(p => p.x + p.w));
        box(
          b2 - a2 + 20,
          40,
          640,
          new T.MeshStandardMaterial({ color: '#cfc8bb', roughness: 0.45 }),
          (a2 + b2) / 2,
          920,
          -600 + 320 + 20
        );
      }
    }
  }
  if (S.sys === 'besta') {
    const leg = new T.MeshStandardMaterial({ color: '#8f8f8a', roughness: 0.4, metalness: 0.6 });
    L.cabs.forEach(p => {
      [p.x + 52, p.x + p.w - 52].forEach(x => {
        const c = new T.Mesh(new T.CylinderGeometry(12, 12, L.plinth, 16), leg);
        c.position.set(x, L.plinth / 2, -60);
        root.add(c);
      });
    });
  }
  // the fronts
  const FT = 19,
    hcache = {};
  L.fronts.forEach(f => {
    const lk = lookOf(f),
      m = MATS[lk.mat],
      cx = f.x + f.w / 2,
      cy = f.y + f.h / 2,
      cz = FT / 2 + 1;
    let hit;
    if (m.glass) {
      const fr = 22,
        fm = new T.MeshStandardMaterial({
          color: GFRAME[S.gframe].hex,
          roughness: S.gframe === 'oak' ? 0.5 : 0.35,
          metalness: S.gframe === 'oak' ? 0 : 0.6
        });
      box(f.w, fr, FT, fm, cx, f.y + f.h - fr / 2, cz);
      box(f.w, fr, FT, fm, cx, f.y + fr / 2, cz);
      box(fr, f.h - 2 * fr, FT, fm, f.x + fr / 2, cy, cz);
      box(fr, f.h - 2 * fr, FT, fm, f.x + f.w - fr / 2, cy, cz);
      const n = fluteTex(S.flute.dir).clone();
      n.needsUpdate = true;
      if (S.flute.dir === 'v') n.repeat.set((f.w - 2 * fr) / S.flute.pitch, 1);
      else n.repeat.set(1, (f.h - 2 * fr) / S.flute.pitch);
      const gm = new T.MeshStandardMaterial({
        color: '#dfe9e5',
        roughness: 0.18,
        metalness: 0.1,
        transparent: true,
        opacity: 0.55,
        normalMap: n,
        normalScale: new T.Vector2(2, 2)
      });
      hit = box(f.w - 2 * fr, f.h - 2 * fr, 6, gm, cx, cy, cz, false);
    } else if (lk.style === 'scallop') {
      const sc = scallops(f.w),
        sh = new T.Shape(),
        hw = f.w / 2,
        hh = f.h / 2;
      sh.moveTo(-hw, -hh);
      sh.lineTo(hw, -hh);
      sh.lineTo(hw, hh - sc.d);
      for (let i = sc.n - 1; i >= 0; i--)
        sh.quadraticCurveTo(-hw + (i + 0.5) * sc.sw, hh + sc.d, -hw + i * sc.sw, hh - sc.d);
      sh.lineTo(-hw, -hh);
      const geo = new T.ExtrudeGeometry(sh, { depth: FT, bevelEnabled: false, curveSegments: 10 });
      geo.translate(0, 0, -FT / 2);
      hit = new T.Mesh(geo, matFor(lk, f));
      hit.position.set(cx, cy, cz);
      hit.castShadow = hit.receiveShadow = true;
      root.add(hit);
    } else hit = box(f.w, f.h, FT, matFor(lk, f), cx, cy, cz);
    hit.userData.fid = f.id;
    V3.meshes.push(hit);
    if (S.sel === f.id) {
      // the selected front: a crisp blue outline just in front of it
      const sel = new T.LineSegments(
        new T.EdgesGeometry(new T.BoxGeometry(f.w + 6, f.h + 6, FT + 4)),
        new T.LineBasicMaterial({ color: '#3446d6' })
      );
      sel.position.set(cx, cy, cz);
      root.add(sel);
      [-1, 1].forEach(sx =>
        [-1, 1].forEach(sy => {
          const k = new T.Mesh(new T.BoxGeometry(sx ? 10 : 10, 10, 4), new T.MeshBasicMaterial({ color: '#3446d6' }));
          k.position.set(cx + sx * (f.w / 2 + 3), cy + sy * (f.h / 2 + 3), FT + 4);
          root.add(k);
        })
      );
    }
    handle3D(f, lk, root, hcache, FT);
  });
  V3.sc.add(root);
  // the sun's shadow covers the whole row
  const sh = V3.sun.shadow.camera,
    R = Math.max(W, L.H) * 0.8 + 800;
  Object.assign(sh, { left: -R, right: R, top: R, bottom: -R, near: 100, far: 20000 });
  sh.updateProjectionMatrix();
  V3.sun.target.position.set(W / 2, L.H / 2, 0);
  V3.sun.position.set(W / 2 - 2600, 4200, 3600);
  V3.L = L;
  draw3D();
}
function handle3D(f, lk, root, cache, FT) {
  if (S.handle === 'push') return;
  const T = V3.T,
    P = handlePos(f),
    hex = handleHex(lk),
    mk =
      cache[hex] ||
      (cache[hex] = new T.MeshStandardMaterial({
        color: hex,
        roughness: S.hfin === 'oak' || S.hfin === 'match' ? 0.55 : 0.3,
        metalness: S.hfin === 'brass' || S.hfin === 'steel' ? 0.85 : 0.1
      })),
    z = FT + 1;
  const add = (geo, x, y, zz, rx, rz) => {
    const ms = new T.Mesh(geo, mk);
    ms.position.set(x, y, zz);
    if (rx) ms.rotation.x = rx;
    if (rz) ms.rotation.z = rz;
    ms.castShadow = true;
    root.add(ms);
  };
  if (S.handle === 'knob') {
    add(new T.CylinderGeometry(6, 6, 18, 16), P.x, P.y, z + 9, Math.PI / 2);
    add(new T.SphereGeometry(16, 24, 16), P.x, P.y, z + 26);
  } else if (S.handle === 'bar') {
    add(new T.CylinderGeometry(6, 6, 160, 16), P.x, P.y, z + 28, 0, P.vert ? 0 : Math.PI / 2);
    [-64, 64].forEach(d =>
      add(new T.CylinderGeometry(4, 4, 28, 12), P.vert ? P.x : P.x + d, P.vert ? P.y + d : P.y, z + 14, Math.PI / 2)
    );
  } else if (S.handle === 'tab') {
    const x = f.kind === 'drawer' ? P.x : f.hinge === 'L' ? f.x + f.w + 4 : f.x - 4,
      y = f.kind === 'drawer' ? f.y + f.h + 4 : P.y;
    add(new T.BoxGeometry(f.kind === 'drawer' ? 44 : 22, f.kind === 'drawer' ? 22 : 44, 4), x, y, z + 2);
  } else if (S.handle === 'grip') {
    const dark = new T.MeshStandardMaterial({ color: '#1b1b1b', roughness: 0.9 }),
      g = new T.Mesh(new T.BoxGeometry(f.kind === 'drawer' ? 90 : 14, f.kind === 'drawer' ? 14 : 110, 3), dark);
    g.position.set(
      f.kind === 'drawer' ? P.x : f.hinge === 'L' ? f.x + f.w - 7 : f.x + 7,
      f.kind === 'drawer' ? f.y + f.h - 7 : P.y,
      z + 0.5
    );
    root.add(g);
  }
}

/* ---------- camera, turning and tapping ---------- */
function draw3D() {
  if (!V3.ready || !V3.L) return;
  const el = V3.r.domElement.parentElement;
  if (!el || !el.clientWidth) return;
  const w = el.clientWidth,
    h = el.clientHeight;
  V3.r.setSize(w, h, false);
  V3.r.domElement.style.width = w + 'px';
  V3.r.domElement.style.height = h + 'px';
  const L = V3.L,
    cam = V3.cam,
    tgt = new V3.T.Vector3(L.W / 2, Math.max(L.H, 900) / 2, 0);
  cam.aspect = w / h;
  const span = Math.max(L.W / cam.aspect, Math.max(L.H, 900)) * 1.25,
    dist = (span / 2 / Math.tan((cam.fov * Math.PI) / 360)) * V3.zoom;
  cam.position.set(
    tgt.x + Math.sin(V3.yaw) * Math.cos(V3.pitch) * dist,
    tgt.y + Math.sin(V3.pitch) * dist,
    Math.cos(V3.yaw) * Math.cos(V3.pitch) * dist
  );
  cam.lookAt(tgt);
  cam.updateProjectionMatrix();
  V3.r.render(V3.sc, cam);
}
function controls3D(cv) {
  const pts = new Map();
  let moved = 0,
    pinch = 0;
  cv.style.touchAction = 'none';
  cv.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cv.setPointerCapture(e.pointerId);
    moved = 0;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  cv.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x,
      dy = e.clientY - p.y;
    p.x = e.clientX;
    p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()],
        d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) V3.zoom = Math.max(0.35, Math.min(2.2, V3.zoom * (pinch / d)));
      pinch = d;
    } else {
      V3.yaw = Math.max(-1.25, Math.min(1.25, V3.yaw - dx * 0.006));
      V3.pitch = Math.max(-0.05, Math.min(0.9, V3.pitch + dy * 0.004));
    }
    draw3D();
  });
  const up = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = 0;
    if (moved < 6 && e.type === 'pointerup') tap3D(e);
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener(
    'wheel',
    e => {
      e.preventDefault();
      V3.zoom = Math.max(0.35, Math.min(2.2, V3.zoom * (e.deltaY > 0 ? 1.1 : 0.9)));
      draw3D();
    },
    { passive: false }
  );
  cv.addEventListener('dblclick', () => {
    Object.assign(V3, { yaw: -0.42, pitch: 0.1, zoom: 1 });
    draw3D();
  });
}
function tap3D(e) {
  const T = V3.T,
    rc = V3.r.domElement.getBoundingClientRect(),
    v = new T.Vector2(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1),
    ray = new T.Raycaster();
  ray.setFromCamera(v, V3.cam);
  const hit = ray.intersectObjects(V3.meshes, false)[0];
  selectFront(hit ? hit.object.userData.fid : null);
}

/* ==== 30-ui.js ====
   The four steps (1 Cabinets · 2 Fronts · 3 Handles · 4 Order), the panel for each, the picture switch

const STEPS = [
  ['cabs', 'Cabinets'],

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const segC = (act, c, cur, opts) =>

function render() {
  if (!matOk(S.style, S.mat)) S.mat = 'painted';

/* "100 50 100" or "2x100 50" → widths, each snapped to the nearest IKEA width */
function parseWidths(txt, widths) {
  const out = [];
  String(txt || '')
    .replace(/,/g, ' ')
    .split(/\s+/)
    .filter(Boolean)
    .forEach(t => {
      const m = t.match(/^(?:(\d+)\s*[x×*])?(\d{2,3})$/i);

      const n = Math.min(12, +(m[1] || 1)),
        w = widths.reduce((b, v) => (Math.abs(v - +m[2]) < Math.abs(b - +m[2]) ? v : b), widths[0]);
      for (let i = 0; i < n; i++) out.push(w);

    }${

  const L = layout(),

    `<h2>Order your fronts</h2><p class="lede">${P.n} fronts · <b>${eur(P.total)}</b> incl. VAT and delivery. We check every size with you before we cut.</p>

function sendOrder() {
  const v = id => (document.getElementById(id).value || '').trim();
  if (!v('oName') || !/.+@.+\..+/.test(v('oMail'))) {
    document.querySelector('#mbox .hint').textContent = 'Please fill in your name and a valid e-mail address.';
    return;
  }
  const txt = orderText() + `\n\nFrom: ${v('oName')} <${v('oMail')}>, ${v('oZip')}\n${v('oNote')}`;
  try {
    const all = JSON.parse(localStorage.getItem('bruis-fronts-orders') || '[]');
    all.push({ at: Date.now(), txt });
    localStorage.setItem('bruis-fronts-orders', JSON.stringify(all));
  } catch (e) {
    /* fine */
  }
  document.getElementById('mbox').innerHTML =
    `<h2>Thank you, ${esc(v('oName').split(' ')[0])}!</h2><p class="lede">In the real shop BRUIS would now e-mail you to check the sizes and send a payment link. In this prototype nothing was sent — here is the order as text:</p><pre class="otext">${esc(txt)}</pre><div class="adds"><button type="button" class="btn pri" data-act="copyOrder">Copy</button><button type="button" class="btn" data-act="close">Close</button></div>`;
  S.lastOrder = txt;
  save();
}

/* ---------- a look change, for all fronts or for one ---------- */
function setLook(target, field, val) {
  if (target === 'all') {
    S[field] = val;
    if (field === 'mat' && MATS[val].only) S.style = MATS[val].only;
    if (field === 'style' && !matOk(val, S.mat)) S.mat = 'painted';
    S.recipe = null;
    return;
  }
  const cur = lookOf({ id: target }),
    nx = { style: cur.style, mat: cur.mat, col: cur.col };
  nx[field] = val;
  if (field === 'mat' && MATS[val].only) nx.style = MATS[val].only;
  if (field === 'style' && !matOk(val, nx.mat)) nx.mat = 'painted';
  S.fx[target] = nx;
}

/* ---------- taps ---------- */
document.addEventListener('click', e => {
  const fr = e.target.closest('#pic .front');
  if (fr) {
    selectFront(fr.dataset.f);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.a || '',
    [id, val] = a.split('|'),
    c = S.cabs.find(x => x.id === id);
  switch (b.dataset.act) {
    case 'step':
      S.step = a;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'next': {
      const i = STEPS.findIndex(s => s[0] === S.step);
      S.step = STEPS[Math.min(STEPS.length - 1, i + 1)][0];
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    }
    case 'view':
      S.view = a;
      break;
    case 'surprise':
      surprise();
      if (S.step === 'cabs') S.step = 'fronts';
      break;
    case 'sys':
      if (a !== S.sys) {
        // another system starts from an example row of its cabinets; the look you chose stays
        const keep = {
          style: S.style,
          flute: S.flute,
          mat: S.mat,
          col: S.col,
          gframe: S.gframe,
          handle: S.handle,
          hfin: S.hfin,
          view: S.view
        };
        S = Object.assign(freshState(a), keep, { step: 'cabs' });
      }
      break;
    case 'quick':
      S.cabs = quickMake(QUICK[S.sys][+a][1]);
      S.flip = {};
      S.fx = {};
      break;
    case 'qh':
      S.qh = +a;
      break;
    case 'typed': {
      const kinds = SYS[S.sys].kinds,
        got = [];
      if (S.sys === 'metod') {
        S.twBase = document.getElementById('twBase').value;
        S.twWall = document.getElementById('twWall').value;
        parseWidths(S.twBase, kinds.base.widths).forEach(w => got.push(cab('metod', 'base', w, 80)));
        parseWidths(S.twWall, kinds.wall.widths).forEach(w => got.push(cab('metod', 'wall', w, 80)));
        // keep the tall cabinets you already had
        S.cabs.filter(x => x.kind === 'high').forEach(x => got.unshift(x));
      } else {
        S.twFrame = document.getElementById('twFrame').value;
        const h = S.qh && kinds.frame.heights.includes(S.qh) ? S.qh : kinds.frame.heights[1];
        parseWidths(S.twFrame, kinds.frame.widths).forEach(w => got.push(cab(S.sys, 'frame', w, h)));
      }
      if (got.length) {
        S.cabs = got;
        S.flip = {};
        S.fx = {};
      }
      break;
    }
    case 'addw': {
      const kd = SYS[S.sys].kinds[id],
        h =
          kd.heights.length === 1
            ? kd.heights[0]
            : S.sys === 'metod'
              ? kd.heights[id === 'wall' ? 2 : 1]
              : S.qh && kd.heights.includes(S.qh)
                ? S.qh
                : kd.heights[1];
      S.cabs.push(cab(S.sys, id, +val, h));
      break;
    }
    case 'cw':
      if (c) {
        c.w = +val;
        fixLayout(c);
      }
      break;
    case 'ch':
      if (c) {
        c.h = +val;
        fixLayout(c);
      }
      break;
    case 'cl':
      if (c) c.layout = val;
      break;
    case 'mv': {
      const i = S.cabs.indexOf(c),
        j = i + +val;
      if (c && j >= 0 && j < S.cabs.length) [S.cabs[i], S.cabs[j]] = [S.cabs[j], S.cabs[i]];
      break;
    }
    case 'del':
      S.cabs = S.cabs.filter(x => x !== c);
      break;
    case 'impEx':
      S.impText = IMPORT_EXAMPLE;
      S.impOpen = true;
      S.impMsg = '';
      break;
    case 'imp': {
      const t = document.getElementById('impText').value;
      S.impText = t;
      S.impOpen = true;
      const r = parsePlanner(t);
      if (!r.found.length) {
        S.impMsg =
          'No PAX, METOD or BESTÅ frames found in that list. Each line needs the name and a size like 60x60x80 cm.';
        break;
      }
      const bySys = {};
      r.found.forEach(x => (bySys[x.sys] = (bySys[x.sys] || 0) + 1));
      const main = Object.entries(bySys).sort((p, q) => q[1] - p[1])[0][0];
      S.sys = main;
      S.cabs = r.found.filter(x => x.sys === main);
      S.flip = {};
      S.fx = {};
      const other = Object.entries(bySys).filter(([k]) => k !== main);
      S.impMsg = `Found ${S.cabs.length} ${SYS[main].name} cabinet${S.cabs.length === 1 ? '' : 's'}.${other.length ? ` The list also has ${other.map(([k, n]) => `${n} ${SYS[k].name}`).join(' and ')} — one system per order for now; switch above to do those next.` : ''}${r.skipped.length ? ` Skipped ${r.skipped.length} line${r.skipped.length === 1 ? '' : 's'} that are not frames.` : ''}`;
      break;
    }
    case 'lk': {
      const [t, field, v] = a.split('|');
      setLook(t, field, v);
      break;
    }
    case 'own':
      if (S.sel) {
        if (a === 'same') delete S.fx[S.sel];
        else S.fx[S.sel] = { style: S.style, mat: S.mat, col: S.col };
      }
      break;
    case 'copycab': {
      const L = layout(),
        f = L.fronts.find(x => x.id === S.sel);
      if (f && S.fx[f.id])
        L.fronts.filter(x => x.cab === f.cab).forEach(x => (S.fx[x.id] = Object.assign({}, S.fx[f.id])));
      break;
    }
    case 'desel':
      S.sel = null;
      break;
    case 'flip':
      if (S.sel) {
        if (S.flip[S.sel]) delete S.flip[S.sel];
        else S.flip[S.sel] = 1;
      }
      break;
    case 'unflip':
      S.flip = {};
      break;
    case 'pitch':
      S.flute.pitch = +a;
      break;
    case 'gpitch':
      S.flute.gpitch = +a;
      break;
    case 'fdir':
      S.flute.dir = a;
      break;
    case 'gframe':
      S.gframe = a;
      break;
    case 'handle':
      S.handle = a;
      if (a === 'tab' && S.hfin === 'steel') S.hfin = 'black';
      break;
    case 'hfin':
      S.hfin = a;
      break;
    case 'orderNow':
      openOrder();
      return;
    case 'send':
      sendOrder();
      return;
    case 'copyOrder':
      try {
        navigator.clipboard.writeText(S.lastOrder || orderText());
        b.textContent = 'Copied';
      } catch (er) {
        /* ignore */
      }
      return;
    case 'close':
      document.getElementById('modal').hidden = true;
      return;
    default:
      return;
  }
  render();
});

/* ==== 40-import.js ====
   Read the item list from the IKEA planner (copied as text, or typed): every line with a PAX, METOD or BESTÅ
   frame/cabinet and its size becomes a cabinet. Doors, hinges, legs and the rest are skipped.
   Understands quantities like "2 x …", "2× …", "… 2 pcs", "Qty: 2", and sizes like 60x60x80 cm (width first).
*/
const IMPORT_EXAMPLE = `PAX Wardrobe frame, white, 100x58x236 cm   2 pcs
PAX Wardrobe frame, white, 50x58x236 cm   1 pcs
KOMPLEMENT Hinge with damper, 4 pack   3
METOD Base cabinet frame, white, 60x60x80 cm   Qty: 2
METOD Wall cabinet frame, white, 40x37x80 cm   1
METOD High cabinet frame, white, 60x60x200 cm   1
BESTÅ Frame, white, 120x40x38 cm   1`;

function parsePlanner(text, only) {
  const found = [],
    skipped = [];
  String(text || '')
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(Boolean)
    .forEach(line => {
      const up = line.toUpperCase(),
        sys = /\bPAX\b/.test(up)
          ? 'pax'
          : /\bMETOD\b/.test(up)
            ? 'metod'
            : /\bBEST[AÅ](?![A-Z])/.test(up)
              ? 'besta'
              : null;
      const isFrame =
        /FRAME|CABINET|STOMME|KORPUS|CORPS|KAST/.test(up) &&
        !/DOOR|FRONT|HINGE|LEG|PLINTH|SHELF|RAIL|DRAWER(?! UNIT)/.test(up.replace(/CABINET FRAME/, ''));
      const dm = line.match(/(\d{2,3})\s*[x×]\s*(\d{2,3})(?:\s*[x×]\s*(\d{2,3}))?\s*cm/i);
      if (!sys || !isFrame || !dm) {
        if (sys && !isFrame) skipped.push(line);
        return;
      }
      if (only && sys !== only) {
        skipped.push(line);
        return;
      }
      const a = +dm[1],
        c3 = dm[3] ? +dm[3] : null;
      // width × depth × height (IKEA's order); with two numbers: width × height
      const w = a,
        h = c3 != null ? c3 : +dm[2];
      let kind = 'frame';
      if (sys === 'metod') kind = /WALL/.test(up) ? 'wall' : /HIGH|TALL/.test(up) ? 'high' : 'base';
      const kd = SYS[sys].kinds[kind];
      const W = kd.widths.reduce((b, v) => (Math.abs(v - w) < Math.abs(b - w) ? v : b), kd.widths[0]),
        Hh = kd.heights.reduce((b, v) => (Math.abs(v - h) < Math.abs(b - h) ? v : b), kd.heights[0]);
      const q = +(
        (line.match(/^(\d+)\s*[x×]\s+/i) || [])[1] ||
        (line.match(/(?:qty|quantity|antal|aantal)\s*:?\s*(\d+)/i) || [])[1] ||
        (line.match(/(\d+)\s*(?:pcs|pc|st|stk|pieces|x)\s*$/i) || [])[1] ||
        (line.match(/\s(\d{1,2})\s*$/) || [])[1] ||
        1
      );
      for (let i = 0; i < Math.min(q, 20); i++) found.push(cab(sys, kind, W, Hh));
    });
  return { found, skipped };
}

/* ==== 45-surprise.js ====
   "Surprise me": not a dice roll but a recipe, like Fitted's. Each recipe is a small rule set a designer would use —
   one bold colour, wood with one colour, two colours that go together, a glass accent, birch, walnut — and gives
   every front its look by what it is: a tall door, a drawer, a wall cabinet, the top row. Handles follow the colours:
   brass on dark and saturated colours, black on light colours and birch, the same colour for a quiet look.
*/
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
const BOLD = ['cobalt', 'midnight', 'racing', 'mustard', 'terracotta', 'tomato', 'oxblood', 'plum'];
const DARK = { cobalt: 1, midnight: 1, racing: 1, oxblood: 1, plum: 1, black: 1, terracotta: 1, tomato: 1 };
// colours that sit well together (first the main one, then the partner)
const PAIRS = [
  ['cobalt', 'chalk'],
  ['racing', 'blush'],
  ['oxblood', 'blush'],
  ['terracotta', 'sage'],
  ['midnight', 'mustard'],
  ['plum', 'sage'],
  ['tomato', 'chalk'],
  ['racing', 'mustard'],
  ['black', 'terracotta']
];
/* what a front is, for the rules */
function roleOf(f) {
  if (f.kind === 'drawer') return 'drawer';
  if (f.ckind === 'wall') return 'wall';
  if (f.sys === 'besta') return f.y > 700 ? 'top' : 'low';
  if (f.h > 1200) return 'tall';
  return 'door';
}
const RECIPES = [
  {
    name: 'One bold colour',
    make(r) {
      const c = pick(r, BOLD);
      return {
        all: { mat: 'painted', col: c, style: pick(r, ['fluted', 'fluted', 'grooves']) },
        by: { drawer: { style: 'flat' } },
        hfin: DARK[c] ? 'brass' : 'black',
        say: COLOURS[c].name
      };
    }
  },
  {
    name: 'Wood and one colour',
    make(r) {
      const wood = pick(r, ['oak', 'walnut']),
        c = pick(
          r,
          wood === 'oak'
            ? ['racing', 'cobalt', 'terracotta', 'midnight', 'tomato']
            : ['mustard', 'blush', 'sage', 'chalk', 'terracotta']
        );
      return {
        all: { mat: wood, style: pick(r, ['flat', 'fluted']) },
        by: {
          drawer: { mat: 'painted', col: c, style: 'flat' },
          wall: { mat: 'painted', col: c, style: 'flat' },
          top: { mat: 'painted', col: c, style: 'flat' }
        },
        hfin: wood === 'walnut' ? 'brass' : 'black',
        say: `${MATS[wood].name.replace(' veneer', '')} & ${COLOURS[c].name.toLowerCase()}`
      };
    }
  },
  {
    name: 'Two colours',
    make(r) {
      const [a, b] = pick(r, PAIRS);
      return {
        all: { mat: 'painted', col: a, style: 'fluted' },
        by: { wall: { col: b, style: 'flat' }, top: { col: b, style: 'flat' }, drawer: { col: a, style: 'flat' } },
        hfin: DARK[a] ? 'brass' : 'black',
        say: `${COLOURS[a].name} & ${COLOURS[b].name.toLowerCase()}`
      };
    }
  },
  {
    name: 'Glass accent',
    make(r) {
      const base = pick(r, ['walnut', 'oak', 'painted']),
        c = pick(r, ['midnight', 'racing', 'oxblood', 'black', 'chalk']);
      const look = base === 'painted' ? { mat: 'painted', col: c, style: 'flat' } : { mat: base, style: 'flat' };
      return {
        all: look,
        by: { wall: { mat: 'glass' }, top: { mat: 'glass' }, tall: { mat: 'glass', every: 2 } },
        gframe: base === 'oak' ? 'oak' : pick(r, ['black', 'alu']),
        hfin: base === 'walnut' || DARK[c] ? 'brass' : 'black',
        say: `${base === 'painted' ? COLOURS[c].name : MATS[base].name.replace(' veneer', '')} & fluted glass`
      };
    }
  },
  {
    name: 'Birch with colour',
    make(r) {
      const c = pick(r, ['tomato', 'cobalt', 'mustard', 'racing', 'blush']);
      return {
        all: { mat: 'birch', style: 'flat' },
        by: { drawer: { mat: 'painted', col: c, style: 'flat' } },
        handle: pick(r, ['push', 'tab', 'grip']),
        hfin: 'black',
        say: `Birch & ${COLOURS[c].name.toLowerCase()}`
      };
    }
  },
  {
    name: 'Playful scallops',
    make(r) {
      const [a, b] = pick(
        r,
        PAIRS.filter(p => p[1] !== 'chalk')
      );
      // scallops on drawers and low doors; tall doors stay calm and flat, the top row in the partner colour
      return {
        all: { mat: 'painted', col: a, style: 'scallop' },
        by: { tall: { style: 'flat' }, wall: { col: b, style: 'flat' }, top: { col: b } },
        handle: pick(r, ['knob', 'push']),
        hfin: DARK[a] ? 'brass' : 'black',
        say: `Scallops in ${COLOURS[a].name.toLowerCase()}`
      };
    }
  },
  {
    name: 'Walnut, quietly',
    make() {
      return {
        all: { mat: 'walnut', style: 'fluted' },
        by: { drawer: { style: 'flat' } },
        handle: 'bar',
        hfin: 'brass',
        say: 'Walnut'
      };
    }
  }
];
function surprise(seed) {
  const r = prng(seed || Date.now() & 0xffffffff),
    L = layout();
  // glass needs something to show off: skip glass recipes when nothing suits it
  const okR = RECIPES.filter(
    x => x.name !== 'Glass accent' || L.fronts.some(f => ['wall', 'top', 'tall'].includes(roleOf(f)))
  );
  let rec = pick(r, okR);
  if (okR.length > 1 && rec.name === S.recipe)
    rec = okR[(okR.indexOf(rec) + 1 + Math.floor(r() * (okR.length - 1))) % okR.length];
  const plan = rec.make(r);
  S.style = plan.all.style || 'flat';
  S.mat = plan.all.mat;
  if (plan.all.col) S.col = plan.all.col;
  S.fx = {};
  const count = {};
  L.fronts.forEach(f => {
    const role = roleOf(f),
      o = plan.by[role];
    if (!o) return;
    count[role] = (count[role] || 0) + 1;
    if (o.every && count[role] % o.every) return; // e.g. every other tall door in glass
    const lk = Object.assign({}, plan.all, o);
    delete lk.every;
    if (lk.mat !== S.mat || lk.style !== S.style || (lk.col && lk.col !== S.col)) S.fx[f.id] = lk;
  });
  if (plan.gframe) S.gframe = plan.gframe;
  S.handle = plan.handle || pick(r, ['knob', 'bar', 'knob', 'push']);
  S.hfin = S.handle === 'tab' ? 'black' : plan.hfin || 'brass';
  S.recipe = rec.name;
  S.recipeSay = plan.say;
  S.sel = null;
}

/* ==== 99-start.js ==== draw the first screen once every file is loaded */
render();
